ರಿಯನ್ನು ಹುಡುಕುತ್ತಿದ್ದಾನೆ ಎಂದು ನಾವು ತಿಳಿಯುವಂತಾಗಲಿ. ನಾವು ಅವರೊಂದಿಗೆ ದೇವರ ವಾಕ್ಯದಿಂದ ಸ್ವಾಧೀಕರಿಸಲ್ಪಟ್ಟ ಪ್ರಾರ್ಥನೆ ಮತ್ತು ಪ್ರೀತಿಯಿಂದ ಮತಾಡುವಂತಾಗಲಿ. ಇದರ ಮೂಲಕ ನಾವು ಆ ಕಡೆಯ ಕುರಿಮರಿಯನ್ನು ಕಾಣುವಂಥಾಗಲಿ ಮತ್ತು ನಾವು ಸಮಾಧಾನದಿಂದ (ನಮ್ಮ) ನಿತ್ಯ ಮನೆಗೆ ಹೋಗುವಂಥಾಗಲಿ. ಮತ್ತು ಈ ಸೈತಾನನ ಹಳೇ ಏದೆನ್‌ನಿಂದ ಹೊರಗೆ ಹೋಗುವಂಥಾಗಲಿ, ಕರ್ತನೆ\n91ಯಾಕೆಂದರೆ ಇದೆಲ್ಲವೂ ಮೋಹ, ಸುಂದರಿಯರಾದ ಹೆಂಗಸರು ಮತ್ತು ಈ ಲೋಕದ ಅಲ್ಲಿರುವ ಜಾಹೀರಾತುಗಳಾದ “ನಾವು ಜಾಹೀರಾತು ಮಾಡುತ್ತೇವೆ ಮತ್ತು ಹುಡುಗರು ಅವರ ಮುಖದ ಮೇಲೆ ಜಾಮ್ ಹಾಕಿಕೊಂಡು ಬರಬೇಕೆಂದು ಅಪೇಕ್ಷಿಸುತ್ತೇವೆ. ಮತ್ತು ಸುಂದರಿಯರಾದ ಹುಡುಗಿಯರು ಚಡ್ಡಿ ಹಾಕಿಕೊಂಡು ಬರಲಿ' ಎಂಬಂಥವಿಷಯಗಳಿಂದ ತುಂಬಿದಂಥ ಲೋಕವಾಗಿದೆ.\nನಮ್ಮರೇಡಿಯೋ,ಟೆಲಿವಿಷನ್‌ಗಳಲ್ಲಿ ಎಲ್ಲಾ ರೀತಿಯ ಕೊಳಕು ಮತ್ತು ಅಶುದ್ಧತೆ ಮತ್ತು ಹಾಲಿವುಡ್ ಎಲ್ಲಾ ರೀತಿಯ ಲೈಂಗಿಕ, ಹೊಲಸಾದ, ಅಶುದ್ಧವಾದ ಸ್ತ್ರೀಯರ ಉಡುಪುಗಳು ಮತ್ತು ಮನುಷ್ಯನು ಕೆಡಿಸಲ್ಪಟ್ಟು ಸ್ತ್ರೀಯರ ವಸ್ತ್ರಗಳನ್ನು ಉಡುವಂಥಾದ್ದು ಮತ್ತು ಅವರ ಕೂದಲುಗಳನ್ನು ಸ್ತ್ರೀಯರ ಕೂದಲಿನಂತೆ ಇಡುವಂಥಾದ್ದು ಮತ್ತು ಸ್ತ್ರೀಯರು ಪುರುಷರಂತೆ ಕೂದಲು ಕತ್ತರಿಸುವಂಥಾದ್ದು (ಇಂಥಾ ಹೊಲಸು).\nಓ, ದೇವರೇ ಎಂಥಾ ಭಯಂಕರವಾದ ಗಳಿಗೆಯಲ್ಲಿ ನಾವು ಜೀವಿಸುತ್ತಿದ್ದೇವೆ? ಓ, ಯೇಸು ಕರ್ತನೇ ಬಾ. ಬಂದು ನಮ್ಮೆಲ್ಲರನ್ನು ನಿನ್ನ ರಕ್ತದಿಂದ ತೊಳೆದು ಬಿಡು ಕರ್ತನೇ. ನಮ್ಮಿಂದ ಎಲ್ಲಾ ಕೊಳಕು ಮತ್ತು ಕಹಿಯನ್ನು ತೆಗೆದುಬಿಡು. ನಾವು ಜೀವಿಸುವಂಥಾಗಲಿ, ಸ್ವಾಮೀ, ನಿಮ್ಮ ಮುಂದೆ ನ್ಯಿವಾಗಿ ರಕ್ತದ ಕೆಳಗೆ ನಾವು ಜೀವಿಸುವಂಥಾಗಲಿ. ಇದು ನಮ್ಮ ಹೃದಯದ ಬಯಕೆಯಾಗಿದ. ಮತ್ತು ನಮ್ಮ ಪ್ರಾಮಾಣಿಕವಾದ ( ನಿಷ್ಕಪಟವಾದ)ಯಾಚನೆ ಯಾಗಿದೆ.\n92ಪ್ರೀಯ ದೇವರೇ ಈ ರಾತ್ರಿ ಈ ಸುಸಮಾಚಾರ ಪ್ರಕಟಿಸಲ್ಪಟ್ಟ ಈ ಪೀಠದ ಮೇಲೆ ಸ್ವಾಮೀ, ಇಲ್ಲಿ ಈ ಕರವಸ್ತ್ರಗಳು ಮತ್ತು ಚಿಕ್ಕ ಕಟ್ಟುಗಳು, ರೋಗಪೀಡಿತರಿಗೂ, ಬಾಧೆಪಡುವವವರಿಗೂ ಕಳುಹಿಸಲ್ಪಡುತ್ತವೆ. ಕರ್ತನೇ ವಿಶ್ವಾಸದಿಂದ ತುಂಬಿದ ಪ್ರಾರ್ಥನೆಯು, ಈಗ ನಿನ್ನ ದೃಷ್ಟಿಯಲ್ಲಿ ನಮ್ಮ ಹೃದಯದಿಂದ ಇದರ ಮೇಲೆ ಬೀಳಲಿ. ಮತ್ತು ಕರ್ತನೇ, ನಮ್ಮಲ್ಲಿ ಯಾವದಾದರೂ ಅಶುದ್ಧತೆ ಇರುವದಾದರೆ, ಕರ್ತನೇ ನಮ್ಮನ್ನು ಈಗ ನ್ಯಾಯಾಸನದ ಬಳಿಗೆಕೊಂಡು ಹೋಗು; ಮತ್ತು ನಾವು ನಿನ್ನ ಕರುಣೆಯನ್ನು ಯಾಚಿಸುವವರಾಗಿದ್ದೇವೆ.\nಕರ್ತನೇ, ನಾವೇನು ತಪ್ಪು ಮಾಡುತ್ತಿದ್ದೇವೆಂದು ನಮಗೆ ಪ್ರಕಟಿಸು, ಹೀಗಿರುವದರಿಂದ ನಾವು ನಿನ್ನನ್ನು ಪ್ರಾರ್ಥಿಸಿ, ನಿನ್ನ ರಕ್ತದ ಮೂಲಕ ನಮ್ಮನ್ನು ಶುದ್ದೀಕರಿಸಿಕೊಳ್ಳುವೆವು. ಈ ರೋಗಿಗಳನ್ನು ವಾಸಮಾಡು, ಮತ್ತು ಅವರನ್ನು ಗುಣಮಾಡು; ತಂದೆಯೇ ಅದು ಏನೇ ಆಗಲಿ, ಅವರಲ್ಲಿಯೇ ಹೋಗಲಿ, ಅದು ಹಾಗಾಗಲಿ,(ಅವರಿಗೆ ವಾಸಿಯಾಗಲಿ) ತಂದೆಯೇ.\n93ನಮಗೆ ನಿಮ್ಮನು ಸೇವಿಸಬೇಕೆಂಬ ದೃಢ ನಿರ್ಧಾರವನ್ನು ಕೊಡು; ಮತ್ತು ನಿನ್ನನ್ನೇ ಸೇವಿಸುವಂಥಾಗಲಿ. ಇದನ್ನು ದಯಪಾಲಿಸು ಕರ್ತನೇ. ಈಗ ದಾರಿಯಲ್ಲಿ ಮನೆಗೆ ಹೋಗುತ್ತಿರುವ ಈ ಪ್ರಿಯ ಜನರಿಗೆ ನೀನು ಸುರಕ್ಷಿತತೆಯನ್ನು ದಯಪಾಲಿಸು. ನೀನು ಜನರನ್ನು ಆ ರೀತಿಯಾಗಿ ಗುಣಪಡಿಸಿದ್ದಕ್ಕೆ ನಿನ್ನನ್ನು ಸ್ತುತಿಸುವವರಾಗಿದ್ದೇವೆ ಮತ್ತು ಸಹೋದರಿ ಶೆಫರ್ಡ್, ಮತ್ತು ಸಹೋದರ ಶೆಫರ್ಡ್‌ ಚಿಕ್ಕ ಹುಡುಗ, ಸೈಕಲಿನಲ್ಲಿ ಬಿದ್ದು ಗಾಯಗೊಂಡಾತನು, ಆತನಿಗೆ ಯಾವ ತೊಂದರೆಯೂ ಆಗದಂತೆ ನಾನು ಪ್ರಾರ್ಥಿಸುತ್ತೇನೆ. ಆ ಸೈಕಲ್ ಚಲಿಸುವ ಚಿಕ್ಕ ಹುಡುಗನು, ಅವನು ಗುಣಹೊಂದುವಂತೆ ನಾನು ಪ್ರಾರ್ಥಿಸುತ್ತೇನೆ. ನಾವು ಕೇಳಿಕೊಂಡ ಇತರರನ್ನು ನೀನು ಗುಣ ಮಾಡಿದ್ದಕ್ಕಾಗಿ ನಾವು ನಿನ್ನನ್ನು ಸುತ್ತಿಸುತ್ತೇವೆ. ಮತ್ತು ನಾವು ಕೇಳಿ ನಾವು ಪಡೆದುಕೊಳ್ಳುತ್ತೇವೆಂದು ನಮಗೆ ತಿಳಿದಿದೆ ಯಾಕಂದರೆ ನಾವು ವಾಗ್ದಾನ ಮಾಡಿದಾತನ ಮೇಲೆ ಭರವಸೆವುಳ್ಳವರಾಗಿದ್ದೇವೆ. ಕರ್ತನೇ, ನಮ್ಮ ಮೇಲೆ ಕೃಪೆದೋರಿಸು, ಮತ್ತು ನಮ್ಮ ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸು, ಇದನ್ನು ನಾವು ಯೇಸುಕ್ರಿಸ್ತನ ಹೆಸರಿನಲ್ಲಿ ಬೇಡುತ್ತೇವೆ. ಆಮೆನ್.\n94ನೀವು ಆತನನ್ನು ಪ್ರೀತಿಸುತ್ತೀರೋ? ನೀವು ಆತನನ್ನು ಪ್ರೀತಿಸುತ್ತೀರೋ? ಸೈತಾನನ ರಾಜ್ಯದ ವಿಷಯವಾಗಿ ನೀನು ರೋಗಿಯಂತೆಯೂ, ಬೇಸತ್ತು ಹೋಗಿ ಇದ್ದಿಯೋ? ಆ ಸಾವಿರ ವರ್ಷದ ಆಳ್ವಿಕೆಯು ತೀರ ಹತ್ತಿರವಾಗಿದೆ ಎಂದು ನೀನು ವಿಶ್ವಾಸ ಮಾಡುತ್ತಿಯೋ? - ಆತನ ವರ್ಷದ ಆಳ್ವಿಕೆ?ಆತನ, ಆತನ ಏದೆನ್?ಅದು ಈಗ ತಯಾರಾಗುತ್ತಿದೆ ಎಂದು ನೀನು ವಿಶ್ವಾಸವಿಡುತ್ತಿಯೋ? ನೋಡಿರಿ, ಎಲ್ಲವೂ ಬುದ್ದಿವಂತಿಕೆಯ ಮೇಲೆ ಹೊಂದಿಕೊಂಡಿರುತ್ತದೆ. ಅವರು ನಂಬುವ ಮೊದಲು ಎಲ್ಲವೂ ಅಂದರೆ ಪ್ರತಿಯೊಂದು ವೈಜ್ಞಾನಿಕವಾಗಿ ಸಾಧಿಸಲ್ಪಡಬೇಕು. ಮತ್ತು ನೀನು ದೇವರನ್ನು ವೈಜ್ಞಾನಿಕವಾಗಿ ಎಂದೂ ಸಾಧಿಸಿತೋರಿಸಲಾರೆ (ಆಮೆನ್!) ನೀನು ಆತನನ್ನು ನಂಬಿಕೆಯಿಂದಲೇ ಸ್ವೀಕರಿಸಬೇಕಾಗಿದೆ. “ಯಾಕೆಂದರೆ, ದೇವರ ಬಳಿಗೆ ಬರುವವನು,ದೇವರು ಇದ್ದಾನೆ, ಮತ್ತು ಆತನನ್ನು ಆಸಕ್ತಿಯಿಂದ ಹುಡುಕುವವರಿಗೆ ಅದರ ಫಲವನ್ನು ಕೊಡುವವನಾಗಿದ್ದಾನೆ ಎಂದು ನಂಬುವದು ಅವಶ್ಯವಾಗಿದೆ”.\nಓ, ದೇವರೇ, ನಾನು ಯಾವದನ್ನೂ ತಿಳಿಯ ಬಯಸುವದಿಲ್ಲ, ಆದರೆ ಕೇವಲ ನನ್ನನ್ನು ನಾನು ಪಾದದಿಂದ ತೊಳೆಯಬಲ್ಲ ಯೇಸು ಕ್ರಿಸ್ತನ ರಕ್ತವನ್ನೇ. ಯೇಸು ಕ್ರಿಸ್ತನನ್ನಲ್ಲದೆ ಬೇರೆ ಯಾವದನ್ನೂ ನಾನು ತಿಳಿದಿಲ್ಲ. ಮತ್ತು ಆ ದಿನದಲ್ಲಿ ಪೌಲನು ಹೇಳಿದಂತೆ ನಾನೂ ಹೇಳುವವನಾಗಿದ್ದೇನೆ, ಇಂದು ರಾತ್ರಿ “ನಿಮ್ಮ ಮಧ್ಯದಲ್ಲಿ ನಾನು ಯೇಸು ಕ್ರಿಸ್ತನನ್ನು ಮತ್ತು ಆತನು ಶಿಲುಬೆಗೆ ಏರಿಸಲ್ಪಟ್ಟದ್ದನ್ನು ಹೊರತು ಬೇರೆ ಯಾವದನ್ನೂ ತಿಳಿಯದವನಾಗಿದ್ದೇನೆ”.\n95ನಾನು ನಿಮಗೆ ಒಂದನ್ನೇ ಹೇಳಲು ಶಕ್ತನಾಗಿದ್ದೇನೆ ಏನೆಂದರೆ ಈ ಬೈಬಲ್ (ವೇದವಾಕ್ಯವು), ಪರಿಪೂರ್ಣವಾದ, ಯಾವ ಮಿಶ್ರಣವನ್ನು ಮಾಡದ ದೇವರ ವಾಕ್ಯವಾಗಿದೆ ಎಂದು ನಾನು ನನ್ನ ಸಂಪೂರ್ಣ ಹೃದಯದಿಂದ ನಂಬುತ್ತೇನೆ. ಮತ್ತು ನಾನು ನನ್ನ ಹೃದಯವನ್ನು ಸರಿಯಾಗಿ ತಿಳಿದಿದ್ದೇನೆ. ನಾನು ಇದರ ಮೇಲೆಯೇ ಜೀವಿಸುತ್ತೇನೆ. ಇದರಿಂದಾಗಿಯೇ ನಾನು ನಿಂತಿರುತ್ತೇನೆ. ಮತ್ತು ನನಗೆ ಹತ್ತು ಸಾವಿರ ಜೀವವು ಸಿಗುವುದಾದರೆ, ಆದರ ಪ್ರತಿಯೊಂದು ಚಿಕ್ಕ ಪಾಲೂ ಸಹ, ನಾನು ಈ ವಾಕ್ಯಕ್ಕೋಸ್ಕರ ಕೊಡಲು ಬಯಸುವವನಾಗಿದ್ದೇನೆ. ಯಾಕೆಂದರೆ ಇದು ಯೇಸುಕ್ರಿಸ್ತನ ವಾಕ್ಯವಾಗಿರುತ್ತದೆ. ಮತ್ತು ಅವರೆಷ್ಟೇ ಅದನ್ನು ಸತ್ಯವಲ್ಲವೆಂದು ಹೇಳಲು ಪ್ರಯತ್ನ ಮಾಡಲಿ, ವಿಜ್ಞಾನವು ಅದು ನಂಬತಕ್ಕದಲ್ಲವೆಂದು ಹೇಳಲು ಎಷ್ಟೇ ಪ್ರಯತ್ನ ಮಾಡಲಿ, ನಾನು ಅದನ್ನು ಲಕ್ಷ್ಯಮಾಡೆನು, ನನಗಾದರೋ ಇಡೀ ಲೋಕದಲ್ಲಿ ನಂಬಬಹುದಾದ ಒಂದೇ ಒಂದು ವಿಷಯವೆಂದರೆ, ಅದು ಈ ವಾಕ್ಯವಾಗಿದೆ. ಆತನು ನನ್ನವನಾಗಿದ್ದಾನೆ. ನಾನು ಆತನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ. ನೀನು ಹಾಗೆ ಮಾಡುವದಿಲ್ಲವೋ?\n96ನಿನ್ನ ಹೃದಯದಲ್ಲಿ ಒಂದು ಪಾಪವಿರುವದಾದರೆ, ನಿನ್ನ ಹೃದಯದಲ್ಲಿ ಒಂದು ತಪ್ಪುಇರುವದಾದರೆ, ನಿನ್ನಲ್ಲಿ ಏನಾದರೂ ಇರುವದಾದರೆ, ಈಗ ಪ್ರಾರ್ಥಿಸು, ಮತ್ತು ನಿನ್ನನ್ನು ಕ್ಷಮಿಸಲು ದೇವರನ್ನು ಪ್ರಾರ್ಥಿಸು. ನೀವು ನನಗೋಸ್ಕರ ಪ್ರಾರ್ಥನೆಮಾಡಿರಿ, ನಾನು ನಿಮಗೋಸ್ಕರ ಪ್ರಾರ್ಥನೆ ಮಾಡುವೆನು. ದೇವರು ನಿಮ್ಮನ್ನು ಆಶೀರ್ವದಿಸಲಿ ಎಂದು ನನ್ನ ಪ್ರಾರ್ಥನೆಯಾಗಿರುತ್ತದೆ.\nನಾವು ಭೇಟಿಯಾಗುವವರೆಗೆ, ನಾವು ಭೇಟಿಯಾಗುವವರೆಗೆ,\nನಾವು ಭೇಟಿಯಾಗುವವರಗೆ ದೇವರು ನಿಮ್ಮೊಂದಿಗಿರಲಿ (God be with you till we meet again).\nನೀವು ಒಬ್ಬರನ್ನೊಬ್ಬರು ಪ್ರೀತಿಸುತ್ತೀರೋ? ಯೋಹಾನನು ಹೇಳಿದು “ಚಿಕ್ಕಮಕ್ಕಳೇ, ಒಬ್ಬರನ್ನೊಬ್ಬರು ಪ್ರೀತಿಸಿರಿ,” ಒಬ್ಬರನ್ನೊಬ್ಬರು ಪ್ರೀತಿಸಿರಿ, ಯಾಕೆಂದರೆ, ಪ್ರೀತಿಯು ಬಹಳ ಪಾಪಗಳನ್ನು ಮುಚ್ಚುತ್ತದೆ. ಈಗ ನಾವು ಒಬ್ಬರೊಬ್ಬರ ಕೈಯನ್ನು ಕುಲುಕಿಸೋಣ.\nನಾವು ಭೇಟಿಯಾಗುವವರಗೆ, ನಾವುಭೇಟಿಯಾಗುವವರೆಗೆ..\nನಾವು ಭೇಟಿಯಾಗುವವರೆಗೆ ದೇವರು ನಿಮ್ಮೊಂದಿಗಿರಲಿ.\nಈಗ ಒಬ್ಬರಿಗೊಬ್ಬರು ದಯೆ ತೋರಿಸಿರಿ,ಎಲ್ಲರಿಗೂ ದಯೆ ತೋರಿಸುವವರಾಗಿರಿ. ನಿನ್ನ ನೆರೆಯವನೊಂದಿಗೆ ಸರಿಯಾಗಿ ವರ್ತಿಸು. ಯೇಸುವು ಬರುವವರೆಗೆ ಯಾವ ಕಲೆಯೂ ಇಲ್ಲದವನಾಗಿರು.\nನಾವು ಭೇಟಿಯಾಗುವವರೆಗೆ ನಾವು ಭೇಟಿಯಾಗುವವರೆಗೆ,\nಯೇಸು ಪಾದದಲ್ಲಿ ನಾವು ಭೇಟಿಯಾಗುವವರೆಗೆ\n97ನೀನು ಆತನನ್ನು ಪ್ರೀತಿಸುತ್ತಿಯೋ?ಇದು ನನ್ನ ಪ್ರಾರ್ಥನೆಯಾಗಿದೆ. ನೀವು ನನಗೋಸ್ಕರ ಪ್ರಾರ್ಥನೆ ಮಾಡಿರಿ; ನಾನು ನಿಮಗೋಸ್ಕರ ಪ್ರಾರ್ಥಿಸುವೆನು. ಈಗ ನಾನು ಟುಸಾನಿಗೆ ಹಿಂತೆರಳಬೇಕು. ಮತ್ತು ದೇವರು ನಿಮ್ಮೆಲ್ಲರನ್ನು ಆಶೀರ್ವದಿಸಲೆಂದು ಪ್ರಾರ್ಥಿಸುತ್ತೇನೆ. ಅಲ್ಲಿಂದ ನಾನು ಕೆನಾಡಕ್ಕೆ ಪುನಃಹಿಂದೆ ಕೊಲೆರಾಡೋ ಮತ್ತು ಅದರ ಸುತ್ತ, ಸುತ್ತ, ಮತ್ತು ಸುತ್ತ ಹೋಗುತ್ತಿದ್ದೇನೆ. ನೋಡಿರಿ, ಅಲ್ಲಿ ಸಹೋದರ ಟೋನಿಯವರು ಇದ್ದಾರೆ, ಮತ್ತು ಒಂದು ಮಹಾಸಂಗತಿಯು ಸಂಭವಿಸಿತು. ನೇರವಾಗಿ ರೋಮಿನ ವೆಟಿಕಾನ್‌ನಲ್ಲಿ ಅವರು ಒಂದು ಭಕ್ತಿ ಸಂಜೀವನ ಕೂಟಕ್ಕಾಗಿ ಕರೆಯುತ್ತಿದ್ದಾರೆ. ನಾನು ಅಲ್ಲಿ ರೋಮಿಗೆ ಬಂದು, ಒಂದು ಭಕ್ತಿಸಂಜೀವನ ಕೂಟವನ್ನು ನಡಿಸುವಂತೆ - ರೋಮಿನಲ್ಲಿ, ಆತನು ಈಗಲೇ ಪುನಃ ಹಿಂತಿರುಗಿದ್ದಾನೆ. ಆ ಜನರೆಲ್ಲಾ ಒಟ್ಟಾಗಿ ಇದ್ದಾರೆ. ಅಲ್ಲಿ ಅವರಲ್ಲಿ ಮಹಾ ಒಂದು ಸ್ಥಳವಿದೆ; ಅಲ್ಲಿ ಸಾವಿರಾರು ಜನರನ್ನು ಕೂತುಕುಳ್ಳಿಸಲು ಸಾಧ್ಯವಿದೆ, ಮತ್ತು ನಾನು ಭಕ್ತಿ ಸಂಜೀವನಕ್ಕೋಸ್ಕರ ಅಲ್ಲಿ ಬರಬೇಕೆಂದು ಅವರು ಅಪೇಕ್ಷಿಸುತ್ತಾರೆ. ಇವರು ಆ ಸೇವೆಯಲ್ಲಿ ದೇವರ ಮಹಿಮೆಯನ್ನು ನೋಡಲು ಬಯಸುತ್ತಾರೆ. ನನಗೆ ತಿಳಿದಿಲ್ಲ. ಆದರೆ ನಾನು ಇದಕ್ಕೋಸ್ಕರ ಪ್ರಾರ್ಥಿಸಬೇಕು,ಮತ್ತು ಕರ್ತನು ನನಗೆ ಏನು ಹೇಳುತ್ತಾನೆಂದು ನೋಡಬೇಕು. ಓ, ದೇವರೇ, ನೆನಪಿನಲ್ಲಿಡಿರಿ, ನಾವೆಲ್ಲರೂ ಒಟ್ಟಾಗಿ, ಪ್ರಾರ್ಥಿಸೋಣ...\nನಾವು ಆ ಬರೋಣಕ್ಕೋಸ್ಕರ ಕಾಯುತ್ತಿದ್ದೇವೆ,\nನಮ್ಮ ಸ್ತೋತ್ರಕ್ಕೆ ಯೋಗ್ಯನಾದ ರಕ್ಷಕನನ್ನು\nಅಗೋ, ಆಅಂಜೂರದ ಎಲೆಗಳನ್ನು ನೋಡಿರಿ\nಈಗ ಹಸಿರಾಗುತ್ತಿವೆ,\nಆತನ ರಾಜ್ಯದಸುವಾರ್ತೆ,\nಪ್ರತಿಯೊಂದು ಜನಾಂಗಕ್ಕೆ ಸಾರಲ್ಪಟ್ಟಿದೆ,\nಮತ್ತು ನಾವು ಕಡೇಗಳಿಗೆಯಲ್ಲಿದ್ದೇವೆ ಎಂಬುದು ಕಾಣುತ್ತಿದೆ.\nಮತ್ತು ಸಂತೋಷವಾಗಿ ನಾವು ಈ ಸುಸಮಾಚಾರವನ್ನು ಸಾರುವೆವು\nಆತನ ಸೋತ್ರಯುಕ್ತವಾದಪ್ರತಕ್ಷತೆಯನ್ನು ಕೂಡಲೇ ಆತನು ಮಹಿಮೆಯಿಂದ ಬರುವನು,\nಪ್ರತಿಯೊಬ್ಬರಿಗೂ\nಹಾಗಾದರೆ ಕರ್ತನ ಭಕ್ತ ಜನರೇ ಎದ್ದೇಳಿರಿ\nಹೇಳಿರಿ, ಅಂತ್ಯವು ಹತ್ತಿರವಿರುವಾಗ ಏಕೆ ನಿದ್ರಿಸುತ್ತಿರುವಿರಿ\nಆ ಕಡೆಯ ಕರೆಯವಿಕೆಗಾಗಿ ತಯಾರಾಗಿರೋಣ.\n98ಆಕೆಯು ಪಶ್ಚಿಮದಿಂದ ತಿರುಗಿ, ಈ ಒಂದಾನೊಂದು ದಿನದಲ್ಲಿ ಪುನಃ ಸವಾರಿ ಮಾಡುವಳು. ಕೇವಲ ನೆನಪಿನಲ್ಲಿಡಿರಿ. ಆಕೆಯು ಖಂಡಿತವಾಗಿಯೂ ಬರುವಳು ಮತ್ತು ಅದು ಸತ್ಯ.\nಯೇಸುವಿನ ಹೆಸರನ್ನು ನಿಮ್ಮೊಂದಿಗೆ ಕೊಂಡು ಹೋಗಿರಿ,\nಶೋಕತಪ್ತವಾದ ಮತ್ತು ಕಷ್ಟಪಡುವ ಮಗುವೇ;\nಅದು ನಿನಗೆ ಸಂತೋಷವನ್ನು ಸಮಾಧಾನವನ್ನು ಕೊಡುವದು\nಎಲ್ಲೆಲ್ಲಿ ಹೋಗುತ್ತಿಯೋ ಅದನ್ನು ತೆಗೆದುಕೊಳ್ಳು.'\nಅಮೂಲ್ಯಹೆಸರು;ಓ ಎಷ್ಟು ಮಧುರ\nಲೋಕದ ನಿರೀಕ್ಷೆ ಮತ್ತು ಪರಲೋಕದ ಆನಂದ,\nಅಮೂಲ್ಯ ಹೆಸರು,ಓ ಎಷ್ಟು ಮಧುರ\nಲೋಕದ ನಿರೀಕ್ಷೆ ಮತ್ತು ಪರಲೋಕದ ಆನಂದ.\nಯೇಸುವಿನ ಹೆಸರಿನಲ್ಲಿ ಅಡ್ಡಬೀಳುತ್ತೇವೆ.\nಆತನ ಪಾದದಲ್ಲಿ ಸಾಷ್ಟಾಂಗ ಬೀಳುವೆವು.\nನಾವಾತನನ್ನು ಪರಲೋಕದಲ್ಲಿ ರಾಜಾಧಿರಾಜನಾಗಿ\nಕಿರೀಟ ಧಾರಣೆ ಮಾಡವೆವು\nನಮ್ಮ ಪ್ರಯಾಣ ಮುಗಿದಾಗ,\nಅಮೂಲ್ಯಹೆಸರು, ಓ ಎಷ್ಟು ಮಧುರ\nಲೋಕದ ನಿರೀಕ್ಷೆ ಮತ್ತು ಪರಲೋಕದ ಆನಂದ\nಅಮೂಲ್ಯಹೆಸರು, ಓ ಎಷ್ಟು ಮಧುರ\nಲೋಕದನಿರೀಕ್ಷೆ ಮತ್ತು ಪರಲೋಕದ ಆನಂದ\n99ಈಗ ಈ ಕಡೇ ಚರಣದಲ್ಲಿ ನಾವದನ್ನು ತಗ್ಗಿದ ಹೃದಯದಿಂದ ಹಾಡೋಣ. “ನಿನ್ನೊಂದಿಗೆ ಯೇಸುವಿನ ಹೆಸರನ್ನು ಕೊಂಡು ಹೋಗು, ಎಲ್ಲಾ ಬೋನುಗಳಿಂದ ತಡೆಯುವ ಗುರಾಣಿಯಂತೆ, ಮತ್ತು ನಿನ್ನ ಸುತ್ತು ಶೋಧನೆಗಳು ಬರುವಾಗ (ಸೈತಾನನ ರಾಜ್ಯದವುಗಳಾದ ಈ ಸಂಗತಿಗಳು) ಕೇವಲ ಆ ಪರಿಶುದ್ದ ಹೆಸರನ್ನು ಪ್ರಾರ್ಥನೆಯಲ್ಲಿ ಉಸಿರಾಡು; ಮತ್ತು ಮುಂದು ನಡಿ, ಇದು ಸಫಲವಾಗುವದು. ನಾನು ಅದನ್ನು ಪ್ರಯತ್ನಿಸಿದ್ದೇನೆ. ಕೇವಲ ಅದನ್ನು ಈಗ ನಂಬು. ಯಾಕೆಂದರೆ ಅದು ಸಫಲವಾಗುವದು. ಕೇವಲ ಆತನ ಪವಿತ್ರ ಹೆಸರನ್ನು ಪ್ರಾರ್ಥನೆಯಲ್ಲಿ ಉಸಿರಾಡು.\nನಿಮ್ಮೊಂದಿಗೆ ಯೇಸುವಿನ ಹೆಸರನ್ನು ತೆಗೆದುಕೊಳ್ಳಿರಿ.\nಎಲ್ಲಾ ಬೋನುಗಳಿಂದ ತಡೆಯುವ ಗುರಾಣಿಯಂತೆ\nನಿಮ್ಮಸುತ್ತು ಶೋಧನೆಗಳು ಮುತ್ತಿದಾಗ,\n(ಆಗ ಏನು ಮಾಡುವಿ?)\nಕೇವಲ ಆ ಪವಿತ್ರ ಹೆಸರನ್ನು ಪ್ರಾರ್ಥನೆಯಲ್ಲಿ ಉಸಿರಾಡು\n(ಆಗ ನಿನ್ನ ಮುಖದ ಮೇಲೆ ಪರದೆ ಮುಚ್ಚುವುದು)\nಅಮೂಲ್ಯ ಹೆಸರು (ಅಮೂಲ್ಯ ಹೆಸರು)\nಓ ಎಷ್ಟು ಮಧುರ\nಲೋಕದ ನಿರೀಕ್ಷೆ ಮತ್ತು ಪರಲೋಕದ ಆನಂದ;\nಅಮೂಲ್ಯ ಹೆಸರು, ಓ ಎಷ್ಟುಮಧುರ\nಲೋಕದನಿರೀಕ್ಷೆ ಮತ್ತು ಪರಲೋಕದ ಆನಂದ\nಈಗ ನಮ್ಮತಲೆಗಳನ್ನು ತಗ್ಗಿಸೋಣ. ನಾನು ಅಲ್ಲಿರುವ ಸಹೋದರ ಬೀಲರ್ ಅನ್ನು ಇಲ್ಲಿ ಪ್ಲೇಟ್ ಫಾರಂನ ಮೇಲ್ ಬರಲು ವಿಜ್ಞಾಪಿಸುವೆನು.\n(ಸಹೋದರ ಬ್ರನ್‌ಹಾಮ‌ ಹಾಡುವದನ್ನು ಮುಂದು ವರಿಸುತ್ತಾರೆ - ಸಂ.)\n100ಈಗ ನಮ್ಮತಲೆಗಳು ಮತ್ತು ಹೃದಯಗಳು ತಗ್ಗಲ್ಪಟ್ಟವುಗಳಾಗಿ, ನಮ್ಮ ಇಲ್ಲಿರುವ ಸಂಗಾತಿ, ಸಹೋದರ ಬೀಲರ್, ಸಹೋದರ ಎಸಲ್ ಬೀಲರ್ ಬಹಳ ನಾಜೂಕಾದ ಕ್ರೈಸ್ತ ಸಹೋದರರು, ಬಹಳ ಪ್ರಾಮಾಣಿಕರು. ಈ ರಾತ್ರಿ ಪ್ರಾರ್ಥನೆಯ ಮೂಲಕವಾಗಿ, ಈ ಸಭೆಯನ್ನು ಅವರು ಮುಕ್ತಾಯ ಮಾಡುವರೋ ಎಂಬುದಾಗಿ ನಾನು ಅವರನ್ನು ಕೇಳುವೆನು. ದೇವರು ನಿಮ್ಮನ್ನು ಆಶೀರ್ವದಿಸಲಿ, ಸಹೋದರ ಬೀಲರ್.","audioParts":[{"primary":"https://github.com/dannica0205/satans-eden-sermon/blob/main/01satans%20eden%20kannada.mp3","fallback":"https://archive.org/download/01satans-eden-kannada/01satans%20eden%20kannada.mp3"},{"primary":"https://github.com/dannica0205/satans-eden-sermon/blob/main/02satans%20eden%20kannada.mp3","fallback":"https://archive.org/download/01satans-eden-kannada/02satans%20eden%20kannada.mp3"},{"primary":"https://github.com/dannica0205/satans-eden-sermon/blob/main/03satans%20eden%20kannada.mp3","fallback":"https://archive.org/download/01satans-eden-kannada/03satans%20eden%20kannada.mp3"},{"primary":"https://github.com/dannica0205/satans-eden-sermon/blob/main/04satans%20eden%20kannada.mp3","fallback":"https://archive.org/download/01satans-eden-kannada/04satans%20eden%20kannada.mp3"}],"totTime":6055,"chks":[{"time":0,"para":1}],"scrollMode":"continuous","scrollSpeed":"-12"}}

  async function initializeAudioParts(parts) { partDurations = []; partStartTimes = []; const tempAudio = new Audio(); tempAudio.preload = 'metadata'; for (const part of parts) { try { const url = convertToStreamableUrl(part.primary); await new Promise((resolve, reject) => { tempAudio.src = url; tempAudio.onloadedmetadata = resolve; tempAudio.onerror = () => reject(`Failed primary: ${url}`); }); partDurations.push(tempAudio.duration); } catch (err) { console.warn(err); try { const fallbackUrl = convertToStreamableUrl(part.fallback); if (!fallbackUrl) throw new Error("No fallback."); await new Promise((resolve, reject) => { tempAudio.src = fallbackUrl; tempAudio.onloadedmetadata = resolve; tempAudio.onerror = () => reject(`Failed fallback: ${fallbackUrl}`); }); partDurations.push(tempAudio.duration); } catch (fallbackError) { console.error('CRITICAL: Audio failed from both primary and fallback sources.'); alert('Error loading audio. Please try another sermon or check your connection.'); return false; } } } let cumulativeTime = 0; for (const duration of partDurations) { partStartTimes.push(cumulativeTime); cumulativeTime += duration; } if (parts.length > 0) { audioPlayer.src = convertToStreamableUrl(parts[0].primary); } return true; }
  function setupPlayer() { audioPlayer.onplay = () => { playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden'); sermonBox.style.overflowY = 'hidden'; snapScrollPosition(); startAutoScroll(); }; audioPlayer.onpause = audioPlayer.onended = () => { playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden'); sermonBox.style.overflowY = 'auto'; stopAutoScroll(); }; audioPlayer.ontimeupdate = () => { if (isSeeking || partStartTimes.length === 0) return; globalCurrentTime = (partStartTimes[currentPartIndex] || 0) + audioPlayer.currentTime; seekBar.value = globalCurrentTime; currentTimeDisplay.textContent = formatTime(globalCurrentTime); }; seekBar.oninput = () => { isSeeking = true; wasPlayingBeforeSeek = !audioPlayer.paused; if (wasPlayingBeforeSeek) audioPlayer.pause(); currentTimeDisplay.textContent = formatTime(seekBar.value); }; seekBar.onchange = () => { isSeeking = false; playFromGlobalTime(parseInt(seekBar.value, 10)); snapScrollPosition(); }; playPauseBtn.onclick = () => { if (audioPlayer.src) { if (audioPlayer.paused) audioPlayer.play().catch(console.error); else audioPlayer.pause(); } }; }
  function playFromGlobalTime(globalTime) { if (partStartTimes.length === 0) return; let targetPartIndex = partStartTimes.findIndex((startTime, i) => { const nextStartTime = (i + 1 < partStartTimes.length) ? partStartTimes[i + 1] : totalAudioDuration; return globalTime >= startTime && globalTime < nextStartTime; }); if (targetPartIndex === -1) targetPartIndex = partStartTimes.length - 1; const localTime = globalTime - partStartTimes[targetPartIndex]; globalCurrentTime = globalTime; seekBar.value = globalTime; currentTimeDisplay.textContent = formatTime(globalTime); const loadAndPlayPart = () => { currentPartIndex = targetPartIndex; audioPlayer.src = convertToStreamableUrl(audioParts[currentPartIndex].primary); audioPlayer.addEventListener('canplay', () => { audioPlayer.currentTime = localTime; if (wasPlayingBeforeSeek) audioPlayer.play().catch(e => console.error(e)); }, { once: true }); audioPlayer.load(); }; if (targetPartIndex !== currentPartIndex) { loadAndPlayPart(); } else { audioPlayer.currentTime = localTime; if (wasPlayingBeforeSeek) audioPlayer.play().catch(e => console.error(e)); } }
  function makeScrollPlan(cnt, time, cp) { if (!cp || !cp.length || (cp.length > 0 && cp[cp.length - 1].para < cnt)) { cp = (cp || []).concat([{ time: time, para: cnt + 1 }]); } let plan = []; for (let i = 0; i < cp.length - 1; i++) { plan.push({ fromP: cp[i].para, toP: cp[i + 1].para, fromT: cp[i].time, toT: cp[i + 1].time }); } return plan; }
  
  // --- MAIN APPLICATION FLOW ---
  function showSermonsForLoadSelect() { 
      sortedSermonKeys = Object.keys(allSermons).sort((a, b) => {
        const numA = extractLeadingNumber(allSermons[a]?.title);
        const numB = extractLeadingNumber(allSermons[b]?.title);
        return numA - numB;
      });
      updateSermonDropdown();
      if (sortedSermonKeys.length > 0) { 
          loadSermon(sortedSermonKeys[0]); 
      } else {
          loadSermon(null);
      }
  }
  function loadSermon(key) { currentKey = key; stopAutoScroll(); audioPlayer.pause(); audioPlayer.src = ""; globalCurrentTime = 0; currentPartIndex = 0; seekBar.value = 0; currentTimeDisplay.textContent = "0:00"; totalTimeDisplay.textContent = "0:00"; playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden'); if (!key || !allSermons[key]) { sermonBox.innerHTML = 'No sermons available.'; return; } let s = allSermons[key]; const nParas = updateParagraphsDisplay(s.text); totalAudioDuration = s.totTime || 0; audioParts = s.audioParts || []; scrollPlan = makeScrollPlan(nParas, totalAudioDuration, s.chks || []); sermonBox.scrollTop = 0; totalTimeDisplay.textContent = formatTime(totalAudioDuration); seekBar.max = totalAudioDuration; if (audioParts.length > 0) { initializeAudioParts(audioParts); } }

  // --- INITIAL EVENT LISTENERS ---
  sermonSelect.onchange = () => { loadSermon(sermonSelect.value); };
  backwardBtn.onclick = () => { playFromGlobalTime(Math.max(0, globalCurrentTime - 10)); };
  forwardBtn.onclick = () => { playFromGlobalTime(Math.min(globalCurrentTime + 10, totalAudioDuration)); };
  volumeRange.oninput = () => { audioPlayer.volume = volumeRange.value; };
  sermonBox.onscroll = () => { clearTimeout(manualScrollTimeout); manualScrollTimeout = setTimeout(syncAudioToScroll, 200); };
  document.getElementById('sermonSearch').oninput = updateSermonDropdown;
  
  window.onload = () => {
    const savedTheme = localStorage.getItem('sermonPlayerTheme') || 'light'; 
    applyTheme(savedTheme);
    showSermonsForLoadSelect();
    audioPlayer.volume = volumeRange.value; 
    setupPlayer();
  };
  window.onunload = () => { stopAutoScroll(); };
</script>
</body>
