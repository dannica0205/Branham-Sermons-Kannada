<title>Sermon Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root {
    --bg-color: #f5f5f5;
    --container-bg: #fff;
    --text-box-bg: #fafafa;
    --text-color: #333;
    --border-color: #eee;
    --shadow-color: #ccc;
    --primary-color: #1976d2;
    --text-muted: #555;
  }

  body.dark-theme {
    --bg-color: #212121;
    --container-bg: #333;
    --text-box-bg: #2a2a2a;
    --text-color: #e0e0e0;
    --border-color: #444;
    --shadow-color: #111;
    --primary-color: #42a5f5;
    --text-muted: #aaa;
  }

  body { margin:0; font-family:Arial,sans-serif; background: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }
  .container { max-width:700px; margin:20px auto; background:var(--container-bg); border-radius:8px; box-shadow:0 2px 10px var(--shadow-color); padding:24px; display:flex; flex-direction:column; height:90vh; }
  .sermon-text-box { 
    flex:1; 
    overflow-y:auto; 
    font-size:1.1em; 
    line-height:1.7; 
    background:var(--text-box-bg); 
    padding:16px; 
    border-radius:5px; 
    border:1px solid var(--border-color); 
    scroll-behavior: smooth; 
    text-align: center;
  }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #themeToggleBtn { background:none; border:none; font-size:1.5em; cursor:pointer; padding: 0 10px; }
  .hidden { display:none !important; }
  select, input { width:100%; padding:8px; margin-top:5px; box-sizing:border-box; border: 1px solid #ccc; border-radius: 4px; }
  label { font-weight:bold; display:block; margin-top:13px; }
  #sermonSelect { max-width: 100%; font-size: 1em; }
  #sermonSearch { margin-bottom: 10px; }

  /* --- MODERN PLAYER CONTROLS --- */
  #playerControlsContainer { 
    margin-top:20px; 
    padding: 15px 20px;
    background-color: var(--text-box-bg);
    border-radius: 12px;
    border: 1px solid var(--border-color);
  }
  .custom-controls { display:flex; align-items:center; gap:15px; margin-bottom: 10px; }
  .time-display { font-size:0.9em; color:var(--text-muted); white-space:nowrap; font-weight: bold; }
  .audio-controls { display:flex; align-items:center; justify-content: center; gap:20px; flex-wrap: wrap; }
  .audio-controls button {
    background: transparent;
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.2s ease-in-out;
    padding: 0;
    margin: 0;
  }
  .audio-controls button:hover { background-color: var(--border-color); }
  .audio-controls button svg { fill: var(--primary-color); }
  #playPauseBtn { 
    width: 64px; 
    height: 64px; 
    background-color: var(--primary-color);
  }
  #playPauseBtn:hover { background-color: #1565c0; }
  body.dark-theme #playPauseBtn:hover { background-color: #64b5f6; }
  #playPauseBtn svg { fill: white; width: 28px; height: 28px; }
  .play-icon { margin-left: 4px; }

  .audio-controls label { margin:0; font-weight: normal; color: var(--text-muted); }
  
  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  input[type="range"].seek-bar { width: 100%; }
  input[type="range"].volume-bar { width: 120px; }
  input[type="range"]::-webkit-slider-runnable-track { background: var(--border-color); height: 6px; border-radius: 3px; }
  input[type="range"]::-moz-range-track { background: var(--border-color); height: 6px; border-radius: 3px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; margin-top: -5px; background-color: var(--primary-color); height: 16px; width: 16px; border-radius: 50%; }
  input[type="range"]::-moz-range-thumb { border: none; background-color: var(--primary-color); height: 16px; width: 16px; border-radius: 50%; }
</style>
</head>
<body>
  <div class="container">
    <div class="top-bar">

        <label for="sermonSelect">Select Sermon:</label>
        <select id="sermonSelect"></select>
      </div>
      <button id="themeToggleBtn">🌙</button>
    </div>

    <div id="sermonTextBox" class="sermon-text-box" tabindex="0"></div>
    <audio id="audioPlayer" preload="metadata"></audio>

    <div id="playerControlsContainer">
      <div class="custom-controls">
        <span class="time-display" id="currentTimeDisplay">0:00</span>
        <input type="range" class="seek-bar" id="seekBar" value="0" min="0" step="1" />
        <span class="time-display" id="totalTimeDisplay">0:00</span>
      </div>
      <div class="audio-controls" id="audioControls">
        <button id="backwardBtn" title="Backward 10 seconds">
            <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12.5 4C7.8 4 3.57 6.86 2 11.22V9H0v6h6v-2H2.12c1.44-3.32 4.74-5.5 8.38-5.5s6.94 2.18 8.38 5.5H16v2h6V9h-2v2.22C20.43 6.86 16.2 4 12.5 4zM11 14h2v-4h-2v4z"/></svg>
        </button>
        <button id="playPauseBtn" title="Play/Pause">

            <svg class="pause-icon hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
        </button>
        <button id="forwardBtn" title="Forward 10 seconds">
            <svg viewBox="0 0 24 24" width="28" height="28" style="transform: scaleX(-1);"><path d="M12.5 4C7.8 4 3.57 6.86 2 11.22V9H0v6h6v-2H2.12c1.44-3.32 4.74-5.5 8.38-5.5s6.94 2.18 8.38 5.5H16v2h6V9h-2v2.22C20.43 6.86 16.2 4 12.5 4zM11 14h2v-4h-2v4z"/></svg>
        </button>
        <label for="volumeRange">Volume:</label>
        <input type="range" id="volumeRange" class="volume-bar" min="0" max="1" step="0.05" value="1" />
      </div>
    </div>
  </div>

 let allSermons = {"s1761997123836":{"title":"65-0829 - ಸೈತಾನನ ಏದೆನ್","text":"ಸೈತಾನನ ಏದೆನ್\nಜಫರ್‍ಸನ್‍ವಿಲ್, ಇಂಡಿಯಾನ, ಅಮೇರಿಕಾ\n65-0829\n1ನಾವೆಲ್ಲರೂ ತಲೆಗಳನ್ನು ಬಗ್ಗಿಸೋಣ... ಪ್ರೀಯ ದೇವರೇ ಮತ್ತೊಮ್ಮೆ ಈ ರಾತ್ರಿ ಕರ್ತನಾದ ಯೇಸುಕ್ರಿಸ್ತನ ಹೆಸರಿನಲ್ಲಿ ಕೂಡಿಬಂದು, ನಮ್ಮ ಶತ್ರುವನ್ನು ಎದುರುಗೊಳ್ಳುವಂತೆ ನಮಗೆ ಕೊಟ್ಟಂಥ ಈ ಒಳ್ಳೆಯ ಸಂದರ್ಭಕ್ಕಾಗಿನಿಮಗೆ ಕೃತಜ್ಞರಾಗಿದ್ದೇವೆ; ದೇವರ ವಾಕ್ಯದ ಮುಖಾಂತರ, ಯುದ್ಧಭೂಮಿಯಲ್ಲಿರುವ ನಿನ್ನ ಶತ್ರುವನ್ನು ನಿನ್ನ ಮಕ್ಕಳ ಮಧ್ಯದಿಂದ ಹೊಡೆದೋಡಿಸಿ, ಈರಾತ್ರಿಯಲ್ಲಿ ಅವರುಗಳು ಸುವಾರ್ತಾ ಜ್ಯೋತಿಯನ್ನು ಕಾಣುವ ಹಾಗೆ ಕೃಪೆಮಾಡು. ಸತ್ಯವನ್ನುಕಾಣುವುದಕ್ಕೆಂದು ನಾವು ದೃಷ್ಟಿ ಹೊಂದಲಿಕ್ಕೆ ನಮ್ಮ ಕಣ್ಣುಗಳಿಗೆ ನೀನು ಅಂಜನವನ್ನುಹಚ್ಚಬೇಕೆಂದು ಕೇಳಿಕೊಳ್ಳುತ್ತೇನೆ. ನಾವು ಈ ಸ್ಥಳವನ್ನು ಬಿಟ್ಟು ಹೊರಡುವಾಗ, “ದಾರಿಯಲ್ಲಿಆತನು ನಮ್ಮ ಸಂಗಡ ಮಾತಾಡಿದ ಹೃದಯವು ನಮ್ಮಲ್ಲಿ ಕುದಿಯಿತಲ್ಲವೆ?” ಎಂಬುದಾಗಿನಮ್ಮ ಹೃದಯಗಳಲ್ಲಿ ಹೇಳಿಕೊಂಡು ಹೋಗುವಂತೆ ಕೃಪೆ ಮಾಡು, ರೋಗಿಗಳನ್ನೂ ಬಾಧೆಪಡುವವರನ್ನೂ ನೀನು ಸ್ವಸ್ಥಗೊಳಿಸು. ನಂಬಿಕೆ ಕಳೆದುಕೊಂಡಿರುವವರಿಗೆ ನಂಬಿಕೆಯನ್ನು ಹೆಚ್ಚಿಸು... ಆಯಾಸದಿಂದ ಕೆಳಗೆ ಜೋಲು ಬಿದ್ದಿರುವಂಥ ಹಸ್ತಗಳನ್ನು ಮೇಲಕ್ಕೆತ್ತಿಸು, ಕರ್ತನಾದ ಯೇಸು ಕ್ರಿಸ್ತನ ಬರುವಿಕೆಯನ್ನೇ ನಾವು ಎದುರು ನೋಡುತ್ತಿರುವ ಹಾಗೆ ಕೃಪೆ ಮಾಡು. ಅದುಸಮೀಪವಾಗಿಯೇ ಅದೆ ಎಂಬುದಾಗಿ ನಾವು ನಂಬುತ್ತೇವೆ. ಇವೆಲ್ಲವನ್ನು ಯೇಸುವಿನ ಹೆಸರಿನಲ್ಲಿಯೇ ಕೇಳಿಕೊಳ್ಳುತ್ತೇವೆ.ಆಮೆನ್ ಕುಳಿತುಕೊಳ್ಳಿರಿ.\n2ಈ ರಾತ್ರಿಯಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತವಾಗಿಯೇ ಮಾತನಾಡಲು ಪ್ರಯತ್ನ ಪಡುತ್ತೇನೆ, ಏಕೆಂದರೆ, ಆರಾಧನೆಗೆಂದು ಅನೇಕರು ದೇಶದ ನಾನಾ ಭಾಗಗಳಿಂದ ಬಂದಿರುತ್ತಾರೆ. ನಿಮ್ಮಲ್ಲಿ ಕೆಲವರು ಈ ಸಾಯಂಕಾಲದ ಆರಾಧನೆಗೆಂದು ತಡೆದು ನಿಂತಿದ್ದೀರಿ; ನೀವು ಹೆಚ್ಚು ದೂರ ಪುನಃ ಹಿಂದಿರುಗಬೇಕಾಗಿ ಇರುವಿರಿ.ಅದಕ್ಕೋಸ್ಕರವಾಗಿ ನಿಮ್ಮಲ್ಲರಿಗೆ ವಂದನೆಯನ್ನು ಹೇಳುತ್ತೇನೆ. ಇಂದು ಬೆಳಿಗ್ಗೆ ಸಹೊ ನೇವಿಲರುಕೊಟ್ಟಂಥ ಸಂದೇಶವನ್ನು ನಾನಾಗಿ ಕೇಳಬೇಕೆಂದು ಅಪೇಕ್ಷಿಸಿದೆನು. ಅವರ ಕೊಟ್ಟಂಥ ಸಂದೇಶವನ್ನು ನಾನು ಅನೇಕ ಬಾರಿ ಕೇಳಿದ್ದುಂಟು. ಆದರೆ ಇಂದು ಬೆಳಿಗ್ಗೆ ಅವರು ಕೊಟ್ಟಂಥ ಸಮಯಕ್ಕೆ ಯೋಗ್ಯವಾದ ಸಂದೇಶವನ್ನು ನಾನು ಗೌರವಿಸುವವನಾಗಿದ್ದೇನೆ. ಈ ಮುಂಜಾನೆ ಅದನ್ನು ಕೇಳಲು ನಾನು ದೇವರಿಂದಲೇ ಪ್ರೇರಿತನಾಗಿದ್ದೇನೆಂದು ತಿಳಿದಿದ್ದೇನೆ. ಅದು ಬಹಳ ಚೆನ್ನಾಗಿತ್ತು. ಅವರ ಸಂದೇಶವನ್ನು ನೀವು ಬಂದು ಕೇಳಲು ಯಾಕೆ ಹಂಬಲಗೊಂಡವರಾಗಿದ್ದೀರಿ ಎಂಬುದು ನನಗೆ ಗೋಚರವಾಯಿತು. ಅವರ ಸಂದೇಶವನ್ನುಕೇಳುವುದರಿಂದ ದೇವರು ನಿಮಗೆ ಒಳ್ಳೆಯದನ್ನು ಮಾಡುತ್ತಾನೆ.\n3ನಾನು ಭೇಟಿಮಾಡಬೇಕೆಂದೆಣಿಸಿ ಕೊಂಡವರುಗಳಲ್ಲಿ ಕೆಲವರನ್ನು ಇಂದು ಮುಂಜಾನೆಯೂ, ಹಗಲಿನಲ್ಲಿಯೂ ಭೇಟಿ ಮಾಡಿದೆನು. ಆದರೆ ಇನ್ನು ಅನೇಕಾನೇಕರನ್ನು ಭೇಟಿ ಮಾಡಬೇಕಾಗಿದೆ.\nಇತ್ರೋನನು ಒಮ್ಮೆ ಮೋಶೆಯ ಬಳಿ “ನಿನಗೆ ಈ ಕೆಲಸ ಬಹು ಕಷ್ಟವಾದದ್ದು ಎಂದನು. ಮತ್ತು ಇಲ್ಲಿನಮ್ಮೊಂದಿಗೆ ಸಮಸ್ಯೆಗಳುಳ್ಳ ಅನೇಕ ಸಹೋದರರು ಇದ್ದಾರೆ. ಮತ್ತು ಅವೆಲ್ಲವೂ ನ್ಯಾಯಬದ್ಧವಾದಂಥವುಗಳು, ಅಲ್ಲದೆ ಅವುಗಳು ಜಾಗರೂಕತೆತಕ್ಕೊಳ್ಳ ಬೇಕಾದ ನಾಜೂಕಾದ ಸಂಗತಿಗಳು, ನಮ್ಮ ಬೋಧಕರು ಅಲ್ಲದೆ ಸಹೋದರ. ಮಾನ್ (Mann) ಹಾಗೂ ನಮ್ಮ ನಂಬಿಕೆಯಲ್ಲಿರುವಂಥ ಅನೇಕ ಬೋಧಕರುಗಳು, ನಿಮ್ಮ ಸಮಸ್ಯೆಗಳಿಗೆ ಮುಕ್ತಾಯವನ್ನುಕಾಣಲು ನೀವು ಅವರ ಬಳಿಗೆ ಹೋಗಬೇಕೆಂದು ನಾನು ಶಿಫಾರಸ್ಸು ಮಾಡುತ್ತೇನೆ. ಅವರು ನಿಮಗೆ ನೀವು ಮಾಡಬೇಕಾದ ಸರಿಯಾದ ವಿಷಯವನ್ನು ಹೇಳುವರು. ಕೆಲವರಿಗೆ ಮಕ್ಕಳ ಮೂಲಕವಾಗಿ ವಿಶ್ವಾಸಿಗಳಲ್ಲದವರನ್ನು ವಿವಾಹ ಮಾಡಿಕೊಂಡ ತಪ್ಪಿಗೋಸ್ಕರ ತೊಂದರೆಗಳು ಉದ್ಭವಿಸಿರಬಹುದು. ಈ ಬೋಧಕರು ಕ್ರಿಸ್ತನಸೇವಕರಾಗಿರುವುದರಿಂದ ಅವರು ನಿಮಗೆ ಇತರರು ಯಾವ ರೀತಿ ಮಾಡುವರೋ ಅದೇ ರೀತಿಸಹಾಯವನ್ನು ಮಾಡುವರು. ಅವರ ಬಳಿಗೆ ಹೋಗಿರಿ. ನಿಮಗೆ ಬೇಕಾದಂಥ ಸಹಾಯವನ್ನು ಅವರು ಮಾಡುತ್ತಾರೆಂಬುದು ಖಚಿತ. ನಾನೊಬ್ಬನೇ ನಿಮ್ಮೆಲ್ಲರನ್ನು ಭೇಟಿ ಮಾಡುವುದು ಸಾಧ್ಯವಾಗದ ಕೆಲಸ.ಎಲ್ಲಿಗೆ ಹೋದರೂ ಸಮಸ್ಯೆಗಳುಳ್ಳವರು ಇದ್ದೇ ಇರುತ್ತಾರೆ. ಈ ಸಂಗತಿಗಳು ಹೆಚ್ಚು ಹೆಚ್ಚಾಗುತ್ತಲೇಇರುತ್ತವೆ,ನೋಡಿರಿ,ನಿಮ್ಮಲ್ಲಿ ಪ್ರತಿಯೊಬ್ಬರನ್ನು ವೈಯಕ್ತಿಕವಾಗಿ ಭೇಟಿಮಾಡಲು ನಾನು ಬಯಸುತ್ತೇನೆ. ಆದರೆ ಅದುಆಗದ ಕೆಲಸ. ಆದರೆ ದೇವರು ತಾನೇ ಎಲ್ಲವನ್ನು ಸರಿಪಡಿಸಬೇಕೆಂದು ನಾನು ಯವಾಗಲೂ ನಿಮಗೋಸ್ಕರ ಆತನಬಳಿ ಭಿನ್ನವಿಸುತ್ತಲೆ ಇರುತ್ತೇನೆ.\n4ಇಂದಿನ ರಾತ್ರಿಯಲ್ಲಿ ವಚನದ ಕಡೆಗೆ ತಿರುಗಿ, ಅದಿಕಾಂಡ 3ನೇಅಧ್ಯಾಯದಿಂದ ಒಂದು ಭಾಗವನ್ನು ಓದಲು ಇಷ್ಟಪಡುತ್ತೇನೆ. ಅದಾದ ನಂತರ ಮುಂಚಿನ ದಿನಗಳಲ್ಲಿ ನಾನು ನಿಮಗೆ ಬೋಧಿಸಿದವುಗಳನ್ನು ಮತ್ತೊಮ್ಮೆ ನಿಮ್ಮ ನೆನಪಿಗೆ ತರುತ್ತೇನೆ. ನಾವು ಈ ಸ್ಥಳವನ್ನು ಬಿಟ್ಟು ಹೊರಡುವುದಕ್ಕೆ ಮುನ್ನ ಮೊದಲೇ ನಾವು ಅರಿತುಕೊಂಡವುಗಳಿಗಿಂತಲೂ ಸ್ವಲ್ಪ ಹೆಚ್ಚಾದವುಗಳನ್ನು ಕರ್ತನಾದ ಯೇಸುವು ನಮಗೆ ಕೊಡುತ್ತಾನೇನೋ ಎಂಬುದನ್ನು ನೋಡೋಣ. ಆತನು ಹಾಗೆ ಮಾಡಲಿ ಎಂದು ಬೇಡುವವನಾಗಿದ್ದೇನೆ.\n“ಯೆಹೋವ ದೇವರು ಉಂಟುಮಾಡಿದ ಎಲ್ಲಾ ಭೂಜಂತುಗಳಲ್ಲಿ\nಸರ್ಪವುಯುಕ್ತಿಯುಳ್ಳದ್ದಾಗಿತ್ತು. ಅದು ಸ್ತ್ರೀಯ ಬಳಿಗೆ ಬಂದು ಏನಪ್ಪಾ ತೋಟದಲ್ಲಿರುವ ಯಾವ ಮರದಹಣ್ಣನ್ನೂ ನೀವು ತಿನ್ನಬಾರದೆಂದು ದೇವರು ಅಪ್ಪಣೆ ಕೊಟ್ಟಿರುವದು ನಿಜವೋ ಎಂದು ಕೇಳಲು\nಸ್ತ್ರೀಯು ತೋಟದಲ್ಲಿರುವ ಮರಗಳ ಹಣ್ಣುಗಳನ್ನು ನಾವು ತಿನ್ನಬಹುದು.\nಆದರೆ ತೋಟದ ಮಧ್ಯದಲ್ಲಿರುವ ಈ ಫಲದ ವಿಷಯವಾಗಿ - ಇದನ್ನು ತಿನ್ನಲೂ ಕೂಡದು. ಮುಟ್ಟಲೂ ಕೂಡದು, ತಿಂದರೆ ನೀವು ಸಾಯುವಿರಿ ಎಂದು ದೇವರು ಹೇಳಿದ್ದಾನೆ ಅಂದಳು.\nಆಗ ಸರ್ಪವು ಸ್ತ್ರೀಗೆ - ನೀವು ಹೇಗೂ ಸಾಯುವದಿಲ್ಲ; ನೀವು ಇದರ ಹಣ್ಣನ್ನು ತಿಂದಾಗಲೇ ನಿಮ್ಮ ಕಣ್ಣುಗಳು ತೆರೆಯುವವು; ನೀವು ದೇವರಂತೆ ಆಗಿ ಒಳ್ಳೇದರ, ಕೆಟ್ಟದ್ದರ ಭೇದವನ್ನು ಅರಿತವರಾಗುವಿರಿ. ಇದು ದೇವರಿಗೆ ಚೆನ್ನಾಗಿ ಗೊತ್ತುಂಟು ಅಂದಿತು.\nಆಗ ಸ್ತ್ರೀಯು ಆ ಮರದ ಹಣ್ಣು ತಿನ್ನುವುದಕ್ಕೆ ಉತ್ತಮವಾಗಿಯೂ, ನೋಡುವುದಕ್ಕೆರಮ್ಯವಾಗಿಯೂ, ಜ್ಞಾನೋದಯಕ್ಕೆ ಅಪೇಕ್ಷಿಸತಕ್ಕದ್ದಾಗಿಯೂ ಇದೆ ಎಂದುತಿಳಿದು ಅದನ್ನು ತೆಗೆದುಕೊಂಡು ತಿಂದಳು, ಸಂಗಡ ಇದ್ದ ಗಂಡನಿಗೂ\nಕೊಡಲು ಅವನೂ ತಿಂದನು.\nಕೂಡಲೇ ಅವರಿಬ್ಬರ ಕಣ್ಣುಗಳು ತೆರೆದವು; ತಾವು ಬೆತ್ತಲೆಯಾಗಿದ್ದೇವೆಂದು ತಿಳಿದು ಅಂಜೂರದ ಎಲೆಗಳನ್ನು ಹೊಲಿದು ಉಟ್ಟುಕೊಂಡರು. (ಆದಿಕಾಂಡ 3: 1-7)\n5ಓದಿದಂಥ ಈ ವಾಕ್ಯಗಳನ್ನು ದೇವರು ತಾನೇ ಆಶೀರ್ವದಿಸಲಿ!\nಈ ರಾತ್ರಿಯಲ್ಲಿ ಇದರಿಂದ ವಿಷಯವನ್ನು ತೆಗೆದುಕೊಂಡು ಅದನ್ನು “ಸೈತಾನನ ಏದೆನ್”ಎಂಬುದಾಗಿ ಸಂಭೋದಿಸಲು ಇಚ್ಚಿಸುತ್ತೇನೆ. 'ಸೈತಾನನ ಏದೇನ್' ಎಂಬುದು ಒರಟಾದ ಒಂದು ವಿಷಯವಾಗಿ ಇರುವದು. ಕಳೆದ ಭಾನುವಾರ ರಾತ್ರಿ ಮಾತಾಡಿದಂಥ “ಆಲೋಚಿಸು ವಮನುಷ್ಯನ ಸೋಸಿಕೆಯೂ, ಪವಿತ್ರ ಮನುಷ್ಯನ ಸ್ವಾದವೂ” (Thinking Man's Filter and Holy Man's Taste) ಎಂಬ ವಿಷಯಕ್ಕೆ ಇದು ಸರಿಸಮವಾದದ್ದು.ಕೆಲವು ಸಮಯಗಳಲ್ಲಿ ಇಂಥ ಒರಟಾದ ಶಬ್ದ ಪ್ರಯೋಗಗಳು ನಮ್ಮ ಗಮನವನ್ನು ಕೆಲವು ಮುಖ್ಯವಾದ ಅಂಶಗಳಿಗೆಕೊಂಡೊಯ್ದು,ದೇವರ ವಾಕ್ಯವನ್ನು ನಾವು ಇನ್ನು ಚೆನ್ನಾಗಿ ಆಳವಾಗಿ ಓದಲು ಸಹಾಯಮಾಡುತ್ತದೆ. ನನ್ನ ಸಭೆಯವರು ಎಲ್ಲರೂ ಈ ರೀತಿಯಲ್ಲಿ ಓದಬೇಕೆಂದು ನಾನು ಇಷ್ಟಪಡುವವನಾಗಿದ್ದೇನೆ. ಮನುಷ್ಯನು ರೊಟ್ಟಿತಿಂದ ಮಾತ್ರದಿಂದ ಬದುಕುವುದಿಲ್ಲ. ದೇವರ ಬಾಯಿಂದ ಹೊರಡುವ ಪ್ರತಿಯೊಂದು ಮಾತಿನಿಂದಲೂ ಬದುಕುವನು.ಅದ್ದರಿಂದ ದೇವರ ವಾಕ್ಯವನ್ನು ಶ್ರದ್ದೆಯಿಂದ ಓದಿರಿ, ದೇವರ ಕಣ್ಣನ್ನು ಹೊಂದಿರುವವವರಾಗಿ ನೀವದನ್ನು ಓದುವುದಾದರೆ, ಈ ವರ್ತಮಾನಕಾಲದಲ್ಲಿ ಹೇಗೆ ಜೀವಿಸಬೇಕಾಗಿರುವುದು ಎಂಬ ತಿಳುವಳಿಕೆಯನ್ನು ನಿಮ್ಮ ಬುದ್ದಿ ಶಕ್ತಿಯಲ್ಲಿ ನೀವು ಹೊಂದಿಕೊಳ್ಳುವಿರಿ.\n6ಈ ರಾತ್ರಿ ನಿಮ್ಮ ಬಳಿ,“ನಾನು ಇದನ್ನು ಮಾಡಬಹುದು. ಅದನ್ನು ಮಾಡಬಹುದು' ಎಂಬುದಾಗಿ ಹೇಳಬಹುದು. ಜನರೊಂದಿಗೆ ಮಾತನಾಡಲು ಅಲ್ಲದೆ ನಿಮ್ಮ ಪ್ರತಿಯೊಬ್ಬರೊಂದಿಗೆ ನಿಮ್ಮ ಮನೆಗೆ ಬರಲು ಆಶಿಸುವವನಾಗಿದ್ದೇನೆ. ಇದು ಸತ್ಯವೆಂದು ದೇವರು ತಿಳಿದಿದ್ದಾನೆ. ನಿಮ್ಮ ಒಬ್ಬೊಬ್ಬರ ಮನೆಗಳನ್ನೂ ಭೇಟಿಮಾಡಿ,ಬೆಳಗಿನ ಉಪಹಾರವನ್ನು ಹೊಂದಿ, ನಾಳೆ ನಿಮ್ಮೊಡನೆ ಆಳಿಲಿನ ಬೇಟೆಗೆಹೊರಡಲು ನಾನು ಹಂಬಲಿಸುತ್ತೇನೆ. ನಾನು ಇದನ್ನು ಬಯಸಿದರೂ ಅದು ನನ್ನಿಂದ ಆಗದು. ಆರಾಧನೆಯ ನಂತರ ನಿಮ್ಮ ಪ್ರತಿಯೊಬ್ಬರ ಮನೆಗಳಿಗೂ ಹೋಗಿ, ಸ್ವಲ್ಪ ಕುಳಿತು, ನಿಮ್ಮೊಡನೆ ಮಾತನಾಡಿ,ನಿಮ್ಮ ಕ್ಷೇಮವನ್ನು ವಿಚಾರಿಸಿ, ದೇವರ ಕುರಿತಾಗಿ ಮಾತನಾಡಲು ನಾನು ಹಂಬಲಿಸುವವನಾಗಿದ್ದೇನೆ. ಇದರ ವಿಷಯವಾಗಿ ತುಂಬಾ ಕುತೂಹಲವುಳ್ಳವನಾಗಿದ್ದೇನೆ. ಇಲ್ಲಿ ಕುಳಿತಿರುವಂಥ ಪುರುಷರೇ, ಮಹಿಳೆಯರೇ ಅದು ನಿಜವೆಂಬುದನ್ನು ದೇವರು ತಿಳಿದಿದ್ದಾನೆ. ಆದರೆ ಅದು ನನ್ನಿಂದ ಸಾಧ್ಯವಾಗುವದಿಲ್ಲ. ನನಗೆ ಇದೆಲ್ಲಾ ಪ್ರಯಾಸವುಳ್ಳಂಥದ್ದಾಗಿದೆ. ಈ ಇಂಥಾ ಕಾಲದಲ್ಲಿ ನಾನೊಬ್ಬ ಬಲಹೀನ ಮನುಷ್ಯನು.\n7ಒಂದು ಕಾವ್ಯವನ್ನು ಇಂದು ಮಾಡಬೇಕೆಂಬುದಾಗಿ ನಾನು ತೀರ್ಮಾನಿಸುವುದಾದರೆ, ಅದನ್ನು ನಾನು ಹೇಗಾದರೂ ಮಾಡಿಬಿಡಬೇಕು.ಇಲ್ಲವಾದರೆ,ನಾಳೆ ಅದು ನನ್ನನ್ನು ಬಿಟ್ಟು ಮಿಲಿಯ ಮೈಲು ದೂರ ಹೊರಟುಬಿಡಬಹುದು. ಏನೋ ಒಂದು ವಿಷಯವು ಮಧ್ಯೆ ಬಂದು ಅದಕ್ಕೆ ಅಡ್ಡ ಮಾಡಬಹುದು. ಆದುದರಿಂದಲೇ ಯಾವಾಗಲೂ ಸೂಕ್ಷ್ಮ ಬುದ್ದಿಯುಳ್ಳವರಾಗಿ ಇರಬೇಕಾಗಿರುವದು ಅವಶ್ಯವಾಗಿದೆ.\n8ಈ ಲೋಕದಲ್ಲಿ ನಾನು ಬಾಳುವವರೆಗೂ ಈ ಲೋಕವನ್ನು ಬಿಟ್ಟು ಹೋಗುವಾಗಲೂ ಸಭೆಗೆ ಸುವಾರ್ತೆಯನ್ನು ತಿಳಿಸಿ, ಕರ್ತನಾದ ಯೇಸುಕ್ರಿಸ್ತನಿಗೆ ಘನಮಾನವನ್ನುಗಳಿಸುವಂಥ ಎಲ್ಲವನ್ನೂ ಮಾಡಬೇಕೆಂಬುದೇ ನನ್ನ ಮುಖ್ಯ ಗುರಿಯಾಗಿದೆ.\nನಿಮಗೆ ಸಹಾಯಕವಾದವುಗಳನ್ನೇ ನಾನು ಬಂದು ಹೇಳಲಿಕ್ಕೆ ಪ್ರಯತ್ನಪಡುತ್ತೇನೆ. ಇಂದು ಬೆಳಿಗ್ಗೆ ನಾನು ಮನೆಗೆಹೋಗಿ, ಧ್ಯಾನಿಸಿ, ದೇವರೇಜನರಿಗೆ ಸಹಾಯವಾಗುವ ಹಾಗೆ ಇಂದು ರಾತ್ರಿ ನಾನು ಏನನ್ನು ಹೇಳಬೇಕು' ಎಂದು ಆತನ ಬಳಿ ಕೇಳಿಕೊಂಡ ನಂತರ ಅವುಗಳನ್ನು ನಿಮಗೆ ಎತ್ತಿ ಹೇಳಲಾರಂಭಿಸುತ್ತೇನೆ. ಇಂದು ಬೆಳಿಗ್ಗೆ ಸಹೋ, ನೇವಿಲ್ ನಮಗೆ ಕೊಟ್ಟಂಥ ಸಾಮರ್ಥ್ಯವುಳ್ಳ ಸಂದೇಶವನ್ನು ಕೇಳಿದ ನಂತರ... “ಒಬ್ಬ ವೈದ್ಯನು ರೋಗವು ಏನೆಂಬುದನ್ನು ಪತ್ತೆಹೆಚ್ಚಿ ಬಿಡುತ್ತಾನೆ. ಆದರೆ ಪಾತ್ರೆಯ ತುಂಬಾ ಚುಚ್ಚುಮದ್ದನ್ನು ತೆಗೆದುಕೊಂಡು ಬರುವ ಮನುಷ್ಯನು ಚುಚ್ಚು ಮದ್ದನ್ನು ಕೊಡುತ್ತಾನೆ” ಎಂದು ಆತನು ಹೇಳಿದ್ದು ಬಹಳ ಆಶ್ಚರ್ಯಕರವಾಗಿತ್ತು ಎಂದು ನಾನು ನೆನಸುತ್ತೇನೆ. ಆ ಹೇಳಿಕೆಗಳು ಬಹಳ ಸುಂದರವಾದದ್ದೆಂದು ನಾನು ನೆನಸಿದೆನು. ರೋಗವು ಏನೆಂಬುದು ಪತ್ತೆ ಹಚ್ಚಲ್ಪಟ್ಟ ನಂತರ, ಚುಚ್ಚುನಳಿಕೆಯ ಮೂಲಕ ಔಷಧಿಯನ್ನು ಕೊಡುವುದು. ಅದು ಬಹಳ ಒಳ್ಳೆಯ ವಿಷಯವೇ ಸರಿ.\n9ಈ ಕಾಲಕ್ಕೆ ದೇವರು ಕೊಟ್ಟಂಥ ವಾಗ್ದಾನವನ್ನು ನಿಮ್ಮ ಮುಂದೆ ತಂದು ನಿಮ್ಮನ್ನು ಉಪದೇಶಿಸಲು (ಪ್ರಕಾಶಪಡಿಸಲು), ನಿಮ್ಮೊಡನೆ ಮಾತನಾಡಲು ಇಷ್ಟಪಡುತ್ತೇನೆ. ಮೊದಲಿದ್ದ ಕಾಲಗಳಲ್ಲಿ ಯಾರು, ಹೇಗೆ ಇದ್ದರು ಎಂಬುದನ್ನು ಕುರಿತಲ್ಲ, ಅದು ಆ ಕಾಲಗಳಿಗೇ ಸರಿಯಾಗಿ ಕಾಣಿಸಿತು. ಆ ಸಂಗತಿಗಳನ್ನು ನಾವು ನೆನಪು ಮಾಡುವವರಾಗಿದ್ದೇವೆ. ಆದರೆ ಈಗ, ನಾನು ಬರೆದು ಗುರುತು ಮಾಡಿ ಇಟ್ಟಿರುವಂಥ ವೇದ ವಾಕ್ಯಗಳನ್ನು ನಿಮ್ಮ ತಿಳುವಳಿಕೆಗೆ ತಂದು, ನಿಮ್ಮನ್ನು ಪ್ರಕಾಶಗೊಳಿಸಿ ಈಗ ನೀವು ಯುದ್ಧ ಮಾಡುವಂಥ ರಣರಂಗದಲ್ಲಿ ಉತ್ತಮವಾದ ಯುದ್ಧವೀರನಾಗಿ ಪರಿವರ್ತನೆಗೊಳ್ಳುವಂತೆಯೂ, ಶತ್ರುವಿನ ತಂತ್ರೋಪಾಯಗಳನ್ನು ನೀವು ಕಲಿತುಕೊಂಡು,ಅವನು ನಿಮ್ಮನ್ನು ಆಕ್ರಮಿಸುವುದಕ್ಕೆ ಮುನ್ನ ನೀವು ಅವನನ್ನು ತಡೆದು ನಿಲ್ಲಿಸುವಂತೆಯೂ ಸಹಾಯವಾಗಲೆಂದು ಬಯಸುತ್ತೇನೆ. (ಮಲ್ಲ) ಯುದ್ಧದಲ್ಲಿ ನಿಮ್ಮ ಮೇಲೆ ಬರುವಂಥ ಹೊಡೆತಗಳನ್ನು ಸಾಧ್ಯವಾಗುವವರೆಗೂ ನಿಮ್ಮ ಮೇಲೆ ಬೀಳಾದ ಹಾಗೆ ತಡೆಯಲಿಕ್ಕೆ ಕಲಿತುಕೊಳ್ಳುವುದು ಮುಖ್ಯವಾದ ಸಂಗತಿಯಾಗಿದೆ.\n10ನಾವು ಈಗ ಜೀವಿಸಿರುವಂಥ,ಪಾಪವು ತುಂಬಿರುವಂಥ, ಮಹಾ ದಿನಗಳನ್ನು ಈಗ ಸ್ವಲ್ಪ ಸಮಯ ಗಮನಿಸೋಣ. ದೇವರ ಮಕ್ಕಳು ಪ್ರತಿಯೊಬ್ಬರ ಕೈಯಿಂದ ಚಿತ್ರಹಿಂಸೆ ಮಾಡಲ್ಪಟ್ಟು ಕೊಲ್ಲಲ್ಪಟ್ಟ ನಾನು ಚರಿತ್ರೆಯಲ್ಲಿ ಓದಿದ ಆ ದಿನಗಳಿಗಿಂತ ಹೆಚ್ಚಿನದಾದ ಹಿಂಸೆ ಇದ್ದ ದಿನಗಳು ಚರಿತ್ರೆಯಲ್ಲಿ ಬೇರೆಲ್ಲಿಯೂ ಇದೆಯಂದು ನಾನು ನಂಬುವದಿಲ್ಲ.ಆದರೆ ಶತ್ರುವಿನ ವಂಚನೆಯನ್ನು ನೋಡಲು ನಾವು ಜೀವಿಸುತ್ತಿರುವ ಈ ದಿನಗಳ ಹಾಗೆ ಇದುವರೆಗೂ ಯಾವ ದಿನವೂ ಇರುತ್ತಿರಲಿಲ್ಲ. ಇವುಗಳು (ಸೈತಾನನ ವಂಚನೆಯೂ, ತಂತ್ರವೂ ತುಂಬಿರುವಂಥ ದಿನಗಳು. ನಾನು ಅದನ್ನು ನೋಡುವಾಗ, ಈ ದಿನಗಳಲ್ಲಿ ಕ್ರೈಸ್ತನು, ಮುಂಚಿನ ಕಾಲಗಳಲ್ಲಿ ಬಾಳಿದಂಥ ಕ್ರೈಸ್ತನಿಗಿಂತ ಹೆಚ್ಚಿನ ಗಮನವುಳ್ಳವನಾಗಿರಬೇಕೆಂಬುದು ಅವಶ್ಯಕವಾಗಿದೆಎಂದು ತಿಳಿಯುತ್ತೇನೆ.\n11ಈಗ ರೋಮನ್ಸರಕಾರದಿಂದ ಸಭೆಗೆ ಆದ ಹಿಂಸೆಯ ಹಿಂದಿನ ಕಾಲಗಳಲ್ಲಿ (ದಿನಗಳಲ್ಲಿ) ಒಬ್ಬ ಕ್ರೈಸ್ತನು ತನ್ನಸಾಕ್ಷಿಯ ಸಲುವಾಗಿ, ಕ್ರೈಸ್ತ ನೆನಸಿಕೊಂಡ ತಪ್ಪಿಗೋಸ್ಕರ ಕಂಡು ಹಿಡಿಯಲ್ಪಟ್ಟು ಅವನುರಂಗಸ್ಥಳಕ್ಕೆ ಹೋಗಿ, ಸಿಂಹದ ಬಾಯಿಗೋ, ಅಥವಾ ಇನ್ನಾವದಕ್ಕೋ ಬಲಿಯಾಗುವನು. ಆದರೆ ಅವನ ಆತ್ಮವು ರಕ್ಷಿಸಲ್ಪಟ್ಟಿತು, ಯಾಕಂದರೆ ಅವನು ಪವಿತ್ರವಾದ ಕಳಂಕವಿಲ್ಲದ ದೇವರ ವಿಶ್ವಾಸಿಯೂ ಮತ್ತು ತನ್ನ ರಕ್ತದಿಂದ ಅವನ ಸಾಕ್ಷಿಯನ್ನು ಭದ್ರಪಡಿಸಿದವನೂ ಆಗಿದ್ದಾನೆ.ಅವನ ನರನಾಡಿಗಳಲ್ಲಿ ರಕ್ತವು ಸುರಿದು ಬಂದಂತೆ ದೇಹದಲ್ಲಿ ಗಾಯಗಳಾದಂತೆ, ರಕ್ತವುಪೂರಾ ಸುರಿಸಲ್ಪಟ್ಟು ಕರ್ತನಾದ ಯೇಸುವೇ ನನ್ನಾತ್ಮವನ್ನು ಸ್ವೀಕರಿಸು ಎಂದು ನಿಜ ವಿಶ್ವಾಸದಿಂದಕೂಗಿದನು.“\n12ಆದರೆ ಈಗ ಸೈತಾನನ ವಂಚಿಸುವಿಕೆಯು, ಕ್ರೈಸ್ತರಲ್ಲದವರನ್ನು ಕ್ರೈಸ್ತರನ್ನಾಗಿ ನಂಬುವ ಹಾಗೆ ಮಾಡುತ್ತದೆ.ನೀವು ಮುದ್ರೆ ಹಾಕಬೇಕಾದ ಅಗತ್ಯವಿಲ್ಲ. ಹಿಂಸೆಗೊಳಗಾದವರನ್ನು ತಮ್ಮ ಸಾಕ್ಷಿಯಿಂದ ಮುದ್ರಿಸಬೇಕಾದಕಾಲಕ್ಕಿಂತಲೂ ಅಧಿಕ ವಂಚಕವಾಗುಳ್ಳ ದಿನಗಳಾಗಿ ಈ ದಿನಗಳು ಗೋಚರವಾಗುತ್ತಿವೆ. ಸೈತಾನನು ತನ್ನಿಂದ ಸಾಧ್ಯವಾಗುವವರೆಗೂ ತನ್ನ ವಂಚಕವಾದ ಬಲೆಗಳನ್ನು ಹಾಕಿರುತ್ತಾನೆ. ಅವನೊಬ್ಬ ವಂಚಕನೇ ಸರಿ.\nನಾವು ಜೀವಿಸಿರುವ ಈ ದಿನಗಳು ಹೇಗೆ ಇರುತ್ತವೆಂಬುದಾಗಿ ಯೇಸುವು ಮತ್ತಾಯ 24ರಲ್ಲಿಹೇಳಿದ್ದಾನೆ. ಇದುವರೆಗೂ ಜೀವನದಲ್ಲಿ ನೋಡಿರದಂಥ ವಂಚಕವಾದ ದಿನಗಳು ಎಷ್ಟು ಹತ್ತಿರವಾಗಿದೆ ಎಂದರೆ ಸಾಧ್ಯವಾಗುವುದಾದರೆ ಆರಿಸಿಕೊಳ್ಳಲ್ಪಟ್ಟವರೂ ಸಹ ವಂಚಿಸಲ್ಪಡುವಂಥ ದಿನಗಳಾಗಿವೆ.\n13ಈಗ ಈ ಕಾಲಕೋಸ್ಕರವಾಗಿ ಸತ್ಯವೇದದಲ್ಲಿ ಹೇಳಲ್ಪಟ್ಟ ಕೆಲವು ಪ್ರವಾದನೆಗಳನ್ನು ನಾವು ಜೀವಿಸುತ್ತಿರುವ ಈ ದಿನಗಳೊಂದಿಗೆ ಹೋಲಿಸಿ ನೋಡೋಣ. 2ನೇ ತಿಮೋಥಿಯ, 3ನೆಯ ಅಧ್ಯಾಯದಲ್ಲಿ ಇದರ ಬಗ್ಗೆ ತಿಳಿದುಕೊಳ್ಳಬಹುದು. ಈ ದಿನಗಳಲ್ಲಿ ಮನುಷ್ಯರು ದುಡುಕಿನವರೂ, ಉಬ್ಬಿಕೊಂಡವರೂ, ದೇವರನ್ನು ಪ್ರೀತಿಸುವವರಾಗಿರದೆ ಭೋಗಗಳನ್ನೇ ಪ್ರೀತಿಸುವವರಾಗಿಯೂ ಇರುತ್ತಾರೆಂಬುದಾಗಿ ಪ್ರವಾದಿಯು ಹೇಳಿದ್ದಾನೆ.\nಅದನ್ನು ಈ ಕಾಲಗಳೊಂದಿಗೆ ಸ್ವಲ್ಪ ಸಮಯಕ್ಕಾಗಿ ಹೋಲಿಸಿ ನೋಡೋಣ. ವಿವರಿಸಲಿಕ್ಕೆ ಬೇಕಾದಷ್ಟು ಅದನ್ನು ವಿವರವಾಗಿ ಬೋಧಿಸಲು ಸಮಯವು ಇಲ್ಲದಿರುವುದರಿಂದ, ಅದನ್ನು ಸಂಕ್ಷಿಪ್ತವಾಗಿಯೇ ನೋಡೋಣ. ನೀವು ಮನೆಗೆ ಹೋಗಿ ಅದನ್ನು ವಿವರವಾಗಿ ಓದುವಾಗ ನೀವು ತಿಳುಕೊಳ್ಳಲಾಗುವಂತೆ ನಾನು ಅದನ್ನು ಕೇವಲ ಒತ್ತಿ ಹೇಳುವೆನು. ದುಡುಕಿನವರು, ಉಬ್ಬಿಕೊಂಡವರು ದೇವರನ್ನು ಪ್ರೀತಿಸದೆ ಭೋಗಗಳನ್ನೇ ಪ್ರೀತಿಸುವವರು, ಸಮಾಧಾನವಾಗದವರು, ಚಾಡಿಹೇಳುವವರು,ದಯೆ ಇಲ್ಲದವರು, ಒಳ್ಳೆಯದನ್ನು ಹಗೆಮಾಡುವವರು, ಕೊನೆಯದಿನಗಳಲ್ಲಿ ಅಂದರೆ ಈ ದಿನಗಳಲ್ಲಿ - ಇವುಗಳು ಸಂಭವಿಸುವುದೆಂದು ಆತ್ಮನು ಸ್ಪಷ್ಟವಾಗಿ ಪ್ರವಾದನೆಯನ್ನು ನುಡಿಯುತ್ತಾನೆ.\n14ಈಗ ಪ್ರಕಟಣೆ3:14ರಲ್ಲಿಯೂ(ಅಂದರೆ ಲವೋದಿಕೆಯ ಸಭೆಯ ಕಾಲದಲ್ಲಿ) ಕೊನೆಯ ಕಾಲದಲ್ಲಿ ಸಭೆಯು ಹೇಗಿರುತ್ತದೆಂಬುದನ್ನು ತೋರಿಸುತ್ತದೆ. ಅದು ಒಬ್ಬ ವಿಧವೆಯಂತೆಯೂ ಮತ್ತು ಅದಕ್ಕೆ ಯಾವುದೇ ಕೊರತೆಯಿಲ್ಲವೆಂದೂ ಅದು ಹೇಳಿಕೊಳ್ಳುತ್ತದೆ. ತಾನು ಐಶ್ವರ್ಯವಂತನೂ, ಎಲ್ಲಾ ಸೌಭಾಗ್ಯದಿಂದ ತುಂಬಿದವನೂ, ಎಂಬುದಾಗಿ ಹೇಳಿಕೊಳ್ಳುತ್ತದೆ. ಆದರೆ ನಿಜವಾಗಿಯೂ ದೌರ್ಭಾಗ್ಯವುಳ್ಳವನೂ, ಪರಿತಪಿಸಲ್ಪಡುವಂಥವನೂ, ದರಿದ್ರನೂ, ಕುರುಡನೂ, ಬೆತ್ತಲೆಯವನೂಆಗಿರುವುದನ್ನು ತಿಳಿಯದೆಯೇ ಇರುತ್ತದೆ.\nಆತನು ಈ ಕಾಲದ ಸಭೆಗೆ ಇವುಗಳನ್ನು ಹೇಳುತ್ತಾನೆಂಬುದನ್ನು ಜ್ಞಾಪಿಸಿಕೊಳ್ಳಿರಿ. ದುಃಖಿತನೂ, ಕುರುಡನೂ, ಬೆತ್ತಲೆಯವನೂ ಆಗಿದ್ದು ಅದನ್ನು ಸಭೆಯು ಅರಿಯದೆಯೇ ಇರುವದು. ಕಡೆಯ ಶಬ್ದವು ಅದು ಬಹಳ ಎದ್ದು ಕಾಣವಂಥಾದ್ದಾಗಿರುತ್ತದೆ. ಅವರು ಆತ್ಮನಿಂದ ಹೆಚ್ಚಾಗಿ ತುಂಬಿಸಲ್ಪಟ್ಟು ಸಿದ್ದರಾಗಿರುವರೆಂಬುದಾಗಿ ಯೋಚಿಸುತ್ತಾರೆ. ಲವೋದಿಕಯ ಸಭೆಯ ಕಾಲವು ಅದು ಪೆಂತೆಕೋಸ್ತು ಸಭೆಯ ಕಾಲವಾಗಿದೆ. ಕಾರಣ ಅದುವೇ ಕೊನೆಯ ಸಭೆಯ ಕಾಲವಾಗಿದೆ.\nಲೂಥರನೊಂದಿಗೆ ಅವನ ಕಾಲದ ಸಂದೇಶವಿತ್ತು. ವೆಸ್ಲಿಯೊಂದಿಗೆ ಅವನ ಕಾಲದ ಸಂದೇಶವಿತ್ತು. ಪೆಂತೆಕೋಸ್ತರೊಂದಿಗೆ ಅವರ ಕಾಲದ ಸಂದೇಶವಿತ್ತು.\n15“ನೀನು ಬೆಚ್ಚಗೂ ಇಲ್ಲದೆ, ತಣ್ಣಗೂ ಇಲ್ಲದೆ,ಉಗುರು ಬೆಚ್ಚಗಿರುವುದರಿಂದ' ಎಂಬುದಾಗಿ ಹೇಳಲ್ಪಟ್ಟಿದೆ. ಹೊರಗಿನ ದೇಹೋತ್ಸಾಹಗಳು,ಸುವಾರ್ತೆಯನ್ನು ಕುರಿತು ಸ್ವಂತಕಲ್ಪನೆ, ಅದಕ್ಕೆ ಆತನು, ”ನೀನು ಹಾಗೆ ಇರುವುದರಿಂದ ನಿನ್ನನ್ನು ನನ್ನ ಬಾಯೊಳಗಿಂದ ಕಾರುವೆನು'' ಎಂದು ಹೇಳಿದನು. ಬೇರೆ ರೀತಿಯಲ್ಲಿ ಹೇಳುವುದಾದರೆ, ಸಭೆಯನ್ನು ಆ ಸ್ಥಿತಿಯಲ್ಲಿ ನೋಡಲು ಆತನಿಗೆ ಅಸಹ್ಯವಾಗಿ ತೋರಿತು.\n16ಸಭೆಯೂ ಸಹ ಆತನನ್ನು ಹೊರ ಕಾರಿಬಿಟ್ಟಿತು ಎಂಬುದನ್ನು ನೆನಪಿನಲ್ಲಿಡಿರಿ. ಈ ಭಯಂಕರವಾದ ಲವೋದಿಕೆಯ ಸಭೆಯ ಕಾಲದಲ್ಲಿ ಆತನು ಸಭೆಯ ಹೊರಗೆಯೇ ನಿಂತುಕೊಂಡು, ಒಳಗೆ ಬರುವುದಕ್ಕೆ ಪ್ರಯತ್ನಿಸುತ್ತಿದ್ದಾನೆ.\n17ಈ ಪ್ರಪಂಚದ ದೇವರಾದವನು ಇಂದು - ಇಂದಿನ ಲೋಕದಲ್ಲಿ ಆರಾಧಿಸಲ್ಪಡುವ ವ್ಯಕ್ತಿ ಎಂದರೆ, ಸೈತಾನನು. ಸೈತಾನನನ್ನೇ ತಾವು ಆರಾಧಿಸುತ್ತೇವೆಂಬುದಾಗಿ ಜನರು ಅರಿಯದೆಯೇ ಇದ್ದಾರೆ. ಆದರೆ ಅದು ಸೈತಾನನು ತನ್ನನ್ನೇ ಸಭೆಯ ರೀತಿಯಲ್ಲಿ (ಸಭೆಯಂತೆ) ತೋರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ ನೋಡಿರಿ, ಸಭೆಯ ಮುಖಾಂತರ ದೇವರನ್ನು ಆರಾಧಿಸುವುದಾಗಿ ಅವರು ಎಣಿಸಿಕೊಂಡಿದ್ದಾರೆ. ಆದರೆ ನಿಜವಾಗಿಯೂ, ಸೈತಾನನನ್ನೇ ಅವರು ಸೇವಿಸುತ್ತಾರೆ. ಆದರೆ ಸೈತಾನನು ಈ ಉಪಾಯವನ್ನು ಕೈಗೊಂಡವನಾಗಿದ್ದಾನೆ.\nಓ, ಸ್ವಲ್ಪ ತಡೆಯಿರಿ. ನಾವು ದೇವರ ವಾಕ್ಯವನ್ನೇ ಪ್ರಸಂಗಿಸುತ್ತೇವೆ ಎಂದು ನೀವು ಹೇಳಬಹುದು. ಈ ರಾತ್ರಿಯಲ್ಲಿ ನಾನು ಪ್ರಸಂಗಿಸುವಂಥ ಈ ವಿಷಯವನ್ನು ಸ್ವಲ್ಪ ನೋಡಿರಿ, ದೇವರ ವಾಕ್ಯವನ್ನು ಮೊತ್ತ ಮೊದಲಾಗಿ ಹವ್ವಳಿಗೆ ಸಂದೇಶಿಸಿದ್ದು ಸೈತಾನನೇ. ದೇವರು ಹೇಳಿದ್ದಾನೆ, ನೋಡಿರಿ.ಆ ಕಾಲಕ್ಕೆ ತಕ್ಕುದಾದ ವೇದ ವಾಕ್ಯವನ್ನು ಅವನು ತಪ್ಪಾಗಿ ವಿವರಿಸಿದನು. ಯೇಸುವು ಮಾಡಿದ ಎಲ್ಲವೂ ಸಹ ಸರಿಯೆಂಬುದಾಗಿ ಅವನು ನಿಮಗೆ ಹೇಳುತ್ತಾನೆ. ಮೋಶೆಯು ಮಾಡಿದಂಥ ಎಲ್ಲಾ ಸಂಗತಿಗಳು ಸರಿಯಾಗಿವೆ ಎಂದು ಅವನು ನಿಮಗೆ ತಿಳಿಸುವನು. ಆದರೆ ಈ ಕಾಲಕ್ಕೆಂದು ಕೊಡಲ್ಪಟ್ಟ ವಾಗ್ದಾನಗಳನ್ನು ನೀವು ನಂಬಿಕೆಯಿಂದ ಕೈಕೊಳ್ಳುವದಾದರೆ, ಅವುಗಳು ಬೇರೊಂದು ಕಾಲಕ್ಕಾಗಿ ಇವೆ ಎಂಬುದಾಗಿ ಹೇಳಿ ಜನರನ್ನು ತಪ್ಪಾಗಿ ನಂಬುವ ಹಾಗೆ ಮಾಡುತ್ತಾನೆ. ಅವನು ಅಷ್ಟನ್ನೇ ಮಾಡುವನು. ದೇವರ ವಾಕ್ಯದೊಂದಿಗೆ ನೀವು ಒಂದು ಶಬ್ದವನ್ನೂ ಕೂಡಿಸಲೂ, ಕಡಿಮೆ ಮಾಡಲೂ ಸಾಧ್ಯವಿಲ್ಲ. ಆದರೆ ಅವನು (ಸೈತಾನನು) ಅದನ್ನೇ ಮಾಡುತ್ತಾ ಬರುತ್ತಿದ್ದಾನೆ.\n18ದೇವರನ್ನುಆರಾಧಿಸುವೆವೆಂಬುದಾಗಿ ಜನರು ಭಾವಿಸಿ, ಅರಿವಿಲ್ಲದೆ ಸೈತಾನನನ್ನುಆರಾಧಿಸುತ್ತಾರೆ. 2ಥೆಸಲೋನಿಕದಲ್ಲಿ ನುಡಿಯಲ್ಪಟ್ಟ ಪ್ರವಾದನೆಯ ಮುಖಾಂತರ ನಮಗೆ ಎಚ್ಚರಿಕೆಯ ಕೊಡಲ್ಪಟ್ಟಂತೆ... ಅದನ್ನು ಸ್ವಲ್ಪ ಓದೋಣ. 2 ಥೆಸಲೋನಿಕ 2ನೇ ಅಧ್ಯಾಯ. ಅದನ್ನು ತೆರೆಯಲು ಪ್ರಯತ್ನಿಸೋಣ. 2ನೇ ಥೆಸಲೋನಿಕದಲ್ಲಿ ಓದಲು ಬಯಸುವವನಾಗಿದ್ದೇನೆ.\n“ಸಹೋದರರೆ, ನಮ್ಮ ಕರ್ತನಾದ ಯೇಸುಕ್ರಿಸ್ತನ ಪ್ರತ್ಯಕ್ಷತೆಯ ವಿಷಯವಾಗಿಯೂ ನಾವು ಆತನ ಬಳಿಯಲ್ಲಿ ಕೂಡಿಕೊಳ್ಳುವದರ ವಿಷಯವಾಗಿಯೂ ನಿಮ್ಮನ್ನು ಬೇಡಿಕೊಳ್ಳುವುದೇನೆಂದರೆ.''\nಕರ್ತನ ಪ್ರತ್ಯಕ್ಷತೆ, ಆತನ ಬಳಿಯಲ್ಲಿ ಕೂಡಿಕೊಳ್ಳುವುದನ್ನು ನೋಡುವಂಥಾದ್ದು. ಈ ಕಡೇ ದಿನಗಳಲ್ಲಿ ದೇವರು ತನ್ನ ಜನರನ್ನು ಆತನೊಂದಿಗೆ ಕೂಡಿಸಿಕೊಳ್ಳುವಂತೆ, ಕರ್ತನ ಬಳಿಗೆ ಜನರು ಕೂಡಿಕೊಳ್ಳುವರು. ಸಂಸ್ಥಾಪನೆಗಳಲ್ಲಿ ಅಲ್ಲ. ಕರ್ತನ ಬಳಿಗೆ, ಆತನ ಬಳಿಯಲ್ಲಿ ಕೂಡಿಸಲ್ಪಡುವದು.\nಕರ್ತನ ದೀನವು ಈಗಲೇ ಹತ್ತಿರವಾಯಿತೆಂಬುದಾಗಿ ದೇವರಾತ್ಮ ಪ್ರೇರಿತವಾದ ನುಡಿ ಇದೆ ಎಂದಾಗಲೀ ಪೌಲನು ಹಾಗೆ ಹೇಳಿದನೆಂದಾಗಲಿ, ಪೌಲನು ಹಾಗೆ ಬರೆದನೆಂದಾಗಲಿ ಯಾರಾದರೂ ಹೇಳಿದರೂ ನೀವು ಬೇಗನೆ ಬುದ್ದಿಗೆಟ್ಟು ಚಂಚಲರಾಗಿ ಕಳವಳಪಡಬೇಡಿರಿ.\nಯಾರೂ ಯಾವ ವಿಧದಲ್ಲಿಯೂ ನಿಮ್ಮನ್ನು ಮೋಸಗೊಳಿಸದಂತೆ ನೋಡಿಕೊಳ್ಳಿರಿ. ಯಾಕೆಂದರೆ ಮೊದಲು ಮತಭ್ರಷ್ಟತೆಯು ಉಂಟಾಗಿ ಅಧರ್ಮ ಸ್ವರೂಪನು ಬೈಲಿಗೆ ಬಂದ ಹೊರತು ಆ ದಿನವು ಬರುವದಿಲ್ಲ, ಯಾವದು ದೇವರೆನಿಸಿಕೊಳ್ಳುತ್ತದೋ, ಯಾವದು ಪೂಜೆ ಹೊಂದುತ್ತದೋ ಅದನ್ನೆಲ್ಲಾ ನಾಶನಕ್ಕೆ ಅಧೀನನಾದ ಆ ಪುರುಷನು ಎದುರಿಸಿ ಅದಕ್ಕಿಂತ ಮೇಲಾಗಿ ತನ್ನನ್ನು ತಾನೇ ಹೆಚ್ಚಿಸಿಕೊಂಡು ತಾನು ದೇವರೆಂದು ಹೇಳಿಕೊಂಡು ದೇವರ ಗರ್ಭಗುಡಿಯಲ್ಲೇ ಕೂತುಕೊಳ್ಳುತ್ತಾನೆ.“\n19ಇಂದಿನ ಸಭೆಯ ವಂಚನೆಗಳು,ನೋಡಿರಿ,ನಾಶನದ ಪುತ್ರನು ಅಂದರೆ ಸೈತಾನನು ನಾಶನದ ಪುತ್ರನಾದ ಸೈತಾನನು ಈ ದಿನಗಳಲ್ಲಿ ಜನರು ಸೈತಾನನನ್ನು ಆರಾಧಿಸುತ್ತಾ ದೇವರನ್ನೇ ಆರಾಧಿಸುವುದಾಗಿ ತಪ್ಪಾಗಿ ಎಣಿಸಿಕೊಂಡಿದ್ದಾರೆ. ಅವರು ಸಂಸ್ಥಾಪನಾ ಪ್ರಮಾಣಗಳಿಂದ (Creed) ಮನುಷ್ಯನಿಂದ ಆರಂಭಿಸಲ್ಪಟ್ಟ ಸಂಸ್ಥಾಪನೆಗಳ ಮುಖಾಂತರ ಸೈತಾನನನ್ನು ಆರಾಧಿಸುತ್ತಾರೆ. ಇವುಗಳೆಲ್ಲವೂ ಜನರನ್ನುಇದುವರೆಗೂ ಲೋಕವು ಎಂದೂ ನೋಡಿರದ ವಂಚನೆಯೊಳಕ್ಕೆ ಪ್ರವೇಶಿಸಿದೆ. ಈ ಕಾಲಕ್ಕೆಂದೇ ವಾಗ್ದಾನಮಾಡಲ್ಪಟ್ಟ ದೇವರ ವಾಕ್ಯವು ಎಷ್ಟೊಂದು ಪ್ರಸಂಗಿಸಲ್ಪಟ್ಟರೂ, (ಸೂಚಕಕಾರ್ಯಗಳಿಂದಲೂ, ಅದ್ಭುತಗಳಿಂದಲೂ)ಖಚಿತವಾದರೂ ಅವರು ಅದನ್ನು ನಂಬುವದಿಲ್ಲ.\nಇದು ಏಕೆ ಹೀಗೆಂದು ನಾವು ಆಶ್ಚರ್ಯಗೊಳ್ಳುತ್ತೇವೆ. ಏಕೆ ಜನರು ಅದನ್ನು ನಂಬಲಾರರು? ಒಂದು ಕಾರ್ಯವನ್ನು ನಡೆಸುವೆನೆಂದು ದೇವರು ವಾಗ್ದಾನವನ್ನು ಕೊಟ್ಟು ಅದನ್ನು ನೆರವೇರಿಸಿದರೂ ಜನರು ಅದಕ್ಕೆ ಹಿಂಜರಿದು, ಬೇರೆಡೆಗೆ ತೆರಳುತ್ತಾರೆ. ದೇವರು ಹೇಳಿದ್ದನ್ನು ಖಂಡಿತವಾಗಿ ಆತನು ನೆರವೇರಿಸುವನೆಂದು ಹವ್ವಳೂ ಅರಿತಿದ್ದಳು. ಆದರೆ ಆಕೆಯು ಆತನ ಮಾತಿಗೆ ಕಿವಿಕೊಡದೆ ಹಿಂಜರಿದಳು. ಇತರ ಕಾಲಗಳಲ್ಲಿಯೂ ಇದು ಇದೇ ರೀತಿಯಾಗಿತ್ತು ಎಂದು ನೆನಪಿನಲ್ಲಿಡಿರಿ. ಪ್ರತಿಯೊಂದು ಕಾಲದಲ್ಲಿಯೂ ಯಾವ ರೀತಿ ಇತ್ತೆಂದರೆ, ಸೈತಾನನು ಆ ವಾಕ್ಯವನ್ನು ಅವರಿಗೆ ವ್ಯತಿರಿಕ್ತವಾದ ರೀತಿಯಲ್ಲಿ ತೋರಿಸುವನು. ಅವರು ಬೇರೆ ಕಾಲವನ್ನು ನೋಡುವಂತೆ ಮಾಡುವನು.\n20ನೋಡಿರಿ! ಯೇಸುವು ಈ ಲೋಕದಲ್ಲಿದ್ದ ಕಾಲದಲ್ಲಿ ಸೈತಾನನು ಯೆಹೂದ ವೇದ ಪಾರಂಗತರಲ್ಲೂ ಗುರುಗಳಲ್ಲಿಯೂ, ಬೋಧಕರುಗಳಲ್ಲಿಯೂ ಕೂಡಿಕೊಂಡಿದ್ದನು. ಮನುಷ್ಯ ಕುಮಾರನು ಆ ದಿನದಲ್ಲಿ ಪ್ರಕಟಿಸಲ್ಪಡುವೆನು. ಆತನು ತನ್ನನ್ನು ಪ್ರಕಟಪಡಿಸಿಕೊಳ್ಳುವನು ಎಂಬ ದೇವರ ವಾರ್ತೆಯು ಖಚಿತವಾಗಿ ಬೋಧಿಸಲ್ಪಟ್ಟ ನಂತರವೂ, ಸೈತಾನನುಅವರೊಳಗೆ ವಾಸವಾಗಿದ್ದು ಮೋಶೆಯ ನಿಯಮಗಳನ್ನು ಕೈಗೊಳ್ಳುವಂತೆ ಉತ್ತೇಜಿಸಿದನು. ನೋಡಿರಿ? ಅವರು ಧಾರ್ಮಿಕರಾಗಿ ಕಾಣಬರುವವರೆಗೆ, ಮತ್ತು ಮೋಶೆಯ ನಿಯಮದಲ್ಲಿರುವವರೆಗೆ ಎಲ್ಲವೂ ಸರಿಯಾಗಿ ಕಾಣಿಸುತಿತ್ತು. ಅವನು ಅವರ ಬಳಿ (“ಮನುಷ್ಯಕುಮಾರನು ಗೋಚರಿಸಲ್ಪಡುವನೆಂದು ಹೇಳುವ) ವೇದ ವಾಕ್ಯವು ಸರಿಯೇ. ಆದರೆ ಆತನು ಅವನಲ್ಲ ಎಂದನು.ಎಷ್ಟೊಂದು ಮೋಸಗೊಳ್ಳುವಂಥದ್ದು ನೋಡಿರಿ? ಅದುವೇ ಆ ನಿಜವಾದ ವಂಚಿಸುವ ದಿನವಾಗಿದೆ.\n21ಸೈತಾನನು ಮೊದಲಿನಿಂದಲೂ ಮತ್ತು ಈಗಲೂ, ತನ್ನ ರಾಜ್ಯವನ್ನು ಈ ಲೋಕದಲ್ಲಿ ಸ್ಥಾಪಿಸುತ್ತಲೇ ಬರುತ್ತಿದ್ದಾನೆ. ಕ್ರೈಸ್ತನಲ್ಲದ ಒಬ್ಬ ವ್ಯಾಪಾರಿಯ ಹಾಗೆ ಅವನು ತನ್ನ ರಾಜ್ಯವನ್ನು ಸ್ಥಾಪಿಸಲಿಕ್ಕೆ ಯತ್ನಿಸುತ್ತಾನೆ. ಅದಕ್ಕೋಸ್ಕರವಾಗಿಯೇ ಅವನು ಇದೆಲ್ಲವನ್ನು ಮಾಡುತ್ತಿರುತ್ತಾನೆ. ತಪ್ಪಾದಂಥ ಹಾದಿಯಲ್ಲಿ ನೀವು ನುಗ್ಗಬೇಕೆಂದು ಅವನು ತಾನು ಮಾಡಬಲ್ಲ ಎಲ್ಲಾ ತರಹದ ಯೋಜನೆಯನ್ನೂ ಮಾಡುತ್ತಾನೆ. ತಪ್ಪಾದ ಮಾರ್ಗದಲ್ಲಿ ನೀವು ಹೋಗುವುದರಿಂದ ವೈಯಕ್ತಿಕವಾಗಿ ಅವನಿಗೆ ಲಾಭವಿರುವುದಾದರೆ, ಅದರ ಸತ್ಯವನ್ನು ನೀವು ಕಾಣಲಿಕ್ಕೇ ಸಾಧ್ಯವಾಗದ ಹಾಗೆ ಅವನಿಂದ ಸಾಧ್ಯವಾಗುವಂಥ ಎಲ್ಲಾ ಸಂಗತಿಗಳನ್ನು ಅವನು ತೋರಿಸುತ್ತಾನೆ. ಏಕೆಂದರೆ ಅವನು ಕೇವಲ ತನ್ನ ವಿಷಯವಾಗಿಯೇ ಅನುಕಂಪ ಉಳ್ಳವನು. ಅವನು ಅನೇಕ ಸುಳ್ಳುಗಳನ್ನು ಹೇಳಿ ಮೋಸಗೊಳಿಸುವುದರಿಂದ ಅವನಿಗೆ ವ್ಯಯಕ್ತಿಕ ಲಾಭವು ಇದೆ.\n22ಆದ್ದರಿಂದಲೇ ಸೈತಾನನು ಇವುಗಳನ್ನು ಮಾಡಿದ್ದಾನೆ. ದೇವರು ತನ್ನ ವಾಕ್ಯದಲ್ಲಿ ಹೇಳಿದಂತೆ ಅವನು ಈ ಸೇವೆಯ ಮುಖಾಂತರವೇ ಕ್ರಿಯೆ ನಡೆಸಿಕೊಂಡು ಬರುತ್ತಾನೆ.\nಏದೆನ್ತೋಟದಲ್ಲಿ ಅವನು ಮತ ಸಂಬಂಧವಾದಂಥ ವಂಚನೆಯ ಮೂಲಕ ಆರಂಭಿಸಿದನು ಮತ್ತು ಅಂದಿನಿಂದಲೇ ಅದು ಮುಂದುವರಿಯುತ್ತಾ ಬಂತು. ಕಮ್ಯೂನಿಸ್ಟ್ ಮತವನ್ನು ಸ್ಥಾಪಿಸುವುದರ ಮೂಲಕವಲ್ಲ, ಇದ್ದಕ್ಕೂ ಕಮ್ಯೂನಿಸ್ಟರಿಗೂ ಯಾವುದೇ ರೀತಿಯ ಸಂಬಂಧವೂ ಇಲ್ಲ. ನೀವು ಗಮನಹರಿಸಬೇಕಾದದ್ದು (ಇಂದಿನ)ಸಭೆಗಳು ನೋಡಿರಿ. ಆಯ್ದುಕೊಳ್ಳಲ್ಪಟ್ಟವರನ್ನು ಕಮ್ಯೂನಿಸ್ಟ್‌ರು ವಂಚಿಸಲಾರರು. ಕೇವಲ ಸಂಪ್ರದಾಯ ಸಭೆಗಳು ಮಾತ್ರವೇ ಅವರನ್ನು ವಂಚಿಸಲು ಸಾಧ್ಯ. ಅದು ಕಮ್ಯೂನಿಸ್ಟರಲ್ಲ, ಅವರು ದೇವರೇ ಇಲ್ಲ ಎಂಬುದಾಗಿ ಹೇಳುವವರು ಎಂದು ನಾವು ತಿಳಿದಿದ್ದೇವೆ. ಅವರು ಕ್ರಿಸ್ತವಿರೋಧಿ ಗಳು.ಮೂಲ ತತ್ವದ ಆಧಾರದ ಮೇಲೆ ಅವರು ಕ್ರಿಸ್ತವಿರೋಧಿಗಳು ಸರಿ. ಆದರೆ ನಿಜವಾದ ಕ್ರಿಸ್ತ ವಿರೋಧಿಗಳು ಅವರಲ್ಲ. ಅಂತಿ ಕ್ರಿಸ್ತನು ಧರ್ಮನಿಷ್ಟೆಯುಳ್ಳವನು. ಅವನು ಭಕ್ತಿಯುಳ್ಳವನಾಗಿ ಆದಿಯಲ್ಲಿ ದೇವರ ಮಾತುಗಳನ್ನು ಸೈತಾನನು ಬಳಸಿದಂತೆ ಅವನೂ ಸಹ ವೇದವಾಕ್ಯಗಳನ್ನು ಎತ್ತಿ ಹೇಳುತ್ತಾನೆ. ಅದು ಸರಳವಾಗಿ ಕಾಣುವಂತೆ ಮಾಡುತ್ತಾನೆ. (ಸೈತಾನನು) ಹವ್ವಳ ಬಳಿ, “ತೋಟದಲ್ಲಿರುವ ಸಕಲ ವಿಧ ವೃಕ್ಷಗಳ ಫಲಗಳನ್ನೂ ತಿನ್ನಬಾರದೆಂದು ದೇವರು ಹೇಳಿದ್ದುಂಟೋ?' ಎಂದು ಕೇಳಿದನು. ಅದಕ್ಕವಳು ”ನಾವು ತೋಟದಲ್ಲಿರುವ ವೃಕ್ಷಗಳ ಫಲಗಳನ್ನು ತಿನ್ನಬಹುದು. ಆದರೆ ತೋಟದಮಧ್ಯದಲ್ಲಿ ಒಂದು ವೃಕ್ಷವು ಉಂಟು. ಅದರ ಫಲಗಳನ್ನು ಮಾತ್ರ ನಾವು ತಿನ್ನಕೂಡದೆಂದೂ, ಅದನ್ನು ಮುಟ್ಟಲೂ ಕೂಡದೆಂದು ದೇವರು ಅಪ್ಪಣೆ ಮಾಡಿದ್ದಾನೆ. ಏಕೆಂದರೆ ಅದನ್ನು ಮಾಡುವ ಆ ದಿನದಲ್ಲಿ ನಾವು ಸಾಯೇ ಸಾಯುವೆವು“ಎಂದಳು.\n23ಅವನು ಆಕೆಯೊಡನೆ, “ನೀವು ಖಂಡಿತ ಸಾಯಲಾರಿರಿ. ದೇವರು ಏಕೆ ಹಾಗೆ ಹೇಳಿದನೆಂಬುದರ ಕಾರಣವನ್ನು ನಾವು ಹೇಳುತ್ತೇನೆ... ” ಎಂದನು. ನೋಡಿರಿ. ಅವನು ಎತ್ತಿ ಹೇಳಿದ್ದು ಸತ್ಯವೇ ಆಗಿತ್ತು. ಅವನು, “ಅದು ನಿಮ್ಮ ಕಣ್ಣುಗಳನ್ನು ತೆರೆಯುವುದು. ನೀವು ಒಳ್ಳೆದರ, ಕೆಟ್ಟದರ ಭೇದವನ್ನು ಅರಿತವರಾಗುವಿರಿ. ಅದನ್ನು ಮಾಡುವದಾದರೆ ಆಗ ನೀವು ದೇವರ ಹಾಗಾಗುವಿರಿ' ಎಂಬುದಾಗಿ ಹೇಳಿದನು. ಅದನ್ನೇ ಅವನು ಮಾಡಲಿಕ್ಕೆ ಇಚ್ಛಿಸುತ್ತಾನೆ. ಇಂದಿಗೂ ಅವನು ಅದನ್ನೇ ಮಾಡುತ್ತಾ ಬರುತ್ತಿದ್ದಾನೆ. ಏದೆನ್ ತೋಟದಲ್ಲಿ ಮತ ಸಂಬಂಧವಾದ ವಂಚನೆಯು ಆರಂಭವಾಗಿ, ಅಂದಿನಿಂದ ಇಂದಿನವರೆಗೂ ಅದು ನಡೆಯುತ್ತಲೇ ಬರುತ್ತಾ ಇದೆ.\nಆದಾಮನ ಕಾಲದಲ್ಲಿ ವಂಚನೆಯು ಉಂಟಾಗಿತ್ತು. ನೋಹನ ಕಾಲದಲ್ಲಿಯೂ ಸಹ ವಂಚನೆಯು ಕಾಣಿಸಿತು. ಯೇಸುವಿನ ಕಾಲದಲ್ಲಿಯೂ ಸಹ ಹಾಗೆಯೇ ತೋರಿತು. ಇಂದಿಗೂ ಅದುವೇ ನಡೆಯುತ್ತಿದೆ. ಅದೇ ರೀತಿಯ ಧಾರ್ಮಿಕವಾಗಿ ಕಾಣುವ ವಂಚನೆ.\n24ಕರ್ತನು ಈ ಲೋಕವನ್ನು ಆತನ ಅಧಿಕಾರದಲ್ಲಿ ಹೊಂದಿದ್ದಾಗ ದೇವರ ಮಾತುಗಳು ತಿರಸ್ಕರಿಸಲ್ಪಟ್ಟದ್ದಕ್ಕಾಗಿ ಸೈತಾನನು ಅಧಿಕಾರವನ್ನು ಕೈಗೊಂಡವನಾದನು. ಒಂದು ಸಮಯದಲ್ಲಿ ದೇವರು ಈ ಭೂಮಿಯನ್ನು ಆತನ ಅಧಿಕಾರದಲ್ಲಿ ಒಳಪಡಿಸಿಕೊಂಡಿದ್ದನು. ಅದರ ಸುತ್ತು ದಾರಿಯಲ್ಲಿ ಅದನ್ನು ಇಟ್ಟಿದ್ದನು. ಆ ದಾರಿಯಲ್ಲಿ ಅದು ಸುತ್ತು ಹಾಕುವ ಹಾಗೆ ಮಾಡಿದನು. ಎಲ್ಲವನ್ನು ಸಹ ಆತನು ಮಾಡಿದನು. ಮತ್ತು ಅದು ಆತನ ವಶದಲ್ಲಿ ಇತ್ತು. ಸೈತಾನನು ಅಧಿಕಾರವನ್ನು ವಹಿಸಿಕೊಂಡನಂತರೆ ಏನು ಸಂಭವಿಸಿತೆಂಬುದನ್ನು ಈಗ ಸ್ವಲ್ಪ ಗಮನಿಸೋಣ.\n25ಈ ಭೂಮಿಯನ್ನು ನಿರ್ಮಿಸಿ ಮುಗಿಸಲು ದೇವರಿಗೆ 6000 ವರ್ಷಗಳು ಹಿಡಿದವು. ಅಷ್ಟೊಂದು ವರ್ಷಗಳು ಆತನಿಗೆ ಬೇಕಾಗಿಲ್ಲ. ಆದರೆ ಆತನು ಅಷ್ಟೊಂದು ಸಮಯವನ್ನೇ ತೆಗೆದುಕೊಂಡನು. (ಹೌದು) ಆರು ಸಾವಿರ ವರ್ಷಗಳು. ಏಕೆಂದರೆ ಪರಲೋಕದಲ್ಲಿ ಒಂದು ದಿನವು ಭೂಲೋಕದಲ್ಲಿ ಸಾವಿರ ವರ್ಷದ ಕಾಲವೆಂದು ನಮಗೆ ತಿಳಿಸಲ್ಪಟ್ಟಿದೆ; ಮತ್ತು ಅದು 6000ವರ್ಷಗಳು, ಅಥವಾ ಆರು ದಿನಗಳಲ್ಲಿ ದೇವರು ಭೂಮಿಯನ್ನು ಸೃಷ್ಟಿಸಿದನು.\nಭೂಮಿಯನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಸ್ಥಾಪಿಸಲು ಆತನಿಗೆ 6000 ವರ್ಷಗಳೇ ಹಿಡಿದವು. ಒಳ್ಳೆಯ ಬೀಜಗಳನ್ನು ಬಿತ್ತಿ,ಅವುಗಳು ತಮ್ಮ ತಮ್ಮ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲಗಳನ್ನು ಮೊಳೆಯುವ ಹಾಗೆ ಮಾಡಲು ಆತನಿಗೆ 6000 ವರ್ಷಗಳು ಹಿಡಿದವು. ಆತನು ಸೃಷ್ಟಿಸಿದ ಬೀಜಗಳೆಲ್ಲವೂ ಸಹ ಒಳ್ಳೆಯವುಗಳಾದುದರಿಂದ, ಅವು ತಮ್ಮ ತಮ್ಮ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲ ತರಬೇಕು. ಪ್ರತಿಯೊಂದು ತನ್ನ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲ ತರಬೇಕು. ಪ್ರತಿಯೊಂದು ತನ್ನ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲ ತರಬೇಕು. ಕರ್ತನಿಗೆ ಇದಕ್ಕೋಸ್ಕರ 6000 ವರ್ಷಗಳೇ ಹಿಡಿಯಿತು.\n26ಕೊನೆಯದಾಗಿ ಇವೆಲ್ಲವನ್ನುಆತನು ಸೃಷ್ಟಿಸಿದ ನಂತರ, ಏದೆನಿಗೆ ಪೂರ್ವದಲ್ಲುಳ್ಳ ಏದೆನ್ ತೊಂಟವೆಂಬ ಸುಂದರವಾದ ಸ್ಥಳದಲ್ಲಿನಾವು ಕೊನೆಗೆ ಆತನ ಮುಖ್ಯ ನಿವಾಸ ಸ್ಥಾನವಾದ ಏದೇನ್ ತೋಟದಲ್ಲಿ ಇಡಲ್ಪಟ್ಟೆವು. ಏದೇನ್ ತೋಟದಲ್ಲಿದೇವರು ಪ್ರಪಂಚದ ಮುಖ್ಯ ವಾಸಸ್ಥಾನವನ್ನು ಮಾಡಿದನು. ಐಗುಪ್ತ ದೇಶದಲ್ಲಿ ಆ ತೋಟದ ಪೂರ್ವದಲ್ಲಿ ಆಮುಖ್ಯ ಸ್ಥಳವಿತ್ತು. ಎಲ್ಲಕ್ಕೂ ಅಧಿಕಾರಿಗಳಾಗಿ ತನ್ನ ಪುತ್ರನನ್ನೂ, ಅವನಪತ್ನಿಯನ್ನೂ ಆತನು ನಿಯಮಿಸಿದನು. ಅದು ನಿಜವೇ. ಅದನ್ನೇ ದೇವರು ಮಾಡಿದನು.\n27ಆತನು ಸಂಪೂರ್ಣ ಅಧಿಕಾರವನ್ನು ಅವರಿಗೆ ಕೊಟ್ಟನು. ಅವರು ಗಾಳಿಗೆ ಅಪ್ಪಣೆ ಮಾಡುವುದಾದರೆ ಗಾಳಿಯು ಬೀಸದೆ ನಿಂತು ಬಿಡುವದು. ಮರಗಳಿಗೆ ಅಪ್ಪಣೆ ಮಾಡುವುದಾದರೆ ಅವು ಸ್ಥಳಾಂತರಗೊಳ್ಳುತ್ತಿದ್ದವು. ಸಿಂಹವೂ ನರಿಯೂ ಒಂದಾಗಿಯೇ ಬೇಟೆಯ ಆಹಾರವನ್ನು ಭಕ್ಷಿಸಿದವು. ಅವುಗಳ ನಡುವೆಯೇ ಕುರಿಮರಿಯೂ ಮಲಗಿರುತ್ತಿತ್ತು. ಕೆಟ್ಟದೆಂಬುದೇ ಆಗ ಇರಲಿಲ್ಲ. ದೇವರ ಅಧಿಕಾರದ ಕೆಳಗೆ ಸಂಪೂರ್ಣ ಸಮಾಧಾನವೂ, ಸಂಪೂರ್ಣ ಐಕ್ಯವೂ ಕಾಣಲ್ಪಟ್ಟು ಎಲ್ಲವೂ ಸಹ ಪರಿಪೂರ್ಣತೆಯನ್ನು ಗಳಿಸಿಕೊಂಡಿದ್ದವು. ಲಕ್ಷಿಸಿರಿ. ಆತನೊಂದಿಗೆ ಆತನ ಪ್ರಪಂಚವಿತ್ತು. ಎಲ್ಲವೂ ಕಾರ್ಯಮಾಡುತ್ತಿತ್ತು. ಎಲ್ಲವೂ ಸರಿಗೊಳ್ಳುವ ಹಾಗೆ ಆತನು ಮಾಡಿದನು. ಎಲ್ಲವೂ ಸಹ ಹುಲ್ಲನ್ನು ಕಾಯಿಪಲ್ಯ ಬಿಡುವ ಮತ್ತು ಬೀಜ ಬಿಡುವಂಥ ಗಿಡಗಳನ್ನು ತಿಂದವು. ಯಾವುದೂ ಸಹ ಸಾಯಬೇಕಾದಂಥ ಅವಶ್ಯವಿರಲಿಲ್ಲ. ನಾಶಹೊಂದ ಬೇಕಾದಂಥದ್ದು ಇರಲಿಲ್ಲ ಕೆಡುವಂಥದ್ದು ಇರಲಿಲ್ಲ. ಎಲ್ಲವೂ ಸಹ ಪರಿಪೂರ್ಣತೆಯನ್ನು ಹೊಂದಿತ್ತು. ಎಲ್ಲಕ್ಕೂ ಮಿಗಿಲಾಗಿ ಆತನು ತನ್ನ ಪ್ರೀತಿಯ ಮಕ್ಕಳನ್ನು ಆತನ ಪುತ್ರನನ್ನು ಪುತ್ರಿಯನ್ನು ಗಂಡ, ಹೆಂಡತಿಯನ್ನುಇದರ ಮೇಲೆ ಅಧಿಕಾರ ನಡೆಸಲು ಇಟ್ಟನು.\n28ಕರ್ತನು ಅಧಿಕವಾಗಿ ತೃಪ್ತಿಗೊಂಡಾತನಾಗಿದ್ದರಿಂದ, ಏಳನೆಯ ದಿನದೆಂದು ಆತನು ತನ್ನ ಕಾವ್ಯಗಳನ್ನೆಲ್ಲಾ ಮುಗಿಸಿ, ವಿಶ್ರಮಿಸಿ, ಏಳನೆಯ ದಿನವಾದ ವಿಶ್ರಮದ ದಿನವನ್ನು ಪರಿಶುದ್ಧಗೊಳಿಸಿ ಆತನಿಗೋಸ್ಕರ ಸಬ್ಬತ್ತಾಗಿ ಮಾಡಿದನು. 6000ವರ್ಷಗಳ ಕಾಲದಿಂದ ಆತನು ಸೃಷ್ಟಿಸಿ ಉಂಟು ಮಾಡಿದವುಗಳನ್ನು ಆತನು ಮತ್ತೊಮ್ಮೆ ನೋಡಿದನು. ಆತನು ಬೆಟ್ಟಗಳನ್ನು ದೂರದಲ್ಲಿ ನಿರ್ಮಿಸಿ, ಅಗ್ನಿಪರ್ವತಗಳ ಲಾವಾವನ್ನು ಬತ್ತುವ ಹಾಗೆಮಾಡಿ, ಈಗಿರುವಂಥ ಸ್ಥಿತಿಯಲ್ಲಿ ಅವುಗಳನ್ನು ಆತನ ಇಚ್ಚೆಯಂತೆ ನಿರ್ಮಿಸಿದನು. ಒಂದು ಸುಂದರವಾದ ಸ್ಥಳವಾಗಿ ಅದು ನಿರ್ಮಿತವಾಗಿತ್ತು. ಅದರ ಹಾಗೆ ಬೇರೆ ಯಾವುದೂ ಸಹ ಕಾಣಲ್ಪಡಲಿಲ್ಲ.\n29ದೇವರ ಮಹತ್ತರವಾದ ಪರದೈಸಿನಲ್ಲಿ ಡೈನೋಸಾರ್ (Dinosaurs) ಎಂಬ ಬೃಹತ್ತರವಾದಂಥ ಪ್ರಾಣಿಗಳು ಮತ್ತು ಇನ್ನಿತರ ಆ ಮಹಾ ಪ್ರಾಣಿಗಳು ಅಲ್ಲಿ ಸಂಚರಿಸುತ್ತಾ ಇರುತ್ತಿದ್ದವು.ಅವುಗಳು ಯಾರಿಗೂ ಸಹ ತೊಂದರೆ ಮಾಡುತ್ತಿರಲಿಲ್ಲ. ಬೆಕ್ಕಿನ ಮರಿಗಳಂತೆ ಅವು ಸಾಧುಗಳಾಗಿದ್ದವು. ಆಗ ಭೂಮಿಯಲ್ಲಿ ರೋಗಗಳೂ, ದುಃಖಗಳೂ, ರೋಗಗಳನ್ನುಂಟು ಮಾಡುವಂಥ ಕ್ರಿಮಿಗಳೂ ಸಹ ಇರಲಿಲ್ಲ. ಓ! ಎಂಥ ಒಂದು ಸ್ಥಳ ಸುಂದರವಾದಂಥ ಪಕ್ಷಿಗಳೂ ಮರದಿಂದ ಮರಕ್ಕೆ ಹಾರುತ್ತಿದ್ದವು. ಆದಾಮನು ಅವುಗಳನ್ನು ಹೆಸರೆಸರಾಗಿ ಕರೆಯಲು, ಅವುಗಳು ಹಾರಿ ಬಂದು ಅವನ ಭುಜದ ಮೇಲೆ ಕುಳಿತು ಅವನ ಬಳಿ ಕೂಗುತ್ತಿದ್ದವು. ದೇವರು ಹೀಗೆ ನಿರ್ಮಿಸಿದಂಥ ಸ್ಥಳವು ಎಷ್ಟೊಂದು ಅದ್ಭುತಕರವಾಗಿತ್ತು!\n30. ಕರ್ತನು ತನ್ನ ಸ್ವಂತ ಶರೀರದಿಂದ ತನ್ನ ಸ್ವಭಾವ (attributes) ಗಳಲ್ಲಿ ಒಂದನ್ನು ಹೊರತಂದನು. ನೀವು ನಿಮ್ಮ ತಂದೆಯ ಸ್ವಾಭಾವವನ್ನುಳ್ಳವರಾಗಿರುತ್ತೀರಿ. ಹಾಗೆಯೇ ದೇವರ ಶರೀರದೊಳಗೂ ಆ ಸ್ವಭಾವಗಳು ಇವೆ. ನೀವು ನಿಮ್ಮ ಅಜ್ಜನ ಅಜ್ಜನೊಳಗೆ ಇದ್ದಿರಿ. ಹಾಗೆಯೇ ನಿಮ್ಮ ತಂದೆಯೊಳಗೆ ನೀವು ಇದ್ದಿರೆಂಬುದಾಗಿ ಇಟ್ಟುಕೊಳ್ಳೋಣ.\nನಿಮ್ಮ ತಂದೆಯೊಳಗ ನೀವು ಇದ್ದಾಗ, ನೀವು ಒಂದನ್ನು ಸಹ ಅರಿತಿರಲಿಲ್ಲ. ಜೀವವನ್ನು ನೀಡುವಂಥ ಅಣುವು ಪುರುಷನಿಂದಲೇ ಬರುತ್ತದೆ. ಪುರುಷನಲ್ಲಿ ರಕ್ತ ಅಣುಗಳು ಇವೆ. ಸ್ತ್ರೀಯೊಂದಿಗೆ ಅಂಡವು ಇದೆ. ಆದುದರಿಂದ ರಕ್ತದ ಅಣುಗಳಲ್ಲಿ ಜೀವವು ಉಂಟು. ನಿಮ್ಮ ತಂದೆಯೊಳಗೆ ಇದ್ದಾಗ ನೀವು ಏನನ್ನೂ ಅರಿತಿರಲಿಲ್ಲ. ಆದರೂ ನಿಮ್ಮ ತಂದೆಯವರೊಳಗೆ ನೀವು ಇದ್ದುದನ್ನು ವಿಜ್ಞಾನವೂ, ದೇವರ ವಾಕ್ಯವೂ ಸಾಧಿಸಿತೋರಿಸುತ್ತದೆ. ಆದರೆ ನೀವು ಈ ಯಾವ ವಿಷಯವನ್ನೂ ತಿಳಿದಿರಲಿಲ್ಲ.\nನಿನ್ನನ್ನು ತಿಳ್ಳುಕೊಳ್ಳಬೇಕೆಂದು ನಿನ್ನ ತಂದೆಯು ಬಯಸಿದಾಗ ನಿನ್ನ ತಾಯಿಯೊಂದಿಗೆ ಅವರು ಕೂಡಿಕೊಂಡರು. ಅದರ ಫಲವಾಗಿ ನಿನ್ನ ತಂದೆಗೆ ನೀನು ಗೋಚರವಾದಿ, ಈಗ ನೀನು ನಿನ್ನ ತಂದೆಯ ಗುಣವನ್ನು ಹೊಂದಿಕೊಂಡಿದ್ದೆ, ನೋಡಲಿಕ್ಕೆ ನೀವು ಅವರ ಹಾಗೆಯೇ ಇರುತ್ತಿ. ನಿನ್ನ ಶರೀರದ ಅಂಗಗಳೂ ಸಹ ನಿನ್ನ ತಂದೆಯ ಅಂಗಗಳಂತೆಯೇ ಇದೆ. ಅದೇ ರೀತಿಯಲ್ಲಿ ದೇವರು ಆದಿಯಲ್ಲಿ ಇದ್ದನು. ದೇವರ ಒಬ್ಬೊಬ್ಬ ಪುತ್ರನೂ, ಪುತ್ರಿಯೂ ಸಹ ಆದಿಯಲ್ಲಿ ಆತನೊಳಗೆ ಇದ್ದರು. ಆದರೆ ಅದು ಈಗ ನಿನಗೆ ಜ್ಞಾಪಕವಿರಲಿಕ್ಕಿಲ್ಲ. ಆದರೆ ಅಲ್ಲಿಯೇ ನೀನು ಇದ್ದಿ. ಆತನು ಅದನ್ನು ಅರಿತಿದ್ದನು. ನಿನ್ನೊಂದಿಗೆ ಸಂಪರ್ಕಿಸಲು, ಮಾತನಾಡಲು, ನಿನ್ನನ್ನು ಪ್ರೀತಿಸಲು,ನಿನ್ನೊಂದಿಗೆ ಕೈಕುಲುಕಲು ಸಾಧ್ಯವಾಗುವಂತೆ ನೀನು ಸೃಷ್ಟಿಸಲ್ಪಡಬೇಕೆಂಬುದಾಗಿ ಆತನು ಇಷ್ಟಪಟ್ಟನು.\n31ನಿಮ್ಮ ಮಗನು ಯುದ್ಧ ಭೂಮಿಯಿಂದ ಅಥವಾ ಇನ್ನಿತರ ಸ್ಥಳದಿಂದ ಬಹಳ ಕಷ್ಟ ತೊಂದರೆಯಿಂದ ಬಿಡುಗಡೆ ಹೊಂದಿ ಮನೆಗೆ ಹಿಂದಿರುಗಿ ನಿಮ್ಮೊಡನೆ ಮೇಜಿನಲ್ಲಿ ಕುಳಿತು (ಆಹಾರವನ್ನು ತೆಗೆದು) ಕೊಳ್ಳುವಂಥ ದಿನವು ಒಂದು ಮಹತ್ತವಾದ ದಿನವಾಗಿ ಇರುತ್ತದಲ್ಲವೋ? ಒಂದು ದೊಡ್ಡ ಔಣತವನ್ನು ಅವನಿಗೋಸ್ಕರ ಸಿದ್ಧಗೊಳಿಸಿ, ಕೊಬ್ಬಿದ ಕರುವನ್ನು ಕೊಯ್ಯುತ್ತೀರಿ ಅಲ್ಲವೋ? ಏಕೆಂದರೆ ಅವನು ನಿಮ್ಮ ಸ್ವಂತ ಶರೀರವೂ ರಕ್ತವೂ ಆಗಿರುತ್ತಾನೆ. ಅವನು ನಿಮ್ಮೊಳಗೆ ಇದ್ದನು. ಆದರೆ ನೀವು ಆಗ ಆತನ ಬಗ್ಗೆ ತಿಳಿದುಕೊಂಡಿರಲಿಲ್ಲ. ಆದರೆ ಅವನು ನಿಮ್ಮೊಳಗೆ ಇದ್ದನೆಂಬುದನ್ನು ನೀವು ತಿಳಿದಿದ್ದಿರಿ.\n32ಆದ್ದರಿಂದಲೇ ದೇವರು, ನಾವು ಇಲ್ಲಿ ಇರುವೆವು ಎಂಬುದನ್ನು ಅರಿತಿದ್ದನು. ಮತ್ತು ನಮ್ಮೊಂದಿಗೆ ಸಂಬಂಧವನ್ನು ಹೊಂದಿಕೊಳ್ಳಬೇಕೆಂದೆಣಿಸಿ ನಮ್ಮನ್ನು ಶರೀರದೊಳಗೆ ಸೃಷ್ಟಿಯಾಗುವ ಹಾಗೆ ಮಾಡಿದನು. ನಮ್ಮೊಡನೆ ಸಂಬಂಧವನ್ನು ಹೊಂದಿಕೊಳ್ಳಬೇಕೆಂದು ಆತನೂ ನಮ್ಮ ಹಾಗೆ ಒಬ್ಬನಾಗಿ ದೇವ ಕುಮಾರನಾದ ಯೇಸುಕ್ರಿಸ್ತನಾಗಿ - ದೇವರ ಪರಿಪೂರ್ಣತೆಯನ್ನು ಪ್ರಕಟಪಡಿಸುವಾತನಾಗಿ ಬಂದನು.\nಆದ್ದರಿಂದಲೇ ಆತನ ಗುಣಧರ್ಮಗಳನ್ನು ನಮ್ಮೊಂದಿಗಿನ ಅನ್ನೋನ್ಯತೆಯಲ್ಲಿ ಪ್ರಕಟಪಡಿಸುವದು ದೇವರ ಉದ್ದೇಶವಾಗಿತ್ತು. ನನ್ನ ತಂದೆಯೊಳಗೆ ನಾನು ಇದ್ದಾಗ ಅದರ ವಿಷಯ ನಾನು ಏನನ್ನು ತಿಳಿದಿರಲಿಲ್ಲ. ಆದರೆ ನಾನು ಅವರ ಮೂಲಕ ಜನ್ಮವೆತ್ತಿ ಅವರ ಮಗನಾದಾಗ, ನಾನು ನನ್ನ ತಂದೆಯ ಒಂದು ಭಾಗವಾಗಿ ಅವರ ಸ್ವಭಾವವುಳ್ಳವನಾಗಿದ್ದೆನು. ನೀನು ನಿನ್ನ ತಂದೆಯ ಭಾಗವಾಗಿದ್ದಿ ದೇವರ ಮಕ್ಕಳಾದ ನಾವು, ದೇವರಲ್ಲಿದ್ದ ದೇವರ ಸ್ವರೂಪದ ಭಾಗಗಳಾಗಿ ಇದ್ದೇವೆ. ದೇವರ ಕುಟುಂಬದಲ್ಲಿ ಸದಸ್ಯರಾಗಿ ನಾವು ಈ ಲೋಕದಲ್ಲಿ ಒಬ್ಬರೊಂದಿಗೆ ಒಬ್ಬರು ಐಕ್ಯವನ್ನು ಹೊಂದಿಕೊಳ್ಳಬೇಕೆಂದು, ಆತನು ಶರೀರಧಾರಿಯಾದ ಹಾಗೆ ನಾವೂ ಶರೀರಧಾರಿಗಳಾದೆವು. ಇದುವೇ ಆದಿಯಲ್ಲಿ ದೇವರು ಹೊಂದಿದ್ದಂಥ ಉದ್ದೇಶ. ಹೌದಯ್ಯಾ, ದೇವರು ಆದಿಯಲ್ಲಿ ಇದನ್ನೇ ಬಯಸಿದ್ದನು. ಎಲ್ಲವೂ ಸಹ ಆತನ ಅಧೀನತೆಯಲ್ಲಿ ಇತ್ತು. ಆತನು ಮನುಷ್ಯನನ್ನು ಏದೆನ್ ತೋಟದಲ್ಲಿರಿಸಿ, ಅವನಿಗೆ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ಕೊಟ್ಟು “ಮಗನೇ ಇದು ನಿನ್ನದು''ಎಂದನು.\n33ಎಷ್ಟೊಂದು ಸುಂದರವಾದಂಥ ಜಾಗ?\nದೇವರು ಎಷ್ಟರಮಟ್ಟಿಗೆ ತೃಪ್ತಿಗೊಂಡನೆಂದರೆ, ಆತನು ಹಿಂದೆಹೋಗಿ ತನ್ನ ಎಲ್ಲಾ ಕಾರ್ಯಗಳಿಂದ ವಿಶ್ರಮಿಸಿಕೊಂಡನು. ಪ್ರತಿಯೊಂದು ಮರವೂ ಎಂದೂ ಮುಳ್ಳು ಗಿಡಗಳನ್ನೂ ಕಳೆಗಳನ್ನೂತರಲಿಲ್ಲ. ಯಾವ 'ಬೆರಿ' ಹಣ್ಣು ಸಹ (ಚಿಕ್ಕದಾದ ಬೀಜವಿಲ್ಲದ ಹಣ್ಣು), ಮುಳ್ಳುಗಿಡಗಳಿಂದ ಹುಟ್ಟಿ ಬರಲಿಲ್ಲ. ಎಲ್ಲವೂ ಪರಿಪೂರ್ಣವಾಗಿತ್ತು; ಎಲ್ಲಾ ಬೀಜಗಳು ಪರಿಪೂರ್ಣವಾಗಿದ್ದವು. ಪ್ರತಿಯೊಂದು ಪರಿಪೂರ್ಣ ಸ್ಥಿತಿಯಲ್ಲಿತ್ತು.\nಆಗ ಆತನು ಸ್ವಲ್ಪ ವಿಶ್ರಾಂತಿಯನ್ನು ತೆಗೆದುಕೊಳ್ಳಲು ಹೋದಾಗ, ಆತನ ವೈರಿಯು ತನ್ನ ವಂಚನೆಯಿಂದ ಮೆಲ್ಲನೆ ಒಳಬಂದು, ಆತನ ಈ ಎಲ್ಲಾ ಯೋಜನೆಯ ವಿಷಯ ಆತನ ಮಕ್ಕಳಿಗೆ ವ್ಯತಿರಿಕ್ತವಾದದ್ದನ್ನು ಹೇಳಿ, ಅದನ್ನು ತನ್ನ ವಶದಲ್ಲಿ ಮಾಡಿಕೊಂಡನು. ನೀನು ನಿನ್ನ ಮಗಳು ಬೇರೊಬ್ಬ ಪುರುಷನೊಂದಿಗೆ ರಾತ್ರಿಯಲ್ಲಿ ಹೊರಗೆ ಹೋದಾಗ ಯಾವ ರೀತಿ ಆಕೆಯ ಮೇಲೆ ಭರವಸವಿಡುತ್ತೀಯೋ, ಅಥವಾ ನಿನ್ನ ಮಗನು, ಒಬ್ಬ ಕುಡುಕ ಅಥವಾ ಧೂಮ್ರಪಾನ ಮಾಡುವ ಹುಡುಗನೊಂದಿಗೆ ಹೋಗಬೇಕಾದಾಗ ಯಾವ ರೀತಿ ಆವನ ಮೇಲೆ ಭರವಸೆವಿಡುತ್ತೀಯೋ, ಅದೇ ರೀತಿ ಆತನು ತನ್ನ ಸ್ವಂತ ಮಗುವಿನ ಮೇಲೆ ಭರವಸೆ ಇಡುತ್ತಾನೆ, ನೋಡಿರಿ? ತನ್ನ ಮಗನು ತಪ್ಪಾದ ಯಾವ ಸಂಗತಿಯನ್ನು ಮಾಡುವದಿಲ್ಲವೆಂದೂ, ಆತನು ಹೇಳಿದ ಪ್ರತಿಯೊಂದು ಮಾತಿಗೆ ಅವನು ವಿಧೇಯನಾಗುವನೆಂದೂ ಆತನು ಅವನ ಮಗನ ಮೇಲೆ ಭರವಸೆ ಇಡುತ್ತಾನೆ, ಆದರೆ ವೈರಿಯುಒ ಳಬಂದನು. ಒಬ್ಬ ನುಣ್ಣಗಾಗಿ ಕಾಣುವ ಪುರುಷನು ನಿನ್ನ ಪುತ್ರಿಯನ್ನು ಹೊರಗೆ ಕರೆದು ಕೊಂಡು ಹೋಗಿ ಆಕೆಯೊಡನೆ ಮರ್ಯಾದೆ ತಪ್ಪಿವರ್ತಿಸುವಂತೆ, ಅಥವಾ ಒಬ್ಬಾಕೆ ಸ್ತ್ರೀ ನಿನ್ನಮಗನೊಂದಿಗೆ ಹೊರಗೆ ಹೋಗಿ ಅದೇ ರೀತಿ ನಡೆಯುವಂತೆ, ನೋಡಿರಿ!ಅವನು ಒಳಹೊಕ್ಕಿದನು. ದೇವರ ವೈರಿಯು ಒಳಹೊಕ್ಕಿದನು, ಮತ್ತು ಹವ್ವಳಿಗೆ ಆ ವಾಕ್ಯವನ್ನು ತಪ್ಪಾದ ಅರ್ಥಮಾಡಿ ಹೇಳಿದನು.\n34ಈಗ ಈ ಬೀಳುವಿಕೆಯ ಮುಖಾಂತರ, ಅವನು (ಸೈತಾನನು) ತಾನಾಗಿ, ಆ ಏದೆನ್ತೋಟವನ್ನು ತನ್ನ ವಶದಲ್ಲಿ ತೆಗೆದುಕೊಂಡು ಅದನ್ನು ಹೊಂದಿಕೊಂಡನು. ಅವನು ಅದನ್ನು ತನ್ನ ವಶದಲ್ಲಿ ತೆಗೆದುಕೊಂಡನು. ಮತ್ತು ಈಗಾಗಲೇ ಅವನು 6000 ವರ್ಷಗಳ, ವಂಚನೆಯಿಂದ ತುಂಬಿದ ಆಳ್ವಿಕೆಯನ್ನು ಮಾಡುತ್ತಾ ಬಂದಿದ್ದಾನೆ, ಆ ಸಮಯದಲ್ಲಿ ಮಾಡಿದಂತೆ ಈಗಲೂ ಜನರನ್ನು ದೇವರ ಮಕ್ಕಳನ್ನು ಮೋಸಗೊಳಿಸುತ್ತಿದ್ದಾನೆ. ಯಾಕಂದರೆ ಅವರು ತಮ್ಮ ಸ್ವಚ್ಚೆಯಂತೆ,ಅವರು ಬಯಸಿದ ರೀತಿಯಲ್ಲಿ ವರ್ತಿಸಲು ಅಲ್ಲಿ ಇಡಲ್ಪಟ್ಟರು, ಮತ್ತು ಅವರು ಯೋಗ್ಯವಾದ ರೀತಿಯಲ್ಲಿ ವರ್ತಿಸುವರು ಎಂಬುದಾಗಿ ಅವರ ಮೇಲೆ ವಿಶ್ವಾಸವಿಡಲ್ಪಟ್ಟಿತ್ತು. ಆದರೆ ಅವರು ಅಯೋಗ್ಯವಾದ (ತಪ್ಪಾದ) ರೀತಿಯಲ್ಲಿ ವರ್ತಿಸಿದರು ಮತ್ತು ತಮ್ಮ ಜನ್ಮಸಿದ್ಧ ಹಕ್ಕನ್ನು ಲೋಕಕ್ಕೋಸ್ಕರ ಮಾರಿಬಿಟ್ಟರು. (ಏಸಾವನು ಮಾಡಿದಂತೆ); ಮತ್ತು ಸೈತಾನನು ಇದರ ಮೇಲೆ ಜಯವನ್ನು ಗಳಿಸಿ, ಅದನ್ನು ತನ್ನ ವಶದಲ್ಲಿ ತೆಗೆದುಕೊಂಡನು.ಮತ್ತು ದೇವರು ತನ್ನ ಏದೆನ್ ತೋಟವನ್ನು ಒಂದು ಸಮಾಪ್ತಿಗೆ (ಪರಿಪೂರ್ಣತೆಗೆ) ತರಲು 5000 ವರ್ಷಗಳನ್ನು ತೆಗೆದುಕೊಂಡಂತೆ ಅವನು (ಸೈತಾನನು) ತನ್ನ ಏದೆನನ್ನು ವಂಚನೆ ಮೂಲಕ ಕಟ್ಟಲು, ಅವನಿಗೆ 6000 ವರ್ಷಗಳು ಕೊಡಲ್ಪಟ್ಟಿವೆ;(ವಾಕ್ಯದ ಅಥವಾ ಜನರ ವಂಚನೆ) ಈಗ ಪಾಪದಲ್ಲಿ ತನ್ನದೆ ಆದ ಏದೆನನ್ನು ಈ ಲೋಕದಲ್ಲಿ ಸ್ಥಾಪಿಸಿದನು.\n35ದೇವರ ಏದೆನ್ತೋಟವು ನೀತಿಯ ಮೂಲಕವಾಗಿ ಸ್ಥಾಪಿಸಲ್ಪಟ್ಟಿತ್ತು. ಸೈತಾನನ ಏದೆನ್ ಪಾಪದಲ್ಲಿ ಸ್ಥಾಪಿಸಲ್ಪಟ್ಟಿತು, ಯಾಕೆಂದರೆ ಸೈತಾನನೇ ಪಾಪವಾಗಿದ್ದಾನೆ. ದೇವರು ನೀತಿಸ್ವರೂಪನಾಗಿದ್ದಾನೆ. ದೇವರ ರಾಜ್ಯವು ನೀತಿ ಮತ್ತು ಶಾಂತಿಯಲ್ಲಿಯೂ ಮತ್ತು ಜೀವದಾಯಕವಾಗಿಯೂ ಸ್ಥಾಪಿಸಲ್ಪಟ್ಟಿತು. ಮತ್ತು ಸೈತಾನನ ಸ್ಥಾಪನೆಯು ಪಾಪದಲ್ಲಿ ಮತ್ತು ಧಾರ್ಮಿಕವಾಗಿ ಕಾಣುವ ಪಾಪದಲ್ಲಿ.\nಅವನು, ತಾನು ಮಾಡುವೆನೆಂದು ಹೇಳಿದಂತೆ ಯಾವ ರೀತಿ ವಂಚನೆಯ ಮೂಲಕ ವಂಚಿಸಿದನು ಎಂಬುದನ್ನು ಗಮನಿಸಿರಿ. ಅವರು ಹಾಗೆ ಮಾಡುವೆನೆಂದು ಶಪಥ ಹಾಕಿದನು. ಇದು ಯಾರಿಗಾದರೂ ತಿಳಿದಿದೆಯೇ? ನಾವು ಯೆಶಾಯನ ಪ್ರವಾದನೆಯ ಪುಸ್ತಕವನ್ನು ನೋಡೋಣ, ನಿಮಗೆ ಈ ಕೆಲವು ವಾಕ್ಯಗಳನ್ನು ಓದಬೇಕಾದರೆ... ಇದಲ್ಲದೆ ಇನ್ನೂ ಹೆಚ್ಚಿನವುಗಳನ್ನು ನಿಮಗೆ ಓದಿ ತಿಳಿಸಬೇಕೆಂದು ಎಣಿಸುತ್ತೇನೆ. ಕೆಲವೇ ಕ್ಷಣ, ಯೇಶಾಯ, 14ನೇ ಅಧ್ಯಾಯವನ್ನು ನೋಡೋಣ ಮತ್ತು ಸೈತಾನನು ಇಲ್ಲಿ ಏನು ಹೇಳಿದನೆಂದು ನೋಡೋಣ, ನಾವು ಅದನ್ನು ಯೆಶಾಯ 14ನೇ ಅಧ್ಯಾಯದಲ್ಲಿ ಓದೋಣ, ಮತ್ತು ಈ ವ್ಯಕ್ತಿಯು (ಸೈತಾನನು) ಏನು ಮಾಡಿದ್ದಾನೆಂದು ನೋಡೋಣ. ಯೆಶಾಯ 14; 12ನೇ ವಚನದಿಂದ ಮೊದಲುಗೊಂಡು\n“ಓ ಲುಸೀಫರನೇ, ಉದಯನಕ್ಷತ್ರವೇ, ಆಕಾಶದಿಂದ ಹೇಗೆ ಬಿದ್ದೆ! ಜನಾಂಗಗಳನ್ನುಕೆಡವಿದ ನೀನು ಕಡೆಯಲ್ಪಟ್ಟು ನೆಲಕ್ಕೆ ಉರುಳಿದೆಯಲ್ಲಾ!\nನೀನು ನಿನ್ನ ಮನಸ್ಸಿನಲ್ಲಿ - ನಾನು ಆಕಾಶಕ್ಕೆ ಹತ್ತಿ ಉತ್ತರದಿಕ್ಕಿನ ಕಟ್ಟಕಡೆಯಿರುವ, ಸುರಗಣ (ದೇವರ ಸಭೆಯೆಂಬ) ಪರ್ವತದಲ್ಲಿ ನನ್ನ ಸಿಂಹಾಸನವನ್ನು ದೇವರನಕ್ಷತ್ರ (ಅಂದರೆ ಮಕ್ಕಳು)ಗಳಿಗಿಂತ ಮೇಲೆ ಏರಿಸಿ ಆಸೀನನಾಗುವೆನು! ಉನ್ನತ ಮೇಘಮಂಡಲದ ಮೇಲೆ ಏರಿ ಉನ್ನತೋನ್ನತನಿಗೆ ಸರಿಸಮಾನನಾಗುವೆನು ಅಂದು ಕೊಂಡಿದ್ದೆಯಲ್ಲಾ!“\n36ಈಗ, ಅದನ್ನು ಇಲ್ಲಿ ಕೆಲವು ಸಮಯದ ಹಿಂದೆ ನೋಡಿದ ಥೆಸಲೋನಿಕದವರಿಗೆ ಬರೆದ ಪತ್ರಿಕೆಯಲ್ಲಿರುವ ಬೇರೆ ವಾಕ್ಯಗಳೊಂದಿಗೆ ಹೋಲಿಸಿ ನೋಡಿರಿ, ಯಾವ ರೀತಿ ಆತನು, “ಯಾವದು ದೇವರೆನಿಸಿಕೊಳ್ಳುತ್ತದೋ, ಯಾವುದು ಪೂಜೆಹೊಂದುತ್ತದೋ, ಅದನ್ನೆಲ್ಲಾ ನಾಶನಕ್ಕೆ ಅಧೀನನಾದ ಆ ಪುರುಷನು ಎದುರಿಸಿ, ಅದಕ್ಕಿಂತ ಮೇಲಾಗಿ ತನ್ನನ್ನು ತಾನೇ ಹೆಚ್ಚಿಸಿಕೊಂಡು ತಾನು ದೇವರೆಂದು ಹೇಳಿಕೊಂಡು ದೇವರ ಗರ್ಭಗುಡಿಯಲ್ಲಿ ಕೂತುಕೊಳ್ಳುತ್ತಾನೆ! ದೇವರಂತೆ ಈ ಪೃಥ್ವಿಯಲ್ಲಿ ಪೂಜೆಯೊಂದುತ್ತಾನೆ'' ಎಂದು ಹೇಳಿದ್ದಾನೆಂದು ನೋಡಿರಿ.\nಅಲ್ಲಿಯೇ ಮೊನ್ನೆಯ ಭಾನುವಾರ ನಾನು ನಿಮಗೆ ಪ್ರಸಂಗಿಸಿದ ಈ ಲೋಕದ ದೇವರು ಇದ್ದಾನೆ. ಈ ದಿನದಲ್ಲಿ ಇಲ್ಲಿ ಅವನು ಮೋಸಗಾರನಾಗಿ ಇದ್ದಾನೆ. (ವಂಟಿಸುವವನಾಗಿ ಇದ್ದಾನೆ). ಆ ವಿಶ್ವಾಸ ಘಾತಕವಾದ ಸಮಯ! ನಾವು ಜೀವಿಸಿರುವಂಥಾ ಈ ಪ್ರಚಂಡ (ಭಯಂಕರ)ವಾದ ಸಮಯ! ಎಲ್ಲಾ ಕಾಲಗಳಿಗಿಂತ ಅತ್ಯಂತ ಮಹಿಮೆಯಿಂದ ತುಂಬಿದ ಸಮಯವು ಇದಾಗಿದೆ, ಯಾಕಂದರೆ ಆ ಮಹಾ ಸಾವಿರ ವರ್ಷದ ಆಳ್ವಿಕೆಯನ್ನು ನಾವು ಪುನಹ ಎದುರು ನೋಡುತ್ತಿದ್ದೇವೆ! ನಾವು ಆ ಏದೇನ್ ಅನ್ನು ಪುನಃ ಎದುರು ನೋಡುತ್ತಿದ್ದೇವೆ. ಆದರೆ ಸರಿಯಾಗಿ ಇದೇ ಕಾಲದಲ್ಲಿ (ಎಲ್ಲಾ ವಂಚನೆ ಮತ್ತು ವಂಚಿಸಲು ಶಕ್ತವಾದ ಹಿಂದೆಂದೂ ಉಪಯೋಗಿಸದ ಪ್ರತಿಯೊಂದು ಯೋಜನೆಯನ್ನು ಅವನು ಉಪಯೋಗಿಸುತ್ತಿದ್ದಾನೆ.) ಅದೆಲ್ಲವನ್ನೂ ಅವನು ಒಟ್ಟುಗೂಡಿಸಿ ತನ್ನನ್ನು ಶಕ್ತಿಶಾಲಿಯಾಗಿ ಮಾಡಿದ್ದಾನೆ, ಮತ್ತು ದೇವರಂತೆಯೇ ಕೆಳಗೆ ಇಳಿದು ಬಂದಿದ್ದಾನೆ, ಮತ್ತು ತನ್ನನ್ನು ದೇವರ ಸ್ಥಾನದಲ್ಲಿ ಇಟ್ಟುಕೊಂಡಿದ್ದಾನೆ, ಧಾರ್ಮಿಕನು, ವಾಕ್ಯವನ್ನು ಎತ್ತಿ ಹೇಳಬಲ್ಲನು, ಮತ್ತು ಏದೆನ್ ತೋಟದಲ್ಲಿ ಸೈತಾನನು ಹವ್ವಳಿಗೆ ಹೇಳಿದಂತೆ, ನಿನಗೆ ದೇವರ ವಾಕ್ಯವನ್ನ ಹೇಳುವನು. ಆದರೆ ಅದರಲ್ಲಿ ಒಂದು ಸಣ್ಣ ಭಾಗವನ್ನು ಬಿಟ್ಟು ಬಿಡುವನು, ಅವನು ಅಷ್ಟನ್ನೇ ಮಾಡುವನು; ಆ ಪಿಶಾಚಿಯ ವಿಷದಿಂದ ತುಂಬಿದ ಸಿದ್ಧಾಂತವನ್ನು ಅಲ್ಲಿ ಆ ಸ್ಥಳದಲ್ಲಿ ಸುರಿದು ಬಿಡುವನು,ನಿನ್ನೆಯ ರಾತ್ರಿ ನಾವು ಮಾತಾಡುತ್ತಿದ್ದ “ಯೋಚಿಸುವ ಮನುಷ್ಯನ ಸೋಸಿಕೆ” (Thinking Man's Filter) ಎಂಬುವ ವಿಷಯದಂತೆ.\n37ಈಗ, ಅವನು ತನ್ನನ್ನು ತಾನು ಉನ್ನತೋನ್ನತನಿಗಿಂತಲೂ ಮೇಲೆ ಹೆಚ್ಚಿಸಿ ಕೊಳ್ಳುವೆನು ಎಂದು ಹೇಳಿದ್ದಾನೆ. ಅವನು ಮೇಘಮಂಡಲಗಳ ಮತ್ತು ನಕ್ಷತ್ರ ರಾಶಿಗಳ ಮೇಲೆಯೂ ಏರಿಹೋಗುವನು, ಮತ್ತು ಅವನು ಅಲ್ಲಿ ದೇವರಂತೆ ಆಸೀನನಾಗುವನು, ಮತ್ತು ಉನ್ನತೋನ್ನತನಿಗಿಂತಲೂ ಮೇಲೆ ಇರುವನು. ಮತ್ತು ಅವನು ತನ್ನ ಬೆದರಿಸುವಿಕೆಗಳನ್ನು ಮಾಡುವದರಲ್ಲಿ ಜಯಿಸಿದವನಾಗಿದ್ದಾನೆ. ಜನರು ಪ್ರತೀ ಯುಗದಲ್ಲಿ ದೇವರ ವಾಗ್ದಾನ ಮಾಡಲ್ಪಟ್ಟ ವಾಕ್ಯದ ಅರ್ಥವನ್ನು ಅವನಿಗೆ ಹೇಳಲು ಅವಕಾಶ ಕೊಟ್ಟದರ ಮೂಲಕ ಅವನು ತನ್ನ ಬೆದರಿಸುವಿಕೆಗಳನ್ನು ಕೈಗೊಳ್ಳುವದರಲ್ಲಿ ಆಶ್ಚರ್ಯಕರವಾದ ಜಯವನ್ನು ಹೊಂದಿದವನಾಗಿದ್ದಾನೆ. ಪ್ರತೀ ಯುಗದಲ್ಲಿ ಅವನು ಅದನ್ನು ವ್ಯಾಖ್ಯಾನ ಮಾಡಿದನು (ಬೋಧಿಸಿದನು)ಅದುವೇ ಅವನು ಅದನ್ನು ಸರಿಯಾಗಿ ಮಾಡಿದ ರೀತಿ.\n38ನೋಹನ ದಿನಗಳಲ್ಲಿ ಆಕಾಶದಿಂದ ಮಳೆಯು ಸುರಿಯುವದು, ಅದು ಅಸಾಧ್ಯವೆಂದು, ಅವನು(ಸೈತಾನನು) ಬೋಧಿಸಿದನು. ಯಾಕೆಂದರೆ ಅಲ್ಲಿ ಮಳೆಯಾಗುವ ಸಂಭವವೇ ಇಲ್ಲ. ಏದೆನ್ ತೋಟದಲ್ಲಿ ಬೋಧಿಸಿದಂತೆ ಆ ವೈಜ್ಞಾನಿಕ ಸುಸಮಾಚಾರ, ಅವನು ಆ ಚಂದ್ರ ಲೋಕಕ್ಕೆ ವೈಜ್ಞಾನಿಕ ಸಲಕರಣೆಗಳನ್ನು ಬಿಟ್ಟು ಅಲ್ಲಿ ಯಾವ ರೀತಿಯ ನೀರಿನ ತೇವವೂ ಇಲ್ಲವೆಂದು ಸಾಧಿಸಿ ತೋರಿಸ ಬಲ್ಲನು. ಆದರೆ ದೇವರು ಅಲ್ಲಿ ಮಳೆಯು (ಜಲಪ್ರಳೆಳಯ) ಬಂದೇ ಬರುವದು ಎಂದು ಹೇಳಿದನು. ಆದರೆ ವೈಜ್ಞಾನಿಕ ಸಂಶೋಧನೆಯ ಮೂಲಕ ಅದು ಸಾಧ್ಯವಿಲ್ಲವೆಂದು ಹೇಳಲು, ಜನರ ಮನಸ್ಸನ್ನು ತನ್ನ ಆ ವಿಷದಿಂದ ಭ್ರಷ್ಟಪಡಿಸುವದರಲ್ಲಿ ಸೈತಾನನು ಜಯ ಹೊಂದಿದನು. ಆದರೆ ಅದು ಮಾಡಲ್ಪಟ್ಟಿತು (ನೆರವೇರಿತು)! ದೇವರು ಅದು ಮಾಡಲ್ಪಡುವದು ಎಂದು ಹೇಳಿದನು, ಮತ್ತು ಅದು ಮಾಡಲ್ಪಟ್ಟಿತು. ಆತನು ಅದನ್ನು ಮಾಡಿದನು.\n39ಈಗ ಯೇಸುವಿ ನದಿನಗಳಲ್ಲಿ ಅವನು (ಸೈತಾನನು) ಅದನ್ನೇ ಮಾಡಿದನು. ಮೋಸದ ಮೂಲಕವಾಗಿ (ವಂಚನೆಯ ಮೂಲಕವಾಗಿ) ಅವನು ಅವರ ಮನಸ್ಸನ್ನು ಪುನಃ ಕೆಡಿಸಿದನು, ನೋಡಿರಿ. ದೇವರ ವಾಕ್ಯವನ್ನು ತಪ್ಪು ಅರ್ಥಮಾಡಿ ಹೇಳುವಂಥಹದು, “ನೀನು ದೇವರ ಮಗನಾಗಿರುವದಾದರೆ, ಈಗ ನೀನು ಇದರ ವಿಷಯ ಒಂದು ಅದ್ಭುತವನ್ನು ಮಾಡುವದನ್ನು ನಾನು ನೋಡುವಂಥಾಗಲಿ.” ಯೇಸುವು(ಸೈತಾನನ) ಅವನ ಹಾಸ್ಯದ ಪ್ರಕಾರ ಕುಣಿಯಲಿಲ್ಲ. ಆತನು ಅದನ್ನು ಮಾಡಲಿಲ್ಲ. ದೇವರುಹಾಸ್ಯಗಾರನಲ್ಲ. ಸೈತಾನನು ಕೇಳುವ ಯಾವುದೇ ವಿಷಯಕ್ಕೋಸ್ಕರವೂ ಆತನು ಉತ್ತರವನ್ನು ಈಯುವ ಅಗತ್ಯವಿಲ್ಲ. ಯೇಸುವು ಕೇವಲ ಹೇಳಿದ್ದೇನೆಂದರೆ “ಮನುಷ್ಯನು ಕೇವಲ ರೊಟ್ಟಿತಿಂದ ಮಾತ್ರದಿಂದ ಬದುಕುವದಿಲ್ಲ, ಆದರೆ ದೇವರ ಬಾಯಿಯಿಂದ ಹೊರಡುವ ಪ್ರತಿಯೊಂದು ಮಾತಿನಿಂದ ಬದುಕುವನು.” ಅವನ ಹಾಸ್ಯಕ್ಕನುಸಾರವಾಗಿ ವರ್ತಿಸುವ ಅಗತ್ಯ ಆತನಿಗೆ (ಕ್ರಿಸ್ತನಿಗೆ) ಇರಲಿಲ್ಲ. ಆತನು ರೊಟ್ಟಿಯನ್ನು ಉಂಟು ಮಾಡಿ ತೋರಿಸುವ ಅಗತ್ಯವಿರಲಿಲ್ಲ. ಆತನು (ಖಂಡಿತವಾಗಿ) ಅದನ್ನು ಮಾಡಲು ಶಕ್ತನಾಗಿದ್ದನು. ಆದರೆ ಅದು ಪಿಶಾಚನ ಮಾತುಗಳಿಗೆ ಒಪ್ಪಿದಂಥಾಗುವದು, ಮತ್ತು ಆದುದರಿಂದಲೇ ಆತನು ಪಿಶಾಚನ ಮಾತುಗಳಿಗೆ ಒಪ್ಪುವ ಅಗತ್ಯವಿರಲಿಲ್ಲ.\n40ಮತ್ತು ಪುನಃ ಅದು ಒಂದು ಧಾರ್ಮಿಕವಾದ ಪಾಪವಾಗಿದೆ, ಆದಿಯಲ್ಲಿದ್ದಂತೆ, - ಅದು ಬಹಳ ಮೋಸಕರವಾದದ್ದು ಅದನ್ನು ಈಗ ಸೂಕ್ಷ್ಮವಾಗಿ ನೋಡಿರಿ. ಅದು ಕೇವಲ ಒಂದು ಸರಳವಾದ ದಿನಂಪ್ರತಿಯಲ್ಲಿ ಇರುವಂಥ ಹಳೆಯ ಪಾಪವಲ್ಲ ಅಂದರೆ ವ್ಯಭಿಚಾರ, ಕುಡಿದು ಮತ್ತರಾಗುವಂಥಹದು ದೇವರ ಹೆಸರನ್ನು ವ್ಯರ್ಥವಾಗಿ ಎತ್ತುವಂತಹದು, ಅದು ಈ ಎಲ್ಲಾ ಪಾಪಗಳಲ್ಲ ಅಲ್ಲವೇ ಅಲ್ಲ.\nನಿಮಗೆ, ಇಲ್ಲಿರುವ ಅನೇಕರಿಗೆ,ಬಹಳ ವರುಷದಿಂದ ಇಲ್ಲದ್ದಂಥಾ ನಿಮಗೆ, ಕೆಲವು ವರುಷಗಳ ಹಿಂದೆ ನಾನು ಪ್ರಸಂಗಿಸಿದಂಥ “ನ್ಯಾಯತೀರ್ಪಿಕೆಯ ದಿನದಲ್ಲಾಗುವಂಥ ಆಶಾಭಂಗ (ನಿರಾಶೆ)” ಎಂಬ ವಿಷಯದ ನೆನಪಿದೆಯೋ?ಒಬ್ಬ ಸೊಳೆಯು (ವೇಶೈಯು) ಆ ದಿನದಲ್ಲಿ ಹೆಚ್ಚು ನಿರಾಶೆಗೊಳ್ಳುವ ಪ್ರಸಂಗವಿಲ್ಲ. ಅವಳಿಗೆ ತಾನು ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತೇನೆಂದು ತಿಳಿದಿತ್ತು. ಕುಡುಕನು ಅಲ್ಲಿ ನಿರಾಶೆಗೊಳ್ಳುವದಿಲ್ಲ. ಸರಾಯಿಮಾರುವವನು, ಜೂಜುಗಾರನು, ಸುಳ್ಳುಗಾರನು, ಕಳ್ಳನು, - ಇವರೆಲ್ಲಾ ಆ ದಿನದಲ್ಲಿ ನಿರಾಶೆಗೊಳ್ಳುವದಿಲ್ಲ. ಆದರೆ ತಾನು ಸರಿಯಾಗಿದ್ದೇನೆ ಎಂದು ತೀಳುಕೊಳ್ಳುವ ಮನುಷ್ಯನು - ಆ ದಿನದಲ್ಲಿ ನಿರಾಶೆಗೊಳ್ಳುವನು. ಅವನೇ ಈ ರೀತಿಯಾಗಿ (ಯೇಸುವಿಗೆ) ಹೇಳುವ ವ್ಯಕ್ತಿಯಾಗಿದ್ದಾನೆ. “ಸ್ವಾಮೀ, ನಾನು ಸುವಾರ್ತೆಯನ್ನು ಸಾರಲಿಲ್ಲವೇ, ನಿನ್ನ ಹೆಸರಿನಲ್ಲಿ ದುರಾತಗಳನ್ನು ಬಿಡಿಸಲಿಲ್ಲವೇ?\n41ಯೇಸುಹೇಳಿದ್ದು,“ಅ ನೀತಿಯನ್ನು ನಡೆಸುವವರೇ ನನ್ನಿಂದ ತೊಲಗಿ ಹೋಗಿರಿ, ನಾನೆಂದೂ ನಿಮ್ಮನ್ನು ತಿಳಿದಿಲ್ಲ”\nಅಲ್ಲಿಯೇ ಆ ನಿರಾಶೆ ಇದೆ, ನೋಡಿರಿ. ಆ ವಂಚನೆ, ಅಲ್ಲಿಯೇ ನಾನು ಸತತವಾಗಿ, ನಾನು ಬಹಳಷ್ಟು ತಪ್ಪಾಗಿ (ಜನರಿಂದ) ತಿಳುಕೊಳ್ಳಲ್ಪಟ್ಟಿದ್ದೇನೆ. ನಾನು ಇತರರಿಗಿಂತ ಭಿನ್ನವಾಗಿರಬೇಕೆಂದು ನಾನು ಇದನ್ನು ಹೇಳುವದಿಲ್ಲ, ನಾನು ಭಿನ್ನವಾಗಿರಬೇಕೆಂದು ಆಶಿಸುವದಲ್ಲಿ, ಆದರೆ ನಾನು ಪ್ರಾಮಾಣಿಕನಾಗಿರಬೇಕಾಗಿರುವದು (ಸತ್ಯವನ್ನೇ ಹೇಳುವವನನಾಗಿರಬೇಕಾಗಿರುವುದು.)\nನನ್ನೊಡನೆ ಒಂದು ಸಂದೇಶವಿದೆ, ಮತ್ತು ಅದು ಜನರಿಗೆ ಹೋಗಲೇಬೇಕು. ಜನರ ಮಧ್ಯದಲ್ಲಿ ಅದು ಸರಿಯಾದ ರೀತಿಯಲ್ಲಿ ಅವರು ತಿಳಿಯುವಂತೆ ಸಾರಲ್ಪಡಬೇಕು. ನಾನು ಪ್ರತಿಯೊಬ್ಬರ ವಿರೋಧವಾಗಿ ಇದ್ದೇನೆ ಎಂದು ಅವರುತಿ ಳುಕೊಳ್ಳುತ್ತಾರೆ. ಆದರೆ ನಾನು ಅವರೆಲ್ಲರ ಪರವಾಗಿ ಇದ್ದೇನೆಂದು ಅವರಿಗೆ ತಿಳಿದಿದ್ದರೆ ಎಷ್ಟೋ ಒಳ್ಳೇದಾಗಿತ್ತು! ಸತ್ಯವೆಂಬುದು ಏನು ಎಂಬುದನ್ನು ಅವರು ತಿಳಿಕೊಳ್ಳಬೇಕೆಂದೇ ನಾನು ನನ್ನಿಂದಾದಷ್ಟು ಪ್ರಯತ್ನವನ್ನು ಮಾಡುತ್ತೇನೆ. ಇಲ್ಲಿ ಬೈಬಲಿನಲಿ ಅದು ಇರುವ ಪ್ರಕಾರ ಮತ್ತು ಅದು ನನ್ನ ಹೃದಯದಲ್ಲಿ ಇರುವ ಪ್ರಕಾರ ಅವರಿಗೆ ಅದನ್ನು ತಿಳಿಯಪಡಿಸಲು ಇಷ್ಟಪಡುತ್ತೇನೆ. ಮತ್ತು ದೇವರು ಅದು ಸತ್ಯವಾಗಿದೆ ಎಂಬುದನ್ನು ಪ್ರಮಾಣ ಮಾಡಿ ತೋರಿಸುತ್ತಾನೆ. ಅದರ ವಿಷಯ ಬೇರೇನನ್ನೂ ಮಾಡುವ ಅವಶ್ಯವಿರುವದಿಲ್ಲ. ಅವರು ಅದನ್ನು ಒಂದೇ ತಿಳುಕೊಳ್ಳುವರು ಅಥವಾ ತಿಳ್ಳುಕೊಳ್ಳಲಾರರು (ಅಂದರೆ ತಿರಸ್ಕರಿಸುವರು) ಅಷ್ಟೇ.\n42ನೋಡಿರಿ, ಅದನ್ನು ಅವರು ನೋಡಲು (ತಿಳುಕೊಳ್ಳಲು) ಇಷ್ಟ ಪಡುವದಿಲ್ಲ ಯಾಕಂದರೆ, ಅವರು ಈಗಾಗಲೇ ಮಾರಲ್ಪಟ್ಟವರಾಗಿದ್ದಾರೆ. ತಮ್ಮ ಜನ್ಮಸಿದ್ಧ ಹಕ್ಕನ್ನು (ಚೊಚ್ಚಲು ತನದ ಹಕ್ಕನ್ನು) ಯಾವುದೋ ಒಂದು ಸಂಘ ಸಂಸ್ಥೆಗೆ, ಅಥವಾ ಸಂಪ್ರದಾಯ ಸಭೆಗೆ ಮಾರಿಬಿಟ್ಟಿದ್ದಾರೆ. ಪರಲೋಕಕ್ಕೆ ಹೋಗಲು ತಮ್ಮ ಚೊಚ್ಚಲು ತನದ ಹಕ್ಕನ್ನು ಯಾವುದೋ ಒಂದು ಸಂಸ್ಥಾಪಿಸಲ್ಪಟ್ಟ ಧಾರ್ಮಿಕತೆಯ ಆಧಾರದ ಮೇಲೆ ಕಟ್ಟುತ್ತಾರೆ. ಮತ್ತು ಅದರ ಪ್ರತಿಯೊಂದು ವಿಷಯದ ಮುಖ್ಯಸ್ಥನು ಸೈತಾನನಾಗಿದ್ದಾನೆ.\nದೇವರಲ್ಲಿ ಎಂದೂ ಸಂಸ್ಥಾಪಿಸಲ್ಪಟ್ಟ ಒಂದು ಧಾರ್ಮಿಕತೆ ಇರಲಿಲ್ಲ. ಎಂದೂ ಇರಲಿಲ್ಲ. ಮತ್ತು ಅವರು ತಮ್ಮನ್ನು ಅದಕ್ಕೆ ಮಾರಿಬಿಡುತ್ತಾರೆ. ಅಲ್ಲಿ ಅವರು ... ಕೆಲವು ಜನರ ಗುಂಪು, ಆ ವಾಕ್ಯವನ್ನು ಅದು ಈ ರೀತಿಯಾಗಿ ಹೇಳುತ್ತದೆ, ಆ ರೀತಿಯಾಗಿ ಹೇಳುತ್ತದೆ ಎಂದು ಅದನ್ನು ವಿವರಿಸುತ್ತಾರೆ. ದೇವರಿಗೆ ಯಾವ ತರ್ಜುಮೆಗಾರನ ಅಗತ್ಯವಿಲ್ಲ. ಆತನು ತನ್ನ ತರ್ಜುಮೆಯನ್ನು ತಾನೇ ಮಾಡುತ್ತಾನೆ. ಅದನ್ನು ಹ್ಯಾಗೆ ಮಾಡಬೇಕೆಂದು ಹೇಳಲು ಇತರರ ಯಾರ ಅಗತ್ಯವೂ ಆತನಿಗಿರುವದಿಲ್ಲ, ಆತನು ಸಾರ್ವಭೌಮನಾಗಿದ್ದಾನೆ. (ಪರಮ ಶಕ್ತಿಯುಳ್ಳವನಾಗಿದ್ದಾನೆ). ಅದನ್ನು ಹಾಗೆ ಮಾಡುವೆನೆಂದು ಆತನು ಹೇಳಿದ್ದಾನೆ. ಮತ್ತು ಅದೇ ರೀತಿಯಾಗಿ ಆತನು ತನ್ನ ವಾಕ್ಯವನ್ನು ಕಾಪಾಡಲೇಬೇಕು. (ಪಾಲಿಸಲೇಬೇಕು)“ಆತನು ನಂಬುವವನೊಂದಿಗೆ ಈ ಚಿಹ್ನೆಗಳು ಇರುವವು'' ಎಂದು ಹೇಳಿದಾಗ, ಆತನು ಅದನ್ನೇ ನಿಜವಾಗಿ ಉದ್ದೇಶಿಸಿದನು.\nಆತನು ಸಂಭವಿಸುವವೆಂದು ಹೇಳಿದ ಸಂಗತಿಗಳೆಲ್ಲಾ ಈ ಕಡೇ ದಿನಗಳಲ್ಲಿ ಸಂಭವಿಸುವವು ಎಂದು ಆತನು ಹೇಳಿದ್ದಾನೆ. ಆತನು ಕೆಲವು ವಿಷಯಗಳನ್ನು ಮಾಡುವೆನೆಂದು ಹೇಳಿದ್ದಾನೆ ಮತ್ತು ಅದನ್ನು ಮಾಡಿದ್ದಾನೆ. ಅಲ್ಲಿ ಸಮಯವು ಇದೆಯೋ ಇಲ್ಲವೋ ಎಂದು ಆತನು ಯಾರನ್ನು ಕೇಳುವ ಅಗತ್ಯವಿರುವದಿಲ್ಲ. ಯಾವ ಸಮಯ, ಮತ್ತು ಅದಕ್ಕೆ ಯಾವ ಯೋಜನೆ ಇದೆ ಎಂದು ಆತನು ಚೆನ್ನಾಗಿ ಬಲ್ಲವನಾಗಿದ್ದಾನೆ.\n43ಈಗ ಸೈತಾನನು, ಈ ಮೋಸಗಾರನು, ಮತ್ತಾಯ 24:24ರಲ್ಲಿ ಹೇಳಿದಂತೆ ಬಹಳಷ್ಟು ಮೋಸದಿಂದ ತುಂಬಿದವನಾಗಿದ್ದಾನೆ.\nಈಗ ನಾವು ಕಂಡುಕೊಳ್ಳುತ್ತೇವೆನೆಂದರೆ, ಅವನ, ಜ್ಞಾನ, ಹೆಚ್ಚಿನ, ವಿದ್ಯಾಭ್ಯಾಸ, ಹೆಚ್ಚಿನದಾದ ನೀತಿತತ್ವಗಳು, ಸಂಸ್ಕೃತಿ ಮತ್ತು ಇನ್ನಿತರ ಎಲ್ಲಾ ರೀತಿಯ ಸುವಾರ್ತೆಯೆಂದು ಹೇಳಿಕೊಳ್ಳುವ ಕಾರ್ಯಕ್ರಮಗಳಿಂದ, ದೇವರನ್ನು ಸೇವಿಸಲು ಬಯಸುವ ಜನರನ್ನು ಅವನ ಸುಳ್ಳನ್ನು ನಂಬುವಂತೆ ಮರುಳುಗೊಳಿಸಿದ್ದಾನೆ. ಹವ್ವಳು ಅದನ್ನು ಮಾಡಲು ಬಯಸಿರಲಿಲ್ಲ. ಆದರೆ ಅವನು (ಸೈತಾನನು) ಅದರಲ್ಲಿ ಯಾವ ರೀತಿ ಹೆಚ್ಚಿನ ಜ್ಞಾನವಿದೆ ಎಂದು ಆಕೆಗೆ ತೋರಿಸಿದನು.\nಆಕೆಗೆ ತಿಳಿದಿರಲಿಲ್ಲ. ಆದರೆ ತಿಳಿಯಬೇಕೆಂದು ಬಯಸಿದಳು. ಆಕೆಗೆ ಅರ್ಥವಾಗಲಿಲ್ಲ. ಆದರೆ ಅದನ್ನು ಕಂಡುಕೊಳ್ಳಬೇಕೆಂದು ಬಯಸಿದಳು. ದೇವರು ಅದನ್ನು ಕಂಡುಕೊಳ್ಳಲು ಪ್ರಯತ್ನವೂ ಮಾಡಬಾರದೆಂದು ಹೇಳಿದ್ದನು. ಈ ಎಲ್ಲಾ ಸಂಗತಿಗಳನ್ನು ನಾನು ಹೇಗೆ ತಿಳಿಯಬಲ್ಲೆ? ನಾನು ಅವುಗಳನ್ನು ತಿಳಿಯಲಾರೆನು. ನಾನು ಅವನ್ನು ನಂಬುತ್ತೇನೆ. ನಾನು ಅವುಗಳನ್ನು ತಿಳಿದುಕೊಳ್ಳುವ ಅವಶ್ಯಕತೆ ಇರುವದಿಲ್ಲ. ದೇವರು ಎಂದರೆ ನಂಬಿಕೆ ಅಲ್ಲದೆ ತಿಳ್ಳುಕೊಳ್ಳುವಂಥದಲ್ಲ, ಆತನು ಹೇಳುವದನ್ನು ನಾನು ಕೇವಲ ನಂಬುತ್ತೇವೆ ಅಷ್ಟೆ.\n44ಈಗ, ದೇವರ ಈ ಕಾಲಕ್ಕಾಗಿ ವಾಗ್ದಾಮಾಡಲ್ಪಟ್ಟ ವಾಕ್ಯದ ನಿಜವಾದ ಅರ್ಥವನ್ನು (ಭ್ರಷ್ಟಗೊಳಿಸಿದ) ವಿರೂಪಗೊಳಿಸಿದ, 6000ವರ್ಷಗಳ ನಂತರ,ಈಗ ಸೈತಾನನ ಈ ಏದೆನನ್ನು ದೇವರ ಏದೆನ್ ತೋಟಕ್ಕೆ ಹೋಲಿಸಿ ನೋಡಿರಿ. ಈಗ ನಾವು ಅದನ್ನು ಹೋಲಿಸಿ,ನಮಗೆ ಏನು ಗೋಚರ ವಾಗುತ್ತದೆ ಎಂದು ನೋಡೋಣ. ಕ್ರಿಸ್ತ ಯೇಸುವಿನ ಕಾಲದಲ್ಲಿ ದೇವರ ಪ್ರಾಮಾಣಿಕ(ಮಕ್ಕಳನ್ನು) ಪುತ್ರರನ್ನು ಸತ್ಯವನ್ನು ತಿಳಿಯಲಾರದಂತೆ ಅವನು ಮಾಡಿದಂತೆ, ದೇವರು ತನ್ನ ಪುತ್ರರನ್ನು, ಆತನ ಗುಣಗಳನ್ನು ಆತನ ವಾಕ್ಯವನ್ನು ಕೇಳುವದರ ಮೂಲಕ ಆತನೊಂದಿಗೆ ಅನ್ನೋನ್ಯತೆ ಹೊಂದಬೇಕೆಂದು ಇಲ್ಲಿ ಇಟ್ಟಿದ್ದಾನೆ.\n45ನೀನು ನಿನ್ನ ತಂದೆಗೆ ಒಬ್ಬ ಪ್ರಾಮಾಣಿಕನಾದ ಮಗನಾಗಿರುವದಾದರೆ, ಮತ್ತು ನಿನ್ನ ತಂದೆಯು ನಿನಗೆ, “ಮಗನೇ, ನೀನು ಅಲ್ಲಿ ಆ ನೀರಿನಲ್ಲಿ ಈಜಿಕೊಂಡು ಹೋಗಬೇಡ, ಯಾಕಂದರೆ ಅಲ್ಲಿ ಆ ನೀರಿನಲ್ಲಿ ಮೊಸಳೆಗಳಿವೆ'' ಎಂದು ಹೇಳುವದಾದರೆ ಮತ್ತು ಯಾರೋ ಒಬ್ಬನು ಬಂದು ನಿನಗೆ ”ಖಂಡಿತವಾಗಿ, ಅಷ್ಟು ಸುಂದರವಾದ ನೀರು. ಅಲ್ಲಿ ಅದರಲ್ಲಿ ಮೊಸಳೆಗಳಿಲ್ಲ“ ಎಂದು ಹೇಳುವದಾದರೆ ಏನು?\nಈಗ ನೀನು ಯಾರ ಮಾತನ್ನು ಕೇಳುತ್ತಿ? ನೀನು ನಿಜವಾಗಿ ಯಥಾರ್ಥವಾದ ಮಗನಾಗಿರುವದಾದರೆ, ನೀನು ನಿನ್ನ ತಂದೆಯ ಮಾತನ್ನು ಕೇಳುವಿ. ಮತ್ತು ಒಬ್ಬ ನಿಷ್ಕಪಟವಾದ ದೇವರ ಮಗನಾಗಲಿ, ಮಗಳಾಗಲಿ, ಮೊತ್ತ ಮೊದಲಾಗಿ ದೇವರ ವಾಕ್ಯವನ್ನು ನಂಬುವರು! ಬೇರೆ ಯಾರಾದರೂ ಅದರ ವಿಷಯವಾಗಿ ಏನು ಹೇಳಿದರೂ ನಾನು ಅದನ್ನು ಲಕ್ಷಿಸುವದಿಲ್ಲ. ಅವರು ಮೊತ್ತಮೊದಲಾಗಿ ದೇವರ ವಾಕ್ಯವನ್ನು ತೆಗೆದುಕೊಳ್ಳುವರು. ಅಲ್ಲಿ ಪಾತ್ರೆಯಲ್ಲಿ ವಿಷವಿದೆ ಮತ್ತು ಅವರು ಅದನ್ನು ನಂಬುವರು. ಆತನ ಸಂತಾನವು ಆತನ ಎಲ್ಲಾ ವಾಕ್ಯಗಳಲ್ಲಿ ಭರವಸೆ (ವಿಶ್ವಾಸ) ವಿಡುವದರ ಮೂಲಕ ಪವಿತ್ರತೆಯ ಪ್ರೀತಿಯಿಂದ ತುಂಬಿದ, ಮತ್ತು ನಿತ್ಯ ಜೀವದ ಆ ಏದೆನ್ ತೋಟವನ್ನು ಈ ಲೋಕದಲ್ಲಿ ತರುತ್ತದೆ.\nಅದುವೇ ದೇವರ ಏದೆನ್ ಉಂಟು ಮಾಡುವಂಥಾದ್ದು - ಅಂದರೆ ಪರಿಶುದ್ಧತೆ ಮತ್ತು ಅದು ಒಂದು ಪವಿತ್ರತೆಯ, ಪ್ರೀತಿಯ, ತಿಳುವಳಿಕೆಯುಳ್ಳ, ಪರಿಪೂರ್ಣವಾದ ಮತ್ತು ನಿತ್ಯ ಜೀವದ ಏದೆನನ್ನು ತಂದಿತು. ಅದುವೇ ದೇವರ ಯೋಜನೆಯಾಗಿದೆ. ಆತನ ಸಭೆಯು ಕೊನೆಗೆ ಆತನ ವಾಕ್ಯ, ಆತನ ಸಂತಾನವಾಗಿಯೇ ಇರುವದು. ಅದು ಅದೇ\nಆಗಿರುವದು.\n46ಲಕ್ಷ್ಯವಿಡಿರಿ, ಇಲ್ಲಿ ಒಂದು ವಿಷಯವಿದೆ. ಇದನ್ನು ಮರೆಯಬೇಡಿರಿ. ನಾನು ಅದನ್ನು ಇನ್ನೂ ಆಳವಾಗಿ ಇನ್ನೊಂದು ಸಮಯದಲ್ಲಿ ಬೇರೊಂದು ಸಂದೇಶದ ಮೂಲಕ ನಿಮಗೆ ಹೇಳುವೆನು. ಆದರೆ ನಿಮಗೆ ತಿಳಿದಂತೆ ದೇವರು ಹೇಳಿದ್ದು “ಪ್ರತಿಯೊಂದು ಬೀಜವು ಅದರದರ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲವನ್ನು ತರಲಿ.” ಇದು ದೇವರ ಅಪ್ಪಣೆಯಾಗಿದೆಯೋ? ಈಗ ಯಾವನೇ ಬೋಧಕನಾಗಲಿ, ಇತರ ಯಾರೇ ಆಗಲಿ ಈ ವಾಕ್ಯವು ಇದನ್ನಲ್ಲದೆ ಬೇರೆ ಯಾವದನ್ನೋ ಹೇಳುತ್ತದೆ ಎಂದು ಹೇಳಲು ಪ್ರಯತ್ನ ಮಾಡುವದರಿಂದ ಯಾವ ಒಳಿತು ಇರಬಹುದು? ನೋಡಿರಿ? ದೇವರ ಪ್ರತಿಯೊಂದು ವಾಕ್ಯವು ಅದು ಒಂದು ಬೀಜವಾಗಿದೆ. ಯೇಸುವು ಆ ರೀತಿಯಾಗಿ ಹೇಳಿದನು - ಬಿತ್ತುವವನು ಬೀಜವನ್ನು ಬಿತ್ತಿದ್ದನು. ಆದ್ದರಿಂದ ಮಾರ್ಕ 16, ದೇವರ ವಾಕ್ಯವಾಗಿರುವದಾದರೆ, ಅದು ತನ್ನ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲವನ್ನು ತರುವದು. ಮಲಾಕಿ 4 ದೇವರ ವಾಕ್ಯವಾಗಿದ್ದರೆ, ಅದು ತನ್ನ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲವನ್ನು ತರುವದು ಮತ್ತು ಪ್ರತಿಯೊಂದು ಇತರ ವಾಗ್ದಾನಗಳು ಅದರ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲ ತರಲೇಬೇಕು.\n47ನೀವು ನೋಡಿದಿರೋ? ಇಲ್ಲಿ ವೇಷಧಾರಣೆ ಮಾಡಿದ (ರೂಪಬದಲಾಯಿಸಿದ) ಸೈತಾನನ್ನು ನೋಡಿದಿರೋ? “ಅದು ಆ ರೀತಿ ಅಲ್ಲ” ಎಂದು ಹೇಳಲು ಅವನು ಪ್ರಯತ್ನ ಮಾಡುತ್ತಾನೆ. ನಿಮಗೆ ಇದು ತಿಳಿಯಿತೋ? ನೋಡಿರಿ, ಸೈತಾನನು ಹೇಳುತ್ತಾನೆ, “ಓ, ಅದು (ಆ ವಾಕ್ಯವು) ಈ ಕಾಲಕ್ಕಾಗಿ ಅಲ್ಲ, ಅದು ಯಾವುದೋ ಮೊದಲಿನ ಕಾಲಕ್ಕಾಗಿ ಇತ್ತು. ಅದು ಅದರ ಅರ್ಥ ಆ ರೀತಿ ಅಲ್ಲವೇ ಅಲ್ಲ” ಪ್ರತಿಯೊಂದು ಬೀಜವು ಅದರ ಜಾತಿಗನುಗುಣವಾಗಿ ಫಲವನ್ನು ತರಲೇಬೇಕು! ಈ ರೀತಿಯಾಗಿ ದೇವರು ತನ್ನ ಏದೆನನ್ನು ಸ್ಥಾಪಿಸಿದನು. ಇದು ಸತ್ಯವಾಗಿದೆಯೋ?\nಮತ್ತು ಅದು ಇಲ್ಲಿದೆ. ದೇವರು ತನ್ನ ಸಭೆಯನ್ನು ಸ್ಥಾಪಿಸುವ ರೀತಿ ಇದುವೇ ಆಗಿದೆ. ಪ್ರತಿ ವಾಕ್ಯವು ಅದರ ಜಾತಿಗನುಗುಣವಾಗಿ ಫಲ ತರುವದು. “ಮನುಷ್ಯನು ರೊಟ್ಟಿ ತಿಂದ ಮಾತ್ರದಿಂದ ಬದುಕುವುದಿಲ್ಲ. ಆದರೆ ದೇವರ ಬಾಯಿಯಿಂದ ಹೊರಡುವ ಪ್ರತಿಯೊಂದು ಮಾತಿನಿಂದ ಬದುಕುವನು” ನೋಡಿರಿ.ಸೈತಾನನು ಬೇರೊಂದು ವಿಷಯವನ್ನು ತೆಗೆಯುವನು. ಆದರೆ ದೇವರು ಹೇಳಿದ್ದು “ಪ್ರತೀ ಬೀಜವು ಅದರ ಜಾತಿಗನುಗುಣವಾಗಿ”. “ವಾಗ್ದಾನವು ನಂಬುವವರ ಸಂಗಡ ಈ ಚಿಹ್ನೆಗಳು ಇರುವುದು'' ಎಂದು ಹೇಳುವದಾದರೆ, ಈಗ ಸಭೆಯು ಹೇಳುತ್ತದೆ ”ಸಭೆಗೆ ಬಂದು ಕೂಡಿಕೊಳ್ಳಿರಿ. ವಿಶ್ವಾಸ ಪ್ರಮಾಣವನ್ನು ಅರಿಕೆ ಮಾಡಿರಿ; ಪ್ರಶೋತ್ತರರೂಪದ ಗ್ರಂಥವನ್ನು ಕಲಿಯಿರಿ“ ಇಂಥಾ ಸಂಗತಿಗಳು ಇಡೀ ಬೈಬಲಿನಲ್ಲಿ ಇಲ್ಲವೇ ಇಲ್ಲ. ಆದರೆ ಯೇಸು ಹೇಳಿದ್ದು, ”ನಂಬುವವರೊಂದಿಗೆಈ ಚಿಹ್ನೆಗಳು ಇರುವವು. ನನ್ನ ಹೆಸರಿನಲ್ಲಿ ಅವರು ದೆವ್ವಗಳನ್ನು ಬಿಡಿಸುವರು. ಅವರು ಅನ್ಯಭಾಷೆಯಲ್ಲಿ ಮಾತನಾಡುವರು. ಹಾವುಗಳನ್ನು ಎತ್ತುವರು, ವಿಷಪದಾರ್ಥವನ್ನೇನಾದರೂ ಕುಡಿದರೂ, ಅವರಿಗೆ ಯಾವ ಕೇಡೂ ಆಗುವುದಿಲ್ಲ. ಅವರು ರೋಗಿಗಳ ಮೇಲೆ ಕೈಯಿಟ್ಟರೆ ಅವರಿಗೆ ಗುಣವಾಗುವದು“ ಯಾವ ಮನುಷ್ಯನು ಇದನ್ನು ನಿರಾಕರಿಸಬಲ್ಲನು? ನೋಡಿರಿ?\n48ಪ್ರತೀಬೀಜವು ಅದರ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲ ತರುವದು. ನೀನು ಒಂದು ದೇವರ ಬೀಜವಾಗಿರುವದಾದರೆ, ಗುಣವಾಗಿರುವದಾದರೆ, ದೇವರ ಮಗನಾಗಿರುವದಾದರೆ ಆಗ ದೇವರ ವಾಕ್ಯವು ನಿನ್ನಲ್ಲಿ ಬಿತ್ತಲ್ಪಡುತ್ತದೆ. ನೋಡಿರಿ. ಮತ್ತು ಆಗ ನೀನು ದೇವರ ವಾಕ್ಯವನ್ನು ಕೇಳಿದೊಡನೆ, “ನನ್ನ ಕುರಿಗಳು ನನ್ನ ಸ್ವರಕ್ಕೆ ಕಿವಿಗೊಡುತ್ತದೆ. ಅಪರಿಚಿತ ಮನುಷ್ಯನನ್ನು ಅವುಗಳು ಹಿಂಬಾಲಿಸಲಾರವು'' ಇದು ನಿಮಗೆ ತಿಳಿಯಿತೋ? ಹಾಗಾದರೆ ಪ್ರತಿಯೊಂದು ಬೀಜವು ಅದರ ಜಾತಿಗನುಸಾರವಾಗಿ ಫಲಕೊಡುತ್ತದೆ.\n49ಈಗ ನಾವು ತಿಳಿಯುತ್ತೇವೇನೆಂದರೆ, ಪ್ರತಿಯೊಂದು ಬೀಜವು ಆದರ ಜಾತಿಗನು ಸಾರವಾಗಿ ಫಲವನ್ನು ತರುತಿತ್ತು. ಆ ಏದೆನ್ ತೋಟದಲ್ಲಿ ಮೃತ್ಯುವೆಂಬುದು ಇರಲಿಲ್ಲ. ಹೊಸ ಏದೆನ್‌ನಲ್ಲಿ ಸಹ ಅಲ್ಲಿ ಮೃತ್ಯುವೆಂಬುದು ಇರುವದಿಲ್ಲ ನೋಡಿರಿ. ಅಲ್ಲಿ ಪವಿತ್ರತೆ, ಶುದ್ಧತೆ, ಮತ್ತು ನಿತ್ಯ ಜೀವದ ಹೊರತು ಬೇರೆ ಯಾವುದೂ ಅಲ್ಲಿ ಇರಲಿಲ್ಲ.\nಈಗ ಈ ಸೈತಾನನನ ಏದೆನ್‌ನಲ್ಲಿ ಸಂಪೂರ್ಣ ದೇವರ ವಾಕ್ಯದ ಮೇಲೆ ಇರುವ ಅಪನಂಬಿಕೆಯ ಮೂಲಕವಾಗಿ ಅಪರಿಶುದ್ಧತೆಯ ಬೀಜವು ಅಲ್ಲಿ ಹುಟ್ಟಿ ಬಂತು. ನಾವು ಈಗ ಈ ಲೋಕವೆಂಬ ಏದೆನ್‌ನಲ್ಲಿ ಎಲ್ಲಿ ಸೈತಾನನು ಅಂತಿ ಕ್ರಿಸ್ತನಾಗಿ, ಆಸನಾರೂಢನಾಗಿದ್ದಾನೋ, ಅಂಥಹ ಸ್ಥಳಕ್ಕೆ ಪ್ರವೇಶಿಸುತ್ತಿದ್ದೇವೆ. ಪಾಪದಿಂದ ತುಂಬಿದ ವಿರೂಪಗೊಳಿಸಲ್ಪಟ್ಟ ಧಾರ್ಮಿಕತೆಯಿಂದ ತುಂಬಿದ ಏದೆನ್! “ನಾನು ಸೈತಾನನು. ನಾನು ಆ ಮಹಾ ದೇವದೂತನಾಗಿದ್ದೇನೆ” ಎಂದು ಹೇಳಿಕೊಂಡು ಅವನು ಪ್ರಾರಂಭಮಾಡಲಿಲ್ಲ. ಅಲ್ಲ ಈ ಆಧಾರದ ಮೇಲೆ ಅಲ್ಲ, ಆದರೆ ದೇವರ ವಾಕ್ಯವನ್ನು ವಿರೂಪಗೊಳಿಸುವ ಮೂಲಕ ಮತ್ತು ಪ್ರತೀ ಕಾಲದಲ್ಲಿಯೂ ಅವನ ರಾಜ್ಯವನ್ನು ಅವನು ಇದೇ ರೀತಿಯಾಗಿಯೇ ಅಸ್ತಿತ್ವಕ್ಕೆ ತಂದಿದ್ದಾನೆ. ಮತ್ತು ಈಗ ಈ ಮಹಾ ವಂಚಿಸುವ ಕಾಲದಲ್ಲಿ ಅವನ ಜನರ ಮೂಲಕವಾಗಿ ತನ್ನ ಸಿಂಹಾಸನವನ್ನು ತೆಗೆದುಕೊಳ್ಳಲು ತಯಾರಾಗಿದ್ದಾನೆ. ಅವನು ತಾನಾಗಿ ಒಂದು ಬುದ್ಧಿವಂತಿಕೆಯ, ಶೈಕ್ಷಣಿಕ, ವೈಜ್ಞಾನಿಕ ಏದೆನನ್ನು ಕಟ್ಟಿಕೊಂಡಿದ್ದಾನೆ. ಸರಿ, ವೈಜ್ಞಾನಿಕ ಬೋಧಕರು, ವೈಜ್ಞಾನಿಕ ಸಭೆ, ವೈಜ್ಞಾನಿಕ ದೈವಜ್ಞಾನ ಶಾಸ್ತ್ರ - ಪ್ರತಿಯೊಂದೂ ವೈಜ್ಞಾನಿಕವಾಗಿದೆ. ಪ್ರತಿಯೊಂದು ತಿಳುವಳಿಕೆಯ ಮೇಲೆ ಆಧಾರಗೊಂಡಂಥದ್ದಾಗಿದೆ. ಇಡೀ ಸಭೆ ಮನುಷ್ಯನ ತಿಳುವಳಿಕೆಯ ಮೇಲೆ ಕಟ್ಟಲ್ಪಟ್ಟಿದೆ. ಅದು ನಂಬಿಕೆಯ ಮೇಲೆ ಕಟ್ಟಲ್ಪಡಲಿಲ್ಲ.\n50ಒಂದು ಸಾರೆ ನಾನು ಒಂದು ಕೂಟವನ್ನು ನಡೆಸಲು ಒಬ್ಬ ಮನುಷ್ಯನ ಸಭೆಗೆ ಹೋದೆನು. ಅದು ಪಶ್ಚಿಮ ದಿಕ್ಕಿನಲ್ಲಿ ಒಂದು ದೊಡ್ಡ ಶೋತೃ ಮಂದಿರವಾಗಿತ್ತು. ಬಹಳ ಒಳ್ಳೆಯ ಮನುಷ್ಯನು ಆದರೆ ಈಗ ನಾವು ಮಾತನಾಡುತ್ತಿರುವ ಈ ಸಂಗತಿಗಳನ್ನು ಅವನು ನಿರಾಕರಿಸಿದನು. ಆದರೂ ನಾನು ಅವನನ್ನು ಪ್ರೀತಿಸಿದೆನು. ಒಳ್ಳೆಯ ಮನುಷ್ಯನು ಒಬ್ಬ ಹರೆಯದ ಮನುಷ್ಯನು. ಆ ಶೋತೃ ಮಂದಿರದಲ್ಲಿ ಸಾಧಾರಣ 6000ಜನರು ಕುಳಿತುಕೊಳ್ಳಬಹುದು. ಅವನು ಆ ಸಭೆ, ಸಂಜೆಯ ಕೂಟದಲ್ಲಿ ಹೊರಗೆ ಹೋದಾಗ (ಸುಮಾರು 1500 ಜನರು), ನಾನು ಅಲ್ಲಿ ಕೂತುಕೊಂಡು ಅವರನ್ನು ಲಕ್ಷವಿಟ್ಟು ನೋಡುತ್ತಿದ್ದೆನು. ಅವರೆಲ್ಲರೂ ಶುಭ್ರವಸ್ತ್ರ ಧರಿಸಿಕೊಂಡ ಬುದ್ದಿವಂತ ಜನರು, ಅವನು ಬಹಳ ಒಳ್ಳೆಯದಾದ ಒಂದು ಪ್ರಸಂಗವನ್ನು ಅಲ್ಲಿ ಬೋಧಿಸಿದನು - ನಿಜವಾಗಿಯೂ ಮತ್ತು ಅವನು ಇಲ್ಲಿ ಯಾರಾದರೂ ಕ್ರಿಸ್ತನನ್ನು ಅಂಗೀಕರಿಸಲು ಸಿದ್ದರಾಗಿದ್ದರೆ ಕೇವಲ ನಿಮ್ಮ ಕೈಗಳನ್ನು ಎತ್ತಿರಿ ಎಂದು ಕೇಳಿದನು; ಯಾರೂ ತಮ್ಮ ಕೈಗಳನ್ನು ಎತ್ತಲಿಲ್ಲ. ಕೊನೆಗೆ ಕೇವಲ ಒಬ್ಬ ಸ್ತ್ರೀ ತನ್ನ ಕೈಯನ್ನು ಎತ್ತಿದಳು.\nಅವನು, “ಎಲ್ಲಾಸರಿ, ಈಗ ನೀನು ಕ್ರೈಸ್ತಳಾಗಿದ್ದೀ” ಎಂದು ಹೇಳಿದನು ಮತ್ತು ಆಕೆಗೆ ದೀಕ್ಷಾಸ್ನಾನವನ್ನು ಕೊಟ್ಟನು. ಮತ್ತು ಅವನು ಹೊರಗೆ ಹೋಗಿ, ಒಂದು ಮಗುವನ್ನು ದೇವರಿಗೆ ನಿವೇದಿಸಿದನು (dedicate) (ಒಂದುಸಣ್ಣ ಮಗುವನ್ನು ಮುದ್ದಿಸಿದನು) ಮತ್ತು ಅದಕ್ಕೋಸ್ಕರ ಪ್ರಾರ್ಥನೆ ಮಾಡಿದನು ಮತ್ತು ಆ ಸಭೆಯನ್ನು ವಿಸರ್ಜಿಸಿದನು.\n51ಎಲ್ಲಾ ರೀತಿಯಲ್ಲಿ ಒಳ್ಳೆಯದಾದ, ವಿದ್ವಾಂಸರಂಥ, ವಿದ್ಯಾಭ್ಯಾಸ ಹೊಂದಿದ ಜನರಾದ ಅವನ ಸಭೆಯ ಜನರು ಹೊರಗೆ ಹೋದಾಗ, ಅಲ್ಲಿ ನಾನು ಬದಿಯಲ್ಲಿ ನಿಂತುಕೊಂಡಿದ್ದೆನು. ಮತ್ತು ಆ ಮನುಷ್ಯನ ಕೈಕುಲುಕಿ ಅವನು ಹೊರ ಹೋಗುತ್ತಿರುವಾಗ ದೇವರ ಶಾಂತಿಯು ನಿನ್ನೊಂದಿಗಿರಲಿ ಎಂದು ಅವನಿಗೆ ವಂದಿಸಲು ಬಯಸುತ್ತಿದ್ದೆನು. ಮತ್ತು ನಾನು ಆ ರೀತಿ ಅಲ್ಲಿರುವಾಗ ಇಲ್ಲಿ ನನ್ನ ಜನರು ಬರುತ್ತಿದ್ದರು. ಅಲ್ಲಿ ಅವನ ಸಭೆಯವರು ಇರುವವರೆಗೆ ಅವರು ಈ (ನನ್ನ) ಜನರನ್ನು ಒಳಗೆ ಬರಲು ಬಿಡಲಿಲ್ಲ. ಇಲ್ಲಿ ನನ್ನವರಾದ ಜನರು (ಮಂದೆಯು) ಅಂದರೆ ಚಕ್ರವಿರುವ ಕುರ್ಚಿಗಳಲ್ಲಿ (wheelchairs), ಕೈಮಂಚಗಳಲ್ಲಿ (stretchers), ಅಧಾರ ವಸ್ತುಗಳ ಮೇಲೆ, ಭ್ರಾಂತಚಿತ್ತರಾದವರು(insane) ಮತ್ತು ಇನ್ನಿತರ ಎಲ್ಲಾ ಸ್ವಸ್ಥವಿಲ್ಲದವರು ಬಂದರು. ನೀವು ಈ ವ್ಯತ್ಯಾಸವನ್ನು ನೋಡಿದಿರೋ? ಅದುವೇ ನಿಜವಾದ ಸಂಗತಿ. ನಾನು ಅದರ ವಿಷಯವಾಗಿಯೇ ಮಾತಾಡುತ್ತಿದ್ದೇನೆ. ನೋಡಿರಿ? ಅದು ಇವೆಲ್ಲವುಗಳಿಗಿಂತ ಭಿನ್ನವಾಗಿದೆ.\n52ಈ ವೈಜ್ಞಾನಿಕ ತಿಳುವಳಿಕೆಯಿಂದ, ಒಂದು ಸಾಮಾನ್ಯವಾಗಿ ತಿಳುಕೊಳ್ಳಬಹುದಾದ ಸುಸಮಾಚಾರವನ್ನು ಮಾಡಬಹುದು. - “ಯೇಸುಕ್ರಿಸ್ತನಲ್ಲಿ ನಂಬಿಕೆಯಿಡುವವನು, ನ್ಯಾಯತೀರ್ವಿಕೆಗೆ ಗುರಿಯಾಗುವದಿಲ್ಲ” ನೋಡಿರಿ. “ಆದರೆ ನಂಬುವವರೊಂದಿಗೆ ಈ ಚಿಹ್ನೆಗಳು ಇರುವವು” ಎಂಬುದನ್ನು ಅಲ್ಲಿ ಹೇಳಲು ಅಥವಾ ಅಲ್ಲಿಡಲು ಅವನು ತಪ್ಪುವವನಾಗಿದ್ದಾನೆ, ನೋಡಿರಿ, (ಆಮೆನ್! ಸಂ.) ಆಕೆಯು ಯೇಸುಕ್ರಿಸ್ತನಲ್ಲಿ ನಂಬಿಕೆಯಿಟ್ಟಳು. ಆದರೆ ಈ ಚಿಹ್ನೆಗಳು ವಿಶ್ವಾಸಿಯಾದ ಆಕೆಯ ಸಂಗಡ ಇರುವದಾದರೆ, ಆಕೆಯು ರಕ್ಷಣೆ ಹೊಂದುವಳು “ಮತ್ತು ನನ್ನ ವಾಕ್ಯಗಳನ್ನು ಕೇಳುವವನು” ಕೇವಲ ಕೇಳುವದಷ್ಟೇ ಅಲ್ಲ ತನ್ನ ಕಿವಿಗಳಿಂದ ಕೇಳುವದಿಲ್ಲ, ಆದರೆ ಅದನ್ನು ತಿಳ್ಳುಕೊಳ್ಳುವದು. (ತನ್ನದಾಗಿ ಮಾಡಿಕೊಳ್ಳುವದು). ಅದನ್ನು ಯಾವನಾದರೂ ಕೇಳಿಸಿಕೊಳ್ಳಬಹುದು.\nಒಬ್ಬಾಕೆ ವೇಶೈಯು ಅದನ್ನು ಕೇಳಿ, ವೇಶ್ಯಯಾಗಿಯೇ ಉಳಿಯಲು ಸಾಧ್ಯವಿದೆ, ನೋಡಿರಿ, ಒಬ್ಬ ಕುಡುಕನು ಅದನ್ನು ಕೇಳಬಹುದು. ಒಬ್ಬ ಸುಳ್ಳುಗಾರನು ಅದನ್ನು ಕೇಳಬಹುದು ಮತ್ತು ಇನ್ನೂ ಸುಳ್ಳುಗಾರನಾಗಿಯೇ ಉಳಿಯಬಹುದು. ಆದರೆ ಆದರೆ ನನ್ನ ವಾಕ್ಯಗಳನ್ನು ತಿಳುಕೊಳ್ಳುವವನು, ಮತ್ತು ನನ್ನನ್ನು ಕಳುಹಿಸಿದಾತನನ್ನು ನಂಬುವವನು, ನಿತ್ಯಜೀವವನ್ನು ಹೊಂದುವನು.“ (ಆಮೆನ್!ಸಂ.) ಅಲ್ಲಿದೆ ನೋಡಿರಿ, ಮತ್ತು ದೇವರು ಮುನ್ನೇಮಿಸದ ಹೊರತು ಯಾವ ಮನುಷ್ಯನೂ ಅದನ್ನು ಮಾಡಲುಸಾಧ್ಯವಿಲ್ಲ.\nಯೇಸು ಹೇಳಿದ್ದು ತಂದೆಯು ಕರೆಯದ ಹೊರತು, ಯಾವ ಮನುಷ್ಯನೂ ನನ್ನ ಬಳಿಗೆ ಬರಲಾರನು, ಮತ್ತು ತಂದೆಯು ನನಗೆ ಕೊಟ್ಟಿರುವದೆಲ್ಲವೂ ನನಗ ಬಳಿಗೆ ಬರುವದು'' ಆಮೆನ್ !ಅದೆಲ್ಲವೂ ದೇವರ ಸಾರ್ವಭೌಮತ್ವದಲ್ಲಿ ಆತನ ಭವಿಷ್ಯಜ್ಞಾನದಲ್ಲಿ (foreknowledge) ಇದೆ. ಆತನು ಒಬ್ಬನೇ ಜೀವಿಸುವವನಾಗಿದ್ದಾನೆ. ಆತನಿಗೆ ಇಂಥಿಂಥದನ್ನು ಮಾಡಬೇಕೆಂದು ಹೇಳಶಕ್ತರು ಯಾರೂ ಇಲ್ಲ.\n53ಈಗ, ದೇವರ ವಾಕ್ಯವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ತೆಗೆದುಕೊಳ್ಳದೆ, ಅಪನಂಬಿಕೆಪಟ್ಟದ್ದರಿಂದ, ಅದರಿಂದಾಗಿ ಅಪನಂಬಿಕೆಯ ಬೀಜವು ಅಸ್ತಿತ್ವಕ್ಕೆ ಬಂದು, ಅಶುದ್ಧವಾದ, ಪಾಪ ಮತ್ತು ದ್ವೇಷದಿಂದ ತುಂಬಿದ ಮತ್ತು ನಿತ್ಯಮರಣ ಇವೆಲ್ಲಾ ಈ ಪಾಪಭರಿತವಾದ, ಕೇವಲ ಮಾನುಷಬುದ್ದಿಯಿಂದ ತುಂಬಿದ ಈ ಸಭೆಯ ಕಾಲದಲ್ಲಿ ನೆಲೆಗೊಂಡಿದೆ. ಈಗ ನಿಮಗೆ ಅರ್ಥವಾಯಿತೋ? ಇಡೀ ಲೋಕವೇ ಧಾರ್ಮಿಕತೆಯೊಂದಿಗೆ ತುಂಬಿದಂಥಾ ಈ ದಿನಗಳಲ್ಲಿ ಇಡೀ ಲೋಕವೇ ಧಾರ್ಮಿಕತೆಯಿಂದ ತುಂಬಿದೆ ಎಂಬುದು ನಿಮಗೆ ತಿಳಿದಿತ್ತೋ? ಮತ್ತು ಪ್ರತಿ ಮೂಲೆ ಮೂಲೆಗಳಲ್ಲಿ ದೊಡ್ಡದೊಡ್ಡ ದೇವಾಲಯಗಳು (churches) ಇರುವಂಥಾ ಈ ಧಾಮಿರ್ಕತೆಯ ಕಾಲದಲ್ಲಿ ಪ್ರತಿಯೊಂದು, ಸೈತಾನನು ಪೂಜಿಸಲ್ಪಡುವದರಲ್ಲಿ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ. ಇಲ್ಲಿಯೇ ಬೈಬಲಿನಲ್ಲಿ ಆ ರೀತಿ ಬರೆಯಲ್ಪಟ್ಟಿದೆ. ಅದು ಸತ್ಯ.\nಮತ್ತು ಈ ಮನುಷ್ಯಜ್ಞಾನದಿಂದ ಕೂಡಿದ ದೈವ ಜ್ಞಾನಶಾಸ್ತ್ರದ ವಿದ್ಯಾನಿಲಯ, ಅದು ಯಾವ ರೀತಿ ಮಾತನಾಡಬೇಕು ಎಂದು ಕಲಿಸಲ್ಪಟ್ಟ ಏನು ಮಾಡಬೇಕು, ಯಾವ ರೀತಿ ಮನೋದ್ವೇಗವನ್ನು ತೋರಿಸಬೇಕು ಎಂಬಂಥಾ ಎಲ್ಲಾ ವಿಷಯಗಳು, ಮನಶಾಸ್ತ್ರ- ಮೂರು ಅಥವಾ ನಾಲ್ಕು ವರ್ಷಗಳ ವಿದ್ಯಾಭ್ಯಾಸ, ಮನುಷ್ಯನ ಮನಸ್ಸಿನೊಂದಿಗೆ ಹೇಗೆ ವ್ಯವಹರಿಸಬೇಕು, ಎಂದೆಲ್ಲಾ ಕಲಿಸಲ್ಪಟ್ಟ ಒಬ್ಬ ಬುದ್ಧಿವಂತ ಮನುಷ್ಯನನ್ನು ತರುತ್ತದೆ. (ಅದು ಸತ್ಯ. ಸಂ.) ನೋಡಿರಿ... ದೇವರಾತ್ಮವೆಂದರೆ ನಿಮಗೆ ಕಲಿಸಲ್ಪಟ್ಟ ಒಂದು ವಿಷಯವಲ್ಲ. ಅದು ಸರ್ವಶಕ್ತನಾದ ದೇವರ ಕೈಯಿಂದ, ನಿನ್ನೊಳಗೆ ಮುನ್ನೇಮಿಸಲ್ಪಟ್ಟ ಒಂದು ವಿಷಯವಾಗಿದೆ. ನಿನ್ನ ಅನುಭವಗಳು ನಿನಗೆ ಕಲಿಸಲ್ಪಡುವ ಸಂಗತಿಗಳಾಗಿರುವದಿಲ್ಲ; ಅದು ದೇವರ ಕೈಯಿಂದ ಮತ್ತು ದೇವರ ಭವಿಷ್ಯ ಜ್ಞಾನದ ಮೂಲಕವಾಗಿ ನಿನ್ನೊಳಗೆ ಮುನ್ನೇಮಿಸಲ್ಪಟ್ಟ ಒಂದು ವಿಷಯವಾಗಿದೆ. ಇದು ಸತ್ಯ.\n54ಈಗ, ಅವರು ಜೀವಿಸುತ್ತಿರುವ ಈ ಮಹಾ ಏದೆನ್ ಅನ್ನು ಅವನು (ಸೈತಾನನು) ಅಸ್ತಿತ್ವಕ್ಕೆ ತಂದನು - ಲೋಕದ ಏದೆನ್ ಅದಂಥಾ ಸಭೆ. (ಸಂಪ್ರದಾಯ ಸಭೆ) ಈಗ ಅವರು ಆ ಮಹಾ ಏಕ್ಯೂಮೆನಿಕಲ್ ಕೌನ್ಸಿಲ್‌ನಲ್ಲಿ ಎಲ್ಲರೂ ಐಕ್ಯವಾಗುತ್ತಾರೆ ಮತ್ತು ಒಂದು (ಮಹಾ) ಲೋಕದ ಸಭೆಯನ್ನು (World church) ಮಾಡುತ್ತಾರೆ. ಮತ್ತು ಸೈತಾನನು ಸಿಂಹಾಸನಾರೂಢನಾಗಿರುವ ಒಂದು ಶಿರೋನಾಮೆಯ ಕೆಳಗೆ ಅವರೆಲ್ಲರೂ ಬರುತ್ತಾರೆ, ಖಡಾಖಂಡಿತವಾಗಿ.\nಮತ್ತು ಮದಲಗಿತ್ತಿಯು ಅದರೊಳಗೆ ಹೋಗುವದಕ್ಕಿಂತ ಮೊದಲಾಗಿ, ಆ ಕಡೇದಾದ ಕೂಗು (ತತೂರಿಯು) ಆಕೆಯನ್ನು ಗ್ರಹಿಸುತ್ತದೆ. (ಹಿಡಿದುಕೊಳ್ಳುತ್ತದೆ) ಯಾಕೆಂದರೆ ಒಂದು ಸಾರಿ ಅದರೊಳಗೆ ಹೋದರೆ, ಆಕೆಯು ಆ ಮೃಗದ ಗುರುತನ್ನು (mark of the beast) ತೆಗೆದುಕೊಂಡವಳಾಗಿ ನಾಶವಾಗುವಳು. ಅದರಿಂದ ಆಕೆಯು ಎಂದೂ\nಹೊರಬರಲಾರಳು. ಈ ಕಾರಣಕ್ಕಾಗಿಯೇ ನಾನು ಈ ರೀತಿ ಹೇಳುತ್ತೇನೆ. “ನನ್ನ ಜನರೇ, ಅವನೊಂದಿಗೆ ಹೋಗುವದಕ್ಕೆ ಮೊದಲು ಅವರ ಮಧ್ಯದಿಂದ ಹೊರಬನ್ನಿರಿ, ನೋಡಿರಿ. ಅವರ ಮಧ್ಯದಿಂದ ಹೊರಬಂದು, ಪ್ರತ್ಯೇಕಗೊಳ್ಳಿರಿ.”\n55ಈಗ ಈ ಏದೆನ್‌ನಲ್ಲಿ ದ್ವೇಷ ಮತ್ತು ಮರಣ ಮತ್ತು ದೇವರಿಂದ ಎಂದೆಂದಿಗೂ ಅಗಲುವಿಕೆ - ಮೋಹ, ಅಶುದ್ಧತೆ, ವಿರೂಪಗೊಳಿಸುವಿಕೆ. ಯಾವ ರೀತಿ? - ತಪ್ಪಾದ ಬೀಜವನ್ನು ಬಿತ್ತುವದರ ಮೂಲಕ.\nನಾನು ಆ ಪಂಚಾಶತ್ತಮಿಗಳನ್ನು (Pentecostals) ಭೇಟಿಯಾಗುವ ಮೊದಲು, ಆ ಬಿಳೀವಸ್ತ್ರ ಹಾಕಿಕೊಂಡು ಇಡೀ ಲೋಕದ ಸುತ್ತು ಹೋಗುವಂಥಾ ಮನುಷ್ಯನನ್ನು ಆ ದರ್ಶನದಲ್ಲಿ ನೋಡಿದ ನೆನಪು ನನಗಾಗುತ್ತದೆ. ನಾನು ಅದನ್ನು ಅನೇಕ ಸಲ ಹೇಳುವದನ್ನು ನೀವು ಕೇಳಿದ್ದೀರಿ. ಅವನ ಹಿಂದೆ ಇನ್ನೊಬ್ಬನು ಜಗಳದ (ವೈಷಮ್ಯದ) ಬೀಜವನ್ನು ಬಿತ್ತಿಕೊಂಡು ಬಂದನು. ಆದರೆ ಅವನು (ಸೈತಾನನು) ಹವ್ವಳಲ್ಲಿ, ಏದೆನ್ ತೋಟದಲ್ಲಿ, ಹವ್ವಳ ಪಾಪಕೋಸ್ಕರ ಇದ್ದಂಥಾ ಮೋಹದ ಮೂಲಕವಾಗಿ, ಹೆಚ್ಚಿನ ಪಾಲಿನಲ್ಲಿ ಗೆದ್ದನು.\nಆಗ, ಹವ್ವಳು ಜ್ಞಾನಕ್ಕೋಸ್ಕರ ಮೋಹಗೊಂಡದ್ದಾಗಿರುವದಾದರೆ, ಅದು ಪಾಪವಾಗಿತ್ತು. ಮತ್ತು ನಾವು ಜ್ಞಾನಕ್ಕೋಸ್ಕರ (ಈಗ) ಮೋಹಗೊಳ್ಳುವದಾದರೆ, (PHD, LLD) ಬೇಕೆಂದು ಹೇಳುವುದಾದರೆ ಹಾಗೆ ಮಾಡುವದು ಪಾಪವಾಗಿದೆ. ಇದು ಬಹಳಗಡುಸಾದ ಒಂದು ಮಾತಾಗಿದೆ. ಆದರೆ ಅದು ನಿಜವಾಗಿರುತ್ತದೆ. ಅದು ಎಷ್ಟೇ ಗಡುಸು ಮತ್ತು ಶಕ್ತಿಯುತವಾಗಿರಲಿ, ಅದು ಇನ್ನೂ ಸತ್ಯವಾಗಿರುತ್ತದೆ, ನೋಡಿರಿ. ಜ್ಞಾನಕ್ಕೋಸ್ಕರ, ತಿಳುವಳಿಕೆಗೋಸ್ಕರ ಮೋಹಪಡುವಂಥಾದ್ದು.., ಇದು ಏನೆಂದರೆ, ಈ ದಿನಗಳಲ್ಲಿ ನಾವು ಜನರ ಹೃದಯದಲ್ಲಿ ದೇವರ ವಾಕ್ಯವನ್ನು ಸ್ಥಾಪಿಸಲು ಪ್ರಯತ್ನ ಪಡುವುದಿಲ್ಲ ಬದಲಾಗಿ ನಾವು ನಮ್ಮನ್ನೇ ಸ್ಥಾಪಿಸಲು ಪ್ರಯತ್ನ ಪಡುವವರಾಗಿದ್ದೇವೆ! ಸಭೆಗಳು ತಮ್ಮ ಸಿದ್ಧಾಂತವನ್ನು ಒಬ್ಬನ ಹೃದಯದಲ್ಲಿ ಸ್ಥಾಪಿಸಲು ಪ್ರಯತ್ನಪಡುತ್ತವೆ. ನಾವು ದೇವರ ವಾಕ್ಯವನ್ನು ಸ್ಥಾಪಿಸಲು ಆಜ್ಞಾಪಿಸಲ್ಪಟ್ಟವರಾಗಿದ್ದೇವೆ. ಪೌಲನು ಹೇಳಿದ್ದೇನೆಂದರೆ “ನಾನು ನಿಮ್ಮ ವಿಶ್ವಾಸವು ಮನುಷ್ಯನ ಜ್ಞಾನದ ಮೇಲೆ ಅವಲಂಬಿಸಿರಬೇಕೆಂದು ಮನುಷ್ಯನ ವಾಕ್ಚಾತುರ್ಯದಿಂದ ಬರಲಿಲ್ಲ, ಆದರೆ ನಾನು ನಿಮ್ಮಲ್ಲಿಗೆ (ದೇವರ) ಶಕ್ತಿಯಿಂದಲೂ, ಪವಿತ್ರಾತ್ಮನ ಪ್ರದರ್ಶನದಿಂದಲೂ, ನಿಮ್ಮ ವಿಶ್ವಾಸವು ದೇವರ ಮೇಲೆಯೇ ಅವಲಂಬಿಸುವಂತೆ ಬರುವವನಾಗಿದ್ದೇನೆ.”\nಅಲ್ಲೇ ಇದೆ ನೋಡಿರಿ.\n56ಮನುಷ್ಯನು ತನ್ನನ್ನು ತಾನು ಸ್ಥಾಪಿಸಲು ಇಚ್ಛಿಸುವವನಾಗಿದ್ದಾನೆ. ದೇವರು ಒಬ್ಬ ಮನುಷ್ಯನ ಜೀವನದಲ್ಲಿ ಒಂದು ಕಾರ್ಯವನ್ನು ಮಾಡಿ, ಅವನನ್ನು ಸೇವೆಗೋಸ್ಕರ ಹೊರಗೆ ಕಳುಹಿಸುವದಾದರೆ, ಪ್ರತೀಮನುಷ್ಯನು ಅದರ ವೇಷ ಧಾರಣೆಯನ್ನು ಮಾಡುವದನ್ನು ನಾವು ನೋಡುತ್ತೇವೆ. ನೋಡಿರಿ, ಅವರು ತಮ್ಮನ್ನು ತಾವೇ ಸ್ಥಾಪಿಸಲು ಪ್ರಯತ್ನಿಸುವವರಾಗಿದ್ದಾರೆ. ಪ್ರತೀಮನಷ್ಯನು - “ನಾನು ಇದನ್ನು ಮಾಡಿದೆನು, ನನ್ನದು, ನಾನು, ನನ್ನ ಸಂಪ್ರದಾಯ ಸಭೆ, ನಾನು ಇದನ್ನು ಮಾಡಿದೆನು.'' ತಮ್ಮನ್ನು ತಾವು ಸ್ಥಾಪಿಸಿಕೊಳ್ಳುವಂಥಾದ್ದು ನಾವು ಯಾವುದನ್ನು ಬೋಧಿಸುತ್ತಿದ್ದೇವೆ? ನಮ್ಮ ಸ್ವಂತವನ್ನೋ ಅಥವಾ ದೇವರ ರಾಜ್ಯವನ್ನೋ? ದೇವರ ವಾಕ್ಯವನ್ನು ಸ್ಥಾಪಿಸಿರಿ, (ಆಮೆನ್) ಒಬ್ಬ ಮನುಷ್ಯನ ಹೃದಯದಿಂದ ಅಪನಂಬಿಕೆಯನು ತೆಗೆದು, ದೇವರ ರಾಜ್ಯವನ್ನು ಅಲ್ಲಿ ಸ್ಥಾಪಿಸಿರಿ. (ಆಮೆನ್) ಮತ್ತು ದೇವರು ಆ ಮನುಷ್ಯನನ್ನು ಆ ರೀತಿ ಮಾಡಿದ ಇದ್ದರೆ, ಆ ಮನುಷ್ಯನಲ್ಲಿ ನೀವು ದೇವರ ರಾಜ್ಯವನ್ನು ಸ್ಥಾಪಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ. ಒಂದು ಮೋಸಕರವಾದ ಮನುಷ್ಯನ ಹೃದಯದಲ್ಲಿ ನೀನು ದೇವರನ್ನು ಸ್ಥಾಪಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ - ಆ ಮನುಷ್ಯನು ತಾನೇ ಸರಿಯೆಂದು ತಿಳಿಯುವವನಾಗಿದ್ದಾನೆ. ”ಮನುಷ್ಯನಿಗೆ ಸರಿಯಾಗಿ ಕಾಣುವ ಒಂದು ಮಾರ್ಗವಿದೆ“. (ಕಟ್ಟಕಡೆಗೆ ಅದು ಮರಣಮಾರ್ಗವೇ) ಪ್ರತೀ ಜ್ಞಾನಿಯೆಂದು ತಿಳುಕೊಳ್ಳುವ ಮನುಷ್ಯನು ತಾನೇ ಸರಿಯೆಂದು ಯೋಚಿಸುತ್ತಾನೆ.\n57ನಾನು ನಿಮಗೆ ಕೆಲವು ಭಾನುವಾರಗಳ ಹಿಂದೆ ಹೇಳಿದಂತೆ; ನಾನು ನನ್ನ ಸಾಯುವಂತ ಸ್ಥಿತಿಯಲ್ಲಿರುವ ಮಗುವಿನ ಬದಿಯಲ್ಲಿ ನಿಂತು ಕೊಂಡಿರುವಾಗ, ಅಲ್ಲಿ ಸೈತಾನನು ಬಂದು ಈ ರೀತಿಯಾಗಿ ಹೇಳಿದನು:-\n“ಅಲ್ಲಿ ನಿನ್ನ ತಂದೆಯು ಮೊನ್ನೆಯ ರಾತ್ರಿ ನಿನ್ನ ತೋಳುಗಳಲ್ಲಿ ತನ್ನ ಪ್ರಾಣವನ್ನು ಬಿಟ್ಟರು. ಅಲ್ಲಿ ಈಗ ನಿನ್ನ ಹೆಂಡತಿಯ ಶವವು ಆ ಶವದ ಮನೆಯಲ್ಲಿ ಇದೆ; ಮತ್ತು ಇಲ್ಲಿ ನಿನ್ನ ಮಗು ಸಾಯುತ್ತಿದೆ, ಮತ್ತು ನೀನು ಆತನನ್ನು (ದೇವರನ್ನು) ಪ್ರಾರ್ಥನೆಯಲ್ಲಿ ಬೇಡಿಕೊಂಡಿ, ಆದರೆ ಆತನು ನಿನ್ನ ಮೇಲೆ ಆ ಕಪ್ಪು ಛಾಯೆಯನ್ನು (ನೆರಳನ್ನು) ಹಾಕಿದನು. ಮತ್ತು ಈಗ, ಇನ್ನೂ ಆತನು ಒಳ್ಳೆಯ ದೇವರಾಗಿದ್ದಾನೆ; ಮತ್ತು ಇನ್ನೂ ಸಹ ನೀನು ಆತನನ್ನು ಗುಣಮಾಡ ಶಕ್ತದೇವರು ಎಂದು ಹೇಳಿದಿ. ಮತ್ತು ನೀನು ಹೇಳಿದ ವಿಷಯಗಳು ಸತ್ಯವೇ ಆಗಿದೆ ಎಂದು ಅದಕ್ಕೋಸ್ಕರ ನೀನು ದೃಢವಾಗಿ ನಿಂತವನಾಗಿದ್ದೀ, ಆದರೆ ನೀನು ಹೇಳಿದ್ದು ತಪ್ಪಾಗಿದೆ” (ಅಂದರೆ ದೇವರು ನಿನ್ನ ಮಗುವನ್ನು ಗುಣಮಾಡುವದಿಲ್ಲ -ಸಂ)\nಓ, ಪ್ರತಿಯೊತಂದು ತರ್ಕವಾದ, ಪ್ರತಿಯೊಂದು ಮನಸ್ಸಿನ ಯೋಚನೆ, ಅವನು (ಸೈತಾನನ) ಹೇಳಿದ್ದು ಸರಿಯೆಂದು ಒಪ್ಪಲೇಬೇಕಾಗಿತ್ತು, ಮತ್ತು ಅಷ್ಟರಲ್ಲಿ ಅವನು ಸರಿಯಾಗಿದ್ದನು.\nಅದೇ ರೀತಿಯಾಗಿ ಅವನು ಹವ್ವಳಿಗೆ “ನಿಮ್ಮ ಕಣ್ಣುಗಳು ತೆರೆಯಲ್ಪಡುವವು, ಮತ್ತು ನೀವು ಒಳ್ಳೇದರ ಕೆಟ್ಟದರ ಅರಿವನ್ನು ಹೊಂದುವಿರಿ, ಮತ್ತು ನೀವು ದೇವರಂತಾಗುವಿರಿ, (ಅಂದರೆ ಒಳ್ಳೇದರ ಕೆಟ್ಟದರ ಅರಿವನ್ನು ಹೊಂದುವದರಲ್ಲಿ)” ಎಂದು ಹೇಳಿದಾಗ ಸರಿಯಾಗಿದ್ದನು, ಯಾಕೆಂದರೆ ದೇವರು ಅವರು ತಾವು ಬೆತ್ತಲೆಯಾಗಿದ್ದೇವೆಂದು, ತಮ್ಮನ್ನು ತಾವು ನೋಡುವಂತೆ, ಅವರಿಗೆ ಅದುವರೆಗೆ ಅರಿವನ್ನು ಕೊಟ್ಟಿರಲಿಲ್ಲ. ಆದುದರಿಂದ ಅವರಿಗೆ ಕೆಟ್ಟದರ ಒಳ್ಳೆದರ ಅರಿವು ಉಂಟಾಗುವದೆಂದು ತಿಳಿದಿತ್ತು (ಹಣ್ಣನ್ನು ತಿಂದಾಗ). ಮತ್ತು ಅವನು (ಸೈತಾನನು) ಸರಿಯಾಗಿ ಹೇಳಿದನು! ಆದರೆ, ನೋಡಿರಿ, ಅದು ದೇವರ ವಾಕ್ಯಕ್ಕೆ ವ್ಯತಿರಿಕ್ತವಾಗಿತ್ತು.\n58ಅದೇ ರೀತಿಯಾಗಿ ದೈವಜ್ಞಾನ ಶಾಲೆಯಲ್ಲಿ ಬೋಧಕರು ಮನುಷ್ಯ ಕಲ್ಪಿತ ದೈವ ಜ್ಞಾನವನ್ನು ಕಲಿಯುತ್ತಾರೆ.ಅದು ಸತ್ಯವಾಗಿ ಕಾಣಬಹುದು. ಅದು ಒಂದು ವಿಷಯದ ಒಳ್ಳೆಯ ವಿಮರ್ಶೆಯಾಗಿರಬಹುದು, ಆದರೆ ಅದು ತಪ್ಪಾಗಿದೆ! ಅದನ್ನು ನಾವು ವಿಮರ್ಶೆಮಾಡಿ ತಿಳಿದುಕೊಳ್ಳಬೇಕಾದ ಅಗತ್ಯವಿಲ್ಲ. ನಾವು ಅದನ್ನು ನಂಬುತ್ತೇವೆ. ಯಾಕೆಂದರೆ ಅದು ಆ ರೀತಿಯಾಗಿದೆ ಎಂದು ದೇವರು ಹೇಳಿದ್ದಾನೆ, ಮತ್ತು ಎಂದೆಂದಿಗೂ ಅದು ಎಲ್ಲಾ ವಿಷಯವನ್ನು ಸಂಪೂರ್ಣಗೊಳಿಸುತ್ತದೆ. ನಾವು ಈ ರೀತಿಯಾಗಿಯೇ ಅದನ್ನು ನಂಬುವವರಾಗಿದ್ದೇವೆ. ಓ, ಪಿ.ಎಚ್.ಡಿ. ಹೊಂದಬೇಕೆಂದು ಹವ್ವಳು ಎಷ್ಟಾಗಿ ಮೋಹಗೊಂಡಳು. ತಾನು ಇದ್ದದಕ್ಕಿಂತ ಇನ್ನೂ ಹೆಚ್ಚಾಗಿ ಬುದ್ಧಿವಂತಳಾಗಿರಬೇಕೆಂದು ಎಷ್ಟಾಗಿ ಆಶೆಪಟ್ಟಳು.\n59ಲಕ್ಷಿಸಿರಿ, ಆ ಗಂಡ ಹೆಂಡತಿಯರು ಎಷ್ಟಾಗಿ ಒಂದೇ ರೀತಿಯಾಗಿದ್ದರು ... ಈಗ, ಲಕ್ಷಕೊಟ್ಟು ಕೇಳಿರಿ, ಆ ಮನುಷ್ಯ ಮತ್ತು ಅವನ ಹೆಂಡತಿ, ಆ ಏದೆನ್ತೋಟದಲ್ಲಿ ದೇವರ ಏದೆನ್‌ನಲ್ಲಿ ಇಬ್ಬರೂ ಬೆತ್ತಲೆಯಾಗಿದ್ದರು. ಈಗ ನಾನು ಮುಗಿಸುತ್ತಿದ್ದೇನೆ, ನಾನು ನಿಮ್ಮನ್ನು ಕೇವಲ ಕೆಲವೇ ನಿಮಿಷಗಳು ಇರಿಸುವೆನು ಎಂದು ಹೇಳಿದ್ದೆನು.ಈಗ ಮುಗಿಸುತ್ತಿರುವಾಗ, ಲಕ್ಷಿಸಿರಿ, ಇದನ್ನು ಹೋಲಿಸಿ ನೋಡಿರಿ, ಆ ಇಬ್ಬರೂ ಗಂಡ ಹೆಂಡತಿಯರು ಎಷ್ಟಾಗಿ ಒಂದೇ ರೀತಿಯಾಗಿ ದೇವರ ಏದೆನ್ ನಲ್ಲಿ ಅವರ ಮೈಯಲ್ಲಿ ಒಂದು ಚೂರು ವಸ್ತ್ರವೂ ಇಲ್ಲದೆ ಇದ್ದರು, ಆದರೆ ಅದನ್ನು ತಿಳಿಯದವರಾಗಿದ್ದರು. ಅದನ್ನು ತಿಳಿಯದವರಾಗಿ ಯಾಕೆ ಇದ್ದರು? ಯಾಕೆಂದರೆ ಅವರು ಪವಿತ್ರಾತ್ಮನ ಪವಿತ್ರವಾದ ಪರದೆಯ ಮೂಲಕ, ತಮ್ಮ ಬೆತ್ತಲೆತನದ ಅರಿವಿಗೆ ಪರದೆ ಮುಚ್ಚಲ್ಪಟ್ಟವರಾಗಿದ್ದರು. ಅವರು ನೇರವಾಗಿ ಒಬ್ಬೊರನ್ನೊಬ್ಬರು ನೋಡಲು ಶಕ್ತರಾಗಿದ್ದರು, ಆದರೆ ತಾವು ಬತ್ತಲೆಯಾಗಿದ್ದೇ ಎಂದು ಅರಿಯದವರಾಗಿದ್ದರು. ಅವರು ಪವಿತ್ರವಾದ ಪವಿತ್ರಾತ್ಮನ ಮೂಲಕವಾಗಿ ಪರದೆ ಹಾಕಲ್ಪಟ್ಟವರಾಗಿದ್ದರು. ಅವರು ಪರದೆ ಮುಚ್ಚಲ್ಪಟ್ಟವರಾಗಿದ್ದರು.\n60ದೇವರು ಪರದೆಯನ್ನು ಹಾಕಿದ್ದನು, ಈಗಲೂ ಸಹ ನೋಡಿ ಮೋಹಪಡದೆ ಇರಲು ಸಾಧ್ಯವಿದೆ. (ಆಮೆನ್) ಅವರು ತಮ್ಮ ತಲೆಯನ್ನು ತಿರುಗಿಸಬಹುದು. ಅದು ಒಂದು ಪವಿತ್ರವಾದ ಪರದೆಯಾಗಿದೆ. - ಪವಿತ್ರವಾದ ಪರದೆ, ಅವರ ಕಣ್ಣುಗಳು ದೇವರ ಅಧೀನದಲ್ಲಿದ್ದವು. ಅವರಿಬ್ಬರೂ... ಒಬ್ಬನು ಪುರುಷನಾಗಿದ್ದನು. ಇನ್ನೊಬ್ಬಳು ಸ್ತ್ರೀಯಾಗಿದ್ದಳು, ಆದರೆ ತಾವು ಬತ್ತಲೆಯಾಗಿದ್ದೇವೆಂಬುದನ್ನು ಅವರು ತಿಳಿದಿರಲಿಲ್ಲ ಯಾಕೆಂದರೆ ದೇವರ ಪರಿಶುದ್ಧತೆಯು ಅವರ ಕಣ್ಣುಗಳನ್ನು ಮುಚ್ಚಿತ್ತು. ದೇವರು ಆ ಪರಿಶುದ್ಧ ಪರದೆಯ ಮೂಲಕ ಪಾಪದ ಅರಿವನ್ನು ಮುಚ್ಚಿಟ್ಟದ್ದನ್ನು ಧ್ಯಾನಿಸಿರಿ. ಕೆಲವು ನಿಮಿಷಗಳುಈ ವಿಷಯದ ಮೇಲೆ ಧ್ಯಾನಿಸಲು ಸಮಯವಿರಬಹುದೆಂದು ಇಷ್ಟಪಡುತ್ತೇನೆ.\nಇಲ್ಲಿನೋಡಿರಿ, “ಯಾಕಂದರೆ, ಒಂದುಸಾರೆ ಪಾಪಗಳನ್ನು ತೊಳಕೊಂಡ ಆ ವಿಶ್ವಾಸಿಯು (Worshipper) ... (ಇಬ್ರಿಯ) ... ಒಂದು ಸಾರೆ ಪಾಪಗಳನ್ನು ತೊಳಕೊಂಡ ವಿಶ್ವಾಸಿಯು, ಆ ಪಾಪದ ಅರಿವನ್ನು ಇನ್ನೆಂದಿಗೂ ಹೊಂದಿರುವದಿಲ್ಲ! ಪಾಪವು ಅವನಿಂದತೊಲಗಿಸಲ್ಪಟ್ಟಿದ!”\n61ಯಾರೋ ಸಹೋದರ ನೇವಿಲ್‌ರವರೊಂದಿಗೆ “ನಾನು ಏಕೆ ಪವಿತ್ರಾತ್ಮನ ವಿಷಯ ಬೋಧಿಸಲಿಲ್ಲ” ಎಂದು ಕೇಳಿದರು, ಎಂದು ನೆವಿಲ್‌ರವರು ಹೇಳುವದನ್ನು ನಾನು ಕೇಳಿಸಿ ಕೊಂಡೆ. ನಾನು ಇದನ್ನು ಏಕೆ ಮಾಡಲಿಲ್ಲ? ಉತ್ತರ ಇಲ್ಲಿದೆ. ಪವಿತ್ರಾತ್ಮನು ನಿಮ್ಮಲ್ಲಿರುವ ಕ್ರಿಯೆಗಳೇ ಆಗಿದ್ದಾನೆ. ಅದು ಒಂದು ಜೀವವಾಗಿದೆ. ಒಂದು ಉದ್ವೇಗವಲ್ಲ; ಒಂದು ಮಾಂಸಕ್ಕೆ ಸಂಬಂಧವಾದ ಒಂದು ಪ್ರತೀತಿ (evidence) ಅಲ್ಲ. ಆದರೆ ಅದು (ಪವಿತ್ರಾತ್ಮನು) ಒಂದು ವ್ಯಕ್ತಿಯಾಗಿದ್ದಾನೆ. ಯೇಸುಕ್ರಿಸ್ತನು, ಈ ಕಾಲಕ್ಕೋಸ್ಕರವಾಗಿರುವ ಪ್ರತಿಯೊಂದು ವಾಕ್ಯವನ್ನು ಪುನರುಜ್ಜಿವನಗೊಳಿಸಲು ನಿನ್ನ ಹೃದಯದಲ್ಲಿ ಸ್ಥಾಪಿಸಲ್ಪಟ್ಟ ದೇವರ ವಾಕ್ಯ. ಸರಿ, ಪವಿತ್ರಾತ್ಮನು ಕಾರ್ಯ ನಿರತನಾಗಿರುವದನ್ನು ಸೂಕ್ಷ್ಮವಾಗಿಪರೀಕ್ಷಿಸಿರಿ, ಹೆಚ್ಚಾಗಿ ಪ್ರದರ್ಶನದಲ್ಲಿ ಅಲ್ಲ ಆದರೆ ಕಾರ್ಯದಲ್ಲಿ - ದೇವರ ವಾಕ್ಯಕ್ಕನುಸಾರವಾಗಿ ಅದು ಏನನ್ನು ಮಾಡುತ್ತದೋ, ಅದನ್ನು.\n62ಈಗ ಲಕ್ಷಿಸಿರಿ, ದೇವರ ಪರಿಶುದ್ಧ ವಾಕ್ಯವೆಂಬ ಪರಿಶುದ್ಧಾತ್ಮವು ಅಲ್ಲಿ ಒಬ್ಬ ಬೆತ್ತಲೆಯಾಗಿರುವ ಪುರುಷ ಮತ್ತು ಸ್ತ್ರೀಯಲ್ಲಿ ಇತ್ತು, ಆದರೆ ಅದನ್ನು (ಬೆತ್ತಲೆತನವನ್ನು) ಅವರು ಅರಿತಿರಲಿಲ್ಲ, ಎಷ್ಟು ಸುಂದರವಾಗಿದೆ. ವಾಕ್ಯದಲ್ಲಿರುವ ಜೀವ ಆ ಬೀಜ, ಆ ವಾಕ್ಯ. ದೇವರು ಹೇಳಿದ್ದು“ ತೋಟದಮಧ್ಯದಲ್ಲಿ ಒಂದು ಮರವಿದೆ (ಆ ಸ್ತ್ರೀ), ಮತ್ತು ಈ ಮರವು ಆ ತೋಟದ ಮಧ್ಯದಲ್ಲಿ ಅದೆ. ಅದನ್ನು ತಿಂದ ದಿನದಲ್ಲೇ ನೀವು ಸಾಯುವಿರಿ.” ಅವರು ಅದರ ವಿಷಯ ಏನನ್ನೂ ತಿಳಿಯದವರಾಗಿದ್ದರು. ಅವರು ಅದರ ವಿಷಯ ಪವಿತ್ರವಾದ ಪರದೆಯನ್ನು ಹೊಂದಿದವಾಗಿದ್ದರು, ಅದನ್ನು ಮುಟ್ಟುವ ಧೈರ್ಯವೂ ಅವರಲ್ಲಿ ಇರಲಿಲ್ಲ.\nಅವರು ಪವಿತ್ರವಾದ ಪರದೆಯಿಂದ ಮುಚ್ಚಲ್ಪಟ್ಟವರಾಗಿದ್ದರು, ದೇವರ ತೋಟದಲ್ಲಿ ಅವರು ಸುರಕ್ಷಿತತೆಯಿಂದ ಇದ್ದರು. ಅವರು ಜೀವಿಸುತ್ತಿದ್ದರು. ಅವರೊಂದಿಗೆ ಯಾವ ಮೃತ್ಯುವೂ ಇರಲಿಲ್ಲ. ಹಲ್ಲೆಲೂಯಾ! ಅವರು ಒಬ್ಬರಿಗೊಬ್ಬರು ಪರಿಪೂರ್ಣ ಪ್ರೇಮವನ್ನು ಹೊಂದಿದವರಾಗಿದ್ದರು, ಎಂದೆಂದಿಗೂ ಪರಿಪೂರ್ಣ ಜೀವನವನ್ನು ಹೊಂದಿದವರಾಗಿದ್ದರು. ಅವರಲ್ಲಿ ಪರಿಪೂರ್ಣ ಪ್ರೀತಿಯಿತ್ತು, ದೇವರ ಪ್ರೀತಿಯ ತಿಳುವಳಿಕೆ ಅವರಲ್ಲಿತ್ತು. ಅವರಲ್ಲಿ ದೇವರ ವಾಕ್ಯವಿತ್ತು. ಅವರು ಅದನ್ನು ಕಾಪಾಡಿದರು. ಅವರು ದೇವರ ಏದೆನ್‌ನಲ್ಲಿ ಸುರಕ್ಷಿತರಾಗಿ, ಜೀವಂತರಾಗಿದ್ದರು, ಅವರೊಂದಿಗೆ ಯಾವ ಮೃತ್ಯುವೂ ಇರಲಿಲ್ಲ.\n63ಆಗ ಸೈತಾನನು ತನ್ನ ದೈವಜ್ಞಾನ ಶಾಸ್ತ್ರವೆಂಬ ಸುಸಮಾಚಾರವನ್ನು ಹವ್ವಳು ಕೇಳುವಂತೆ ಮಾಡುವದರಲ್ಲಿ ವಿಜಯಿಯಾದನು. - ಜ್ಞಾನದ ಸಮಾಚಾರ (ಸುಸಮಾಚಾರ), ಹೆಚ್ಚಿನ ವಿದ್ಯಾಭ್ಯಾಸ, ಹೆಚ್ಚಿನ ನೀತಿಶಾಸ್ತ್ರ ಉತ್ತಮವಾದ ಸಂಸ್ಕೃತಿ, ಹೆಚ್ಚಿನ ವಿದ್ಯೆ, ಮತ್ತು ಇತರ ಎಲ್ಲಾ ಸಂಗತಿಗಳು. ಆಗ, ಅವಳು(ಹವ್ವಳು) ಸ್ವಲ್ಪ ನಿಂತು, ಅವನು ಹೇಳುವದನ್ನು ಲಕ್ಷ್ಯವಿಟ್ಟು ಕೇಳುವಂತೆ ಸೈತಾನನು ಮಾಡಿದಾಗ, (ನಾವು ತಳ್ಳಿಬಿಡಬೇಕೆಂದು ಆಜ್ಞೆಮಾಡಲ್ಪಟ್ಟ ಆ ತರ್ಕ ಶಾಸ್ತ್ರಕ್ಕೆ) ಅವನು, ಅವಳು(ಹವ್ವಳು) ಅದನ್ನು ಲಕ್ಷವಿಟ್ಟು ಕೇಳುವಂತೆ ಮಾಡಿದಾಗ, “ಈಗ ಇಲ್ಲಿ ಕೇಳಿರಿ, ಈ ಸಭೆ, ಈ ರೀತಿ, ಆ ರೀತಿ ಇದೆ. ಹಲವು ವರ್ಷಗಳಿಂದ ಇದು ಸ್ಥಾಪಿಸಲ್ಪಟ್ಟಿದೆ. ನಮ್ಮ ಸಭೆಯು, ಈ ದೇಶದಲ್ಲಿರುವ ಎಲ್ಲಾ ಹಳೆ ಸಭೆಗಳಲ್ಲಿ ಒಂದಾಗಿದೆ. ಈ ನಗರದ ನಗರ ಪಾಲಕನು ಈ ಸಭೆಗೆ ಹೋಗುತ್ತಾನೆ.” ಅದು ಏನೇ ಇರಲಿ, ನಾನು ಅದನ್ನು ಲಕ್ಷಿಸುವದಿಲ್ಲ. ನೋಡಿರಿ, ಅದು ದೇವರ ವಾಕ್ಯಕ್ಕೆ ವಿರೋಧವಾಗಿರುವದಾದರೆ, ಅದರ ವಿರೋಧವಾಗಿ ಇರಿ. ಅದು ನಿಮ್ಮ ವೈರಿಯಾಗಿದೆ. ವಾಕ್ಯಕ್ಕೆ ವಿರೋಧವಾಗಿರುವ ಯಾವುದೇ ಆಗಿರಲಿ ಅದು ನಿಮ್ಮ ವೈರಿಯಾಗಿದೆ. ದೇವರ ವಾಕ್ಯಕ್ಕೆ ಅನುಸಾರವಾಗಿರುವಂಥದು, ನಿಮ್ಮ ಸಹೋದರನಂತಿದೆ. ಅವನು ನಿಮ್ಮ ಒಂದು ಭಾಗವಾಗಿದ್ದಾನೆ.\n64ಧ್ಯಾನಿಸಿರಿ, ಅವಳು (ಹವ್ವಳು) ಆ ಮೋಹ (ಲೈಂಗಿಕ ಮೋಹ) ನಿಜವಾಗಿ ಏನಾಗಿದೆ ಎಂದು ನೋಡಲು ಆ ಪವಿತ್ರ ಪರದೆಯನ್ನು ಬದಿಗೆಳೆದಳು; (ಇದನ್ನು ಹೋಲಿಸಿ ನೋಡಿರಿ) ಈ ಮೋಹವು ನಿಜವಾಗಿ ಏನು ಮಾಡುತ್ತದೆ (ಕೊಡುತ್ತದೆ) ಎಂದು ನೋಡುವದಕ್ಕಾಗಿ ದೇವರು ಅವಳ ಕಣ್ಣಿನ ಮೇಲೆ ಹಾಕಿದ್ದ ಆ ಪವಿತ್ರ ವಸ್ತುವನ್ನು ಅವಳ ಕಣ್ಣಿನಿಂದ ಈ ಪರದೆಯನ್ನು ಬದಿಗೆಳೆದಳು. ಇದೆಲ್ಲಾ ಏನು ಎಂದು ಕಂಡು ಕೊಳ್ಳುವದಕ್ಕಾಗಿ ಅವಳು ಜ್ಞಾನವನ್ನು ಬಯಸಿದಳು. ಆದುದರಿಂದ ಇದೆಲ್ಲಾ ಏನು ಆಗಿದೆ ಎಂಬುದನ್ನು ನೋಡಲು ಆ ಪರದೆಯನ್ನು ಅವಳು ಎಳೆದಳು. ಅವಳು ಪಿಶಾಚಿನ ಮಾತಿಗೆ ಕಿವಿಗೊಟ್ಟಳು, ಮತ್ತು ಅದು ಅವಳನ್ನು ಯಾವ ಸ್ಥಾನಕ್ಕೆ ತಂದಿತೆಂದು ನೋಡಿರಿ.\nಇದರ ನಂತರ, ಅವರು ಪ್ರತಿಯೊಂದು ಕಾಲದಲ್ಲಿ ಇದನ್ನೇ ಮಾಡಿದರು. ಯಾವಾಗಲೂ ಜ್ಞಾನದ ಮಾರ್ಗವನ್ನೇ ಅವಲಂಭಿಸಿದರು. ಮತ್ತು ಈಗ ಸೈತಾನನ ರಾಜ್ಯವನ್ನು ಕಟ್ಟಿದ್ದಾರೆ, ಜ್ಞಾನ (ಅವನು ಬಿತ್ತಿದ ಆ ಬೀಜ)ವು ಈ ಲೋಕವನ್ನು ಒಂದು ಮೃತ್ಯುವಿನ ಏದೆನ್ ಆಗಿ ಮಾಡಲು ಅದನ್ನು ತೆಗೆದುಕೊಂಡಿದೆ.\n65ಈಗ ಧ್ಯಾನಿಸಿರಿ, ಈಗ ಪ್ರಕಟಣೆ 3ನೇ ಅಧ್ಯಾಯವನ್ನು ನೋಡಿರಿ, ಆ ಲವೋದಿಕಿಯ ಸಭಾಕಾಲ. ನಿಮ್ಮ ಮನಸ್ಸಿನಲ್ಲಿ ನೀವು ಆಲೋಚಿಸಿರಿ. ಈಗ ಲಕ್ಷಿಸಿರಿ, ಅವಳು ಹವ್ವಳು, ಸೈತಾನನ ರಾಣಿಯಾಗಿದ್ದಾಳೆ. ನೋಡಿರಿ; (ಸರ್ಪವೆಂಬ) ಸೈತಾನನು ಆದಾಮನು ಅವಳನ್ನು ಮುಟ್ಟುವ ಮೊದಲು, ಅವಳ ಕಡೆಗೆಹೋದನು. ಅದು ಸರಿ. ಹೀಗಾಗಿ ಅವನು ಅವಳನ್ನು ಭ್ರಷ್ಟಗೊಳಿಸಿದನು. ಆದುದರಿಂದ ಆದಾಮನು ಅವಳನ್ನು ಕೂಡುವ ಮೊದಲೇ ಸರ್ಪವೆಂಬ ಸೈತಾನನು ಹವ್ವಳ ಗಂಡನಾಗಿದ್ದನು. ಅವರು ಅವಳನ್ನು ಭ್ರಷ್ಟಗೊಳಿಸಿದನು. ದೇವರ ವಾಕ್ಯವು ಅವನು ಆ ರೀತಿ ಮಾಡಿದನೆಂದು ಹೇಳುತ್ತದೆ. ಮತ್ತು ಅವಳು ತಾನು ಬೆತ್ತಲೆಯಾಗಿದ್ದೇನೆಂದು ತಿಳುಕೊಂಡಳು, ಆಗ, ನೋಡಿರಿ?\n66ಈಗ ಲವೋದಿಕಿಯ ಸಭೆಯ ಕಡೆಗೆ ನೋಡಿರಿ. ಅವಳು ಹವ್ವಳು ಸೈತಾನನ ರಾಣಿಯಾಗಿ ಕುಳಿತಿದ್ದಾಳೆ. ಅವಳು ಲೋಕದ ಸಂಪತ್ತಿನಲ್ಲಿ ಐಶ್ವರ್ಯವಂತಳಾಗಿದ್ದಾಳೆ! ಕುರುಡಳು ಪುನಹ ಬೆತ್ತಲೆಯಾದವಳು, ಮತ್ತು ಅದನ್ನು ತಿಳಿಯದವಳಾಗಿದ್ದಾಳೆ! ದೇವರ ಏದೆನ್‌ನಲ್ಲಿ ಇದ್ದಂತೆಯೇ ಇದೆ. ಆದರೆ ಈಗ, ಅವಳ ಮೇಲೆ ಪರಿಶುದ್ಧ ಪರದೆ ಇರುವದರಿಂದಲ್ಲ, ಆದರೆ ಆ ಮೋಹದ ಪರದೆ, ಅವಳು ದೇವರ ಪರಿಶುದ್ಧ ಪರದೆಯನ್ನು ತೆಗೆದು ಬಿಟ್ಟು ಒಂದು ತಿಳುವಳಿಕೆಯ ಪರದೆಯನ್ನು ಆ ಮೋಹಕ್ಕೋಸ್ಕರ ಹಾಕಿಕೊಂಡಳು. ಮತ್ತು ಈಗ ಅವಳ ಮುಂದೆ ಆ ಮೋಹದ ಪರದೆ ಇರುವದರಿಂದ, ಅವಳು ಪಾಪದ ಮೂಲಕ ಕುರುಡಿಯಾಗಿದ್ದಾಳೆ. ಅವಳು ಬೀದಿಯಲ್ಲಿ ಬತ್ತಲೆಯಾಗಿದ್ದಾಳೆ, ಮತ್ತು ಅದನ್ನು ತಿಳಿಯದವಳಾಗಿದ್ದಾಳೆ. ಅವಳು ಬೀದಿಯಲ್ಲಿರುವ ಒಬ್ಬ ವೇಶ್ಯಯಾಗಿದ್ದಾಳೆ. ಈ ಚಡ್ಡಿ ಹಾಕಿಕೊಂಡಿರುವ (ರಸ್ತೆಯಲ್ಲಿ) ಹೆಂಗಸರು ದೇವರ ದೃಷ್ಟಿಯಲ್ಲಿ ವೇಶೈಯಂತಿದ್ದಾರೆ, ಮತ್ತು ಅದನ್ನು ತಿಳಿಯದವರಾಗಿದ್ದಾರೆ.\n67ನೋಡಿರಿ, ನಮ್ಮ ಈ ಸ್ತ್ರೀಯರನ್ನು ನೋಡಿರಿ. ಈಗ ನಿಮಗೆ ಸಭೆಯು ಯಾವ ಸ್ಥಿತಿಯಲ್ಲಿ ಇದೆಯೆಂದು ನೋಡಬೇಕಾದರೆ, ಅದರಲ್ಲಿರುವ ಸ್ತ್ರೀಯರು ವರ್ತಿಸುವ ರೀತಿಯನ್ನು ನೋಡಿರಿ. ಸ್ತ್ರೀಯು ಯಾವಾಗಲೂ ಒಂದು ಸಭೆಯನ್ನು ಸೂಚಿಸುವವಳಾಗಿದ್ದಾಳೆ. ಪಾಪ ಮತ್ತು ಅಪನಂಬಿಕೆಯ ಸೈತಾನನ ಏದೆನ್‌ನಲ್ಲಿ- ಒಂದು ಧಾರ್ಮಿಕ ವ್ಯಂಗ್ಯತೆ (Pervertion); ವ್ಯಂಗ್ಯಗೊಳಿಸಲ್ಪಟ್ಟಂತಾ ರಾಜ್ಯ, ದೇವರ ವಾಕ್ಯವನ್ನು ತೆಗೆದುಕೊಳ್ಳುವದಕ್ಕೆ ಬದಲಾಗಿ, ಅವರು ಮನುಷ್ಯನ ಬುದ್ದಿಗೆ ಸಂಬಂಧವಾದ ವಿದ್ಯೆಯನ್ನು ತೆಗೆದುಕೊಂಡರು. ನಿಜವಾದ ಸಭೆಯನ್ನು ತೆಗೆದುಕೊಳ್ಳುವದಕ್ಕೆ ಬದಲಾಗಿ ಒಂದು ಸಂಘ ಸಂಸ್ಥೆಯನ್ನು ತೆಗೆದುಕೊಂಡರು, ಮತ್ತು ಅದನ್ನು ಒಂದು ಮಹಾ ನಾಯಕನ ಕಡೆಗೆ (ಅಂತಿಕ್ರಿಸ್ತನು) ತರುವವರಾಗಿದ್ದಾರೆ.\n68ಈಗ ಲಕ್ಷಿಸಿರಿ, ಮುಗ್ಧತನ (ನಿಷ್ಕಪಟತನ) ದಿಂದ ವ್ಯಂಗ್ಯ ಗೊಳಿಸಲ್ಪಟ್ಟದ್ದು.... ಇದನ್ನು ತಿಳಿದುಕೊಳ್ಳಲು ಈಗ ತಪ್ಪದಿರಿ. ಸಭೆಯು (ಸಂಪ್ರದಾಯ ಸಭೆ) ಈ ಮೋಹದ ಪರದೆಯನ್ನು ಇಷ್ಟರವರೆಗೂ ಹೊಂದಿಕೊಂಡಿತ್ತು. ಅದು ಅವಳಿಗೆ (ಸಭೆಗೆ) ಏನು ಮಾಡಿದೆಯೆಂದು ನೋಡಿರಿ. ಅದು ಅವಳನ್ನು (ನಿಷ್ಕಪಟತನ) ಮುಗ್ಧತೆಯಿಂದ ಜ್ಞಾನದ ಕಡೆಗೆ ವ್ಯಂಗ್ಯಗೊಳಿಸಿತು. ಆ ಪವಿತ್ರವಾದ ಪರದೆ, ಆಕೆ ನಿಷ್ಕಪಟಯಾಗಿದ್ದಳು, ಮೋಹದ ಪರದೆಯೊಂದಿಗೆ, ಅವಳಿಗೆ ಜ್ಞಾನ ಸಿಕ್ಕಿತು. ಅದು ತೃಪ್ತಿಪಡಿಸುವಂಥಾದೆಂದು ಅವಳಿಗೆ ತಿಳಿದಿದೆ. ಅದು ಏನು ಮಾಡುತ್ತದೆಂದು ಅವಳಿಗೆ ತಿಳಿದಿದೆ, ನೋಡಿರಿ. ಅದು ಒಂದು ಫಲವಾಗಿದೆ, ಅಪೇಕ್ಷಿಸತಕ್ಕ ಒಂದು ಮರವಾಗಿದೆ, ಅದು ಅವರನ್ನು ಜ್ಞಾನಿಯಾಗಿ ಮಾಡುವಂಥದ್ದಾಗಿದೆ. ಅವಳು ನಿಷ್ಕಪಟತನದಿಂದ ಜ್ಞಾನದ ಕಡೆಗೆ ಮೋಸಗೊಳಿಸಲ್ಪಟ್ಟವಳಾಗಿದ್ದಾಳೆ, ಪರಿಶುದ್ಧತೆಯಿಂದ ಅಶುದ್ಧತನ, ಮೋಹದ ಕಡೆಗೆ, ಮತ್ತು ಜೀವದಿಂದ ಮೃತ್ಯುವಿನ ಕಡೆಗೆ.\nಆ ರಾಜ್ಯವು ಸಾಯಲೇ ಬೇಕು! ಈ ರಾಜ್ಯವು ಸಾಯೇ ಸಾಯುವುದು! ಪರಲೋಕದ ದೇವರು ಅದನ್ನು ಈ ಭೂಮಿಯ ಮೇಲಿನಿಂದ ಅಳಿಸಿಬಿಡುವನು! (ನಾಶಗೊಳಿಸುವನು).\n69ಈಗ ನೋಡಿರಿ, ಈ ವ್ಯಂಗೀಕರಣ (Perversion)ದಲ್ಲಿ ಅದು ಒಂದು ಪುರುಷನಿಂದ ಸ್ತ್ರೀಗೆ ಮತ್ತು ಸ್ತ್ರೀಯಿಂದ ಪುರುಷನಿಗೆ ತರಲ್ಪಟ್ಟಿತು. ಆದರೆ ಅವರು ಅದನ್ನು ತಿಳಿದಿಲ್ಲ! ನೀವು ಈ ದಿನದಲ್ಲಿ ಬೀದಿಗಳಲ್ಲಿ ನಮ್ಮ ಆಧುನಿಕ ಜನರ ಕಡೆಗೆ ಸ್ವಲ್ಪನೋಡುವದಾದರೆ,ಅವರ ನಡತೆ ಸೈತಾನನ ಏದೆನಿನ ಒಂದು ಒಳ್ಳೆಯ ಫಲಾವಾಗಿ ಕಂಡು ಬರುವುದು.\n70ಲಕ್ಷಕೊಡಿರಿ, (ಅ ದಿನದಲ್ಲಿ) ಹವ್ವಳಲ್ಲಿರುವ ಮೋಹದ ಜಾಲದ ಮುಖಾಂತರವಾಗಿ ಆದಾಮನು ಪಾಪಮಾಡುವಂತೆ ಸೈತಾನನು ಹವ್ವಳನ್ನು ಉಪಯೋಗಿಸಿದನು. ಈಗಲೂ ಅದೇ ಆಗಿದೆ. ಅದೇ ಸಂಗತಿಗಳನ್ನು ಈಗ ಮಾಡುತ್ತಿದ್ದಾನೆ. ಕೂದಲು ಕತ್ತರಿಸಿಕೊಂಡ, ಬಣ್ಣ ಹಚ್ಚಿಕೊಂಡ ಮುಖವುಳ್ಳ, ಲೈಂಗಿಕವಾಗಿ ಉದ್ರೇಕಗೊಳಿಸುವ ಉಡುಪನ್ನು ತೊಟ್ಟುಕೊಂಡ ಹೆಂಗಸರು. ಅವಳು (ಸ್ತ್ರೀ) ಅದನ್ನು ಮಾಡುವವಳಾಗಿದ್ದಾಳೆ. ಆದರೆ ಅವು ಪ್ರತಿಯೊಂದೂ ದೇವರ ವಾಕ್ಯಕ್ಕೆ ವಿರೋಧವಾಗಿದೆ ಎಂಬುದನ್ನು ಅರಿಯದವಳಾಗಿದ್ದಾಳೆ. ಅವಳ ಕೂದಲು ಕತ್ತರಿಸುವದೆಂದರೆ, ಅದು ಅವಳನ್ನು ಒಬ್ಬ ಮಾನಹೀನ ಹೆಂಗಸನ್ನಾಗಿ ಮಾಡುವದು ಒಬ್ಬ ವೇಶೈಯಂತೆ. ಚಡ್ಡಿಗಳನ್ನು ಹಾಕುವದು, ಅವಳನ್ನು ಕೇವಲ ಒಂದು ನೀಚ ಸ್ತ್ರೀಯನ್ನಾಗಿ ಮಾಡುವದು. ಅನಿಷ್ಟವಾದ ಉಡುಪನ್ನು ತೊಡುವಂತದು, ಅವಳನ್ನು ಒಂದು ವೇಶೈಯನ್ನಾಗಿ ಮಾಡುವದು, ಆದರೆ ಅವಳು ತಿಳಿಯದೆ ಇದ್ದಾಳೆ! ದೇವರ ಪರಿಶುದ್ಧತೆಯ ಕಾರಣದಿಂದಲ್ಲ, ಆದರೆ ಸೈತಾನನ ಮೋಹದ ಕಾರಣದಿಂದ\nಅವಳು ಅವನ ಗಂಡನಾದ ಆದಾಮನು ಅವಳ ಮೇಲೆ ಮೋಹಗೊಳ್ಳುವಂತೆ ಮಾಡಿದಳು.\n71ಆಕೆಯು, ದೇವರು ಅವಳಿಗೆ, ಏದೆನ್‌ನಲ್ಲಿ ಈ ಮರುಭೂಮಿಯ ಪ್ರವಾಸಕ್ಕೋಸ್ಕರ ತೊಡಿಸಿದ ಆ ವಸ್ತ್ರವನ್ನು ತೆಗೆದು ಬಿಟ್ಟಳು.ಅವಳು ಅವನ್ನು ತೆಗೆದು ಬಿಟ್ಟಳು. ದೇವರು ಅವಳಿಗೆ ತನ್ನನ್ನು ಮುಚ್ಚಿಕೊಳ್ಳಲು ಕೊಟ್ಟಂಥಾ ಚರ್ಮದ ಉಡುಗೆಯನ್ನು ಅವಳು ತೆಗೆದು ತನ್ನನ್ನು ವಿವಸ್ತ್ರಳಾಗಿ ಮಾಡಿಕೊಂಡಳು; ಅವಳು ತನ್ನನ್ನು ಪ್ರತೀಸಾರೆ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪವಾಗಿ ಕ್ಷೌರ ಮಾಡಿಕೊಂಡಳು. ಈಗ ಅವಳು ತಾನು ಆದಿಯಲ್ಲಿ ಇದ್ದಂತೆ ಪುನ: (ಬೆತ್ತಲೆ) ಆಗಿದ್ದಾಳೆ. ಈಗ ಅವಳು, ಅವಳ ಆದಾಮನು ತನ್ನ ಕೆಳ ಭಾಗದ ವಸ್ತ್ರವನ್ನು ತೊಡುವಷ್ಟರವರೆಗೆ ಯಶಸ್ವಿಯಾಗಿದ್ದಾಳೆ.\nಒಬ್ಬ ಪುರುಷನು, ಒಂದು ಸ್ತ್ರೀಯಂತೆ ವರ್ತಿಸಿ, ಚಡ್ಡಿಗಳನ್ನು ತೊಟ್ಟುಕೊಂಡು, ಬೀದಿಯಲ್ಲಿ ತಿರುಗುವಂಥದು. ಅವನಲ್ಲಿ ಹೆಚ್ಚು ಪುರುಷತ್ವ ಇದೆ ಎಂದು ನಾನು ನೆನಸುವದಿಲ್ಲ. ಅವನು ನಾನು ತಿಳಿದಂತೆ ಒಂದು ದೊಡ್ಡ ಸ್ತ್ರೀಲೋಲ (Sissy)ನಾಗಿದ್ದಾನೆ. ನೋಡಿರಿ, ಅವಳ ವ್ಯಂಗ್ಯಗೊಳಿಸಲ್ಪಟ್ಟ ಆದಾಮನು ಅವಳಂತೆ ವರ್ತಿಸುವಂತೆ ಮಾಡುವದರಲ್ಲಿ ಅವಳು ಸಫಲಳಾದಳು. ನೋಡಿರಿ? ಅವಳ ಕೆಳಭಾಗದ ವಸ್ತ್ರಗಳನ್ನು (ಪುರುಷನು) ಉಡುವಂಥದು. ಅವಳು ಅಲ್ಲಿ (ಏದೆನ್‌ನಲ್ಲಿ) ತನ್ನ ವಸ್ತ್ರಗಳನ್ನು ತೆಗೆದಾಗ ಮುಂದೆ ತಾನು ಏನು ಮಾಡುವೆನೆಂದು ಅವಳು ನೋಡಿದಳು. ಆದರೆ ಅವಳ ಕೆಳಭಾಗದವಸ್ತ್ರ - ಅಂದರೆ ಆ ಚಡ್ಡಿಗಳು, ಅದು ಸ್ತ್ರೀಯ ಕೆಳಭಾಗದ ಉಡುಪಾಗಿದೆ.\nಮತ್ತು ಈಗ ಅವಳ ಆದಾಮನು ಅವುಗಳನ್ನು ಉಡುತ್ತಿದ್ದಾನೆ. ದೇವರ ಮೂಲವಾಕ್ಯದ ಅನುಸಾರವಾಗಿ ಒಬ್ಬ ಸ್ತ್ರೀಯು ಪುರುಷನ ವಸ್ತ್ರಗಳನ್ನು ತೊಡುವಂಥಹದು ಅದು ಅಸಹ್ಯವಾಗಿದೆ, ಮತ್ತು ಪುರುಷನು ಸ್ತ್ರೀಗೆ ಸಂಬಂಧವಾದ ವಸ್ತ್ರಗಳನ್ನು ಧರಿಸುವಂಥಾದ್ದು ದೇವರ ಮೂಲ ವಾಕ್ಯಕನುಸಾರವಾಗಿ ಅಸಹ್ಯವಾಗಿದೆ. ಈ ವಿಷಯ ಯೋಚಿಸಿರಿ.\n72ಈ ಪುರುಷನು ಅವಳ ಉದ್ದವಾದ ಕೂದಲನ್ನು ಸಹ ಇಡುತ್ತಾನೆ. ಅವನು ಕೂದಲನ್ನು ಉದ್ದವಾಗಿ ಬಾಚಿ ಅದನ್ನು ಗುಂಗುರಾಗಿ ಕಾಣುವಂತೆ ಮಾಡುತ್ತಾನೆ. ನನ್ನ ಜೀವನದಲ್ಲಿ ಅತೀ ಅಸಹ್ಯವಾಗಿ ಕಾಣುವಂಥಾ, ನಾನೆಂದೂ ನೋಡಿದ ದೃಶ್ಯವೆಂದರೆ, ಇಲ್ಲಿನ ಕೆಲವು ಹುಡುಗರು ತಮ್ಮ ಕೂದಲನ್ನು ಗುಂಗುರಾಗಿ ಕೆಳಗೆ ಬಿಟ್ಟು ಮತ್ತು ಏನೋ ಒಂದು ಪೆರಾಕ್ಸೆಡ್‌ ಮೂಲಕ ಅದರ ಬಣ್ಣವನ್ನು ಬದಲಾಯಿಸಿ, ಅದನ್ನು ಗುಂಗುರಾಗಿ ಸುತ್ತಿಕೊಂಡು ಉದ್ದವಾಗಿ ಬಿಟ್ಟು ಬಿಡುವಂಥಹದು. ಮಹಾ ಲೋಲನಾಗಿರುವ ನೀನು! ಅದನ್ನು ಈ ಪೀಠದ ಮೇಲಿನಿಂದ ಹೇಳುವದೆಂದರೆ ಒಂದು ಭಯಂಕರವಾದ ವಿಷಯವಾಗಿದೆ. ಆದರೆ ನ್ಯಾಯತೀರ್ಪು ದೇವರ ಆಲಯದಿಂದ ಪ್ರಾರಂಭವಾಗುತ್ತದೆ. ಅವರು ಪುರುಷರೋ ಸ್ತ್ರೀಯರೋ ಎಂದು ನೀವು ತಿಳಿಯಲು ಅಸಾಧ್ಯ. ನನಗೆ ತಿಳಿದ ಪ್ರಕಾರ,ನಮ್ಮ ಯುನೈಟೆಡ್ ಸ್ಟೇಟ್‌ನ ಸೈನ್ಯವು ಮುಂದಕ್ಕೆ ಚಡ್ಡಿಯನ್ನು ಹಾಕಿಕೊಂಡು ಬರುವವರಾಗಿದ್ದಾರೆ. ಅದು ಸತ್ಯ, ವ್ಯಂಗ್ಯತ್ವವೆಂದರೆ ಏನೆಂದು ನೋಡಿದಿರೋ? ಅದು ಸ್ತ್ರೀಯ ಉಡುಪಾಗಿದೆ ಸ್ತ್ರೀಯ ಕೂದಲನ್ನು ಧರಿಸುವಂಥಾದ್ದು.\n73ಮೊನ್ನೆಯ ದಿನ ನಾನು “ಹೋವರ್ಡ್ ಜಾನ್‌ಸನ್ಸ್ಎಂ”ಬ ಶಾಪ್‌ನಲ್ಲಿ ಇದ್ದೆನು, (ಇಲ್ಲಿಯ ಈ ಶಾಪ್ ಅಲ್ಲ, ಅಲ್ಲಿ ಹೊರ ಹೋಗುವ ರಸ್ತೆಯಲ್ಲಿರುವ ಆ ಶಾಪ್ ) ಮತ್ತು ಅಲ್ಲಿ ಅಚ್ಚರಿಗೊಂಡು ಕೂತು ಬಿಟ್ಟೆನು. ಅಲ್ಲೊಬ್ಬ ಸಣ್ಣ ಹುಡುಗನು ತನ್ನ ಬಾಯಿಯನ್ನು ತೆರೆದಿಟ್ಟು ಬರುತ್ತಿದ್ದನು. ಮತ್ತು ಅವನು ಕಪ್ಪು ಕೂದಲುಳ್ಳವನಾಗಿ, ಅದನ್ನು ಈ ರೀತಿಯಾಗಿ ಬಾಚಿದ್ದನು ಮತ್ತು ಅಲ್ಲಿ ಒಂದು ಅದರ ಮೇಲೆ ಉರುಳು ಪಟ್ಟಿಯನ್ನು ಇಟ್ಟಿದ್ದನು ಮತ್ತು ಅವನ ಕಣ್ಣುಗಳ ಮೇಲೆ ಅದನ್ನು ಗುಂಗುರಾಗಿಮಾಡಿ ಇಟ್ಟಿದ್ದನು; ಅವನ ಕಣ್ಣುಗಳ ಮೇಲಿನಿಂದ ನೋಡುತ್ತಿದ್ದನು, ಮತ್ತು ಮುಂದೆ ಹೋಗುತ್ತಿದ್ದನು -ನಾನೆಂದೂ ವ್ಯಂಗ್ಯತ್ವವನ್ನು ನೋಡಿದ್ದರೆ... (ನಾನೆಂದೂ ನೋಡದ ವ್ಯಂಗ್ಯತ್ವ)\nನೋಡಿರಿ, ಅವನು ಅದನ್ನು ನಂಬಲಾರನು. ಅವನು ಪುರುಷನೆಂದು ಸಾಧಿಸಲು ಒಂದು ವೇಳೆ ಸಾಧ್ಯವಿರಬಹುದು, ಆದರೆ ಅವನ ಆತ್ಮದಲ್ಲಿ ಅವನು ಸ್ತ್ರೀಯಾಗಿದ್ದಾನೆ. ಅವನು ಯಾವ ಆತ್ಮೀಯ ಮನೆಗೆ ಸಂಬಂಧಪಟ್ಟವನೆಂದು ಅವನಿಗೆ ತಿಳಿಯದು. ಅದು ಸತ್ಯ. ಎಷ್ಟು ವ್ಯಂಗ್ಯಗೊಳಿಸಲ್ಪಟ್ಟಂಥದ್ದು! ಅದುವೇ ಸೈತಾನನು ಮಾಡುವಂಥದ್ದು! ಅವನು ಜನಾಂಗಗಳನ್ನು ಮೋಸಗೊಳಿಸುತ್ತಾನೆ. ಅವನು ಸಭೆಯನ್ನು ವ್ಯಂಗ್ಯತ್ವಕ್ಕೆ ಒಳಪಡಿಸುತ್ತಾನೆ! ಅವನು ಜನರನ್ನು ವ್ಯಂಗ್ಯತ್ವಕ್ಕೆ ಒಳಪಡಿಸುತ್ತಾನೆ! ಅವನು ಮೋಸಗಾರನು -ಮೂಲ ಸತ್ಯವನ್ನು ವ್ಯಂಗ್ಯವಾಗಿ ಮಾಡುವಾತನು. ದೇವರು ಒಬ್ಬ ಪುರುಷನನ್ನು ಪುರುಷನನ್ನಾಗಿಯೇ ಮಾಡಿದನು. ಆತನು ಒಬ್ಬ ಸ್ತ್ರೀಯನ್ನು ಸ್ತ್ರೀಯಾಗಿಯೇ ಮಾಡಿದನು. ಮತ್ತು ಅವರನ್ನು ಭಿನ್ನವಾಗಿ ತೊಡಿಸಿದನು. ಮತ್ತು ಅವರು ಆ ರೀತಿಯಾಗಿಯೇ ಇದ್ದು ಆದೇ ರೀತಿ ವರ್ತಿಸಬೇಕೆಂದು ಬಯಸಿದನು. ಒಬ್ಬಾಕೆ ಸ್ತ್ರೀತ್ವವನ್ನು ಹೊಂದಿರುವವಳು, ಇನ್ನೊಬ್ಬನು ಪುರುಷತ್ವವನ್ನು ಹೊಂದಿರುವವನು. ಆತನು ಆದಾಮನನ್ನು ಏದೆನ್ ತೋಟದಲ್ಲಿ ಪ್ರತ್ಯೇಕಿಸಿ ಇಟ್ಟಿದ್ದನು, ಮತ್ತು ಹವ್ವಳನ್ನು ಆದಾಮನಿಂದ ಪ್ರತ್ಯೇಕಿಸಿ ಇಟ್ಟನು.\n74ಈಗ (ಪುರುಷನು) ಅವಳ (ಸ್ತ್ರೀಯ) ಕೂದಲನ್ನು ಧರಿಸುತ್ತಾನೆ; ಆಕೆಯು ಅವನಂತೆ ತನ್ನ ಕೂದಲನ್ನು ಕತ್ತರಿಸುತ್ತಾಳೆ, ಅವನು ಅವಳಂತೆ ತನ್ನ ತೊಡುಗೆಯನ್ನು ಉಡಲು ಪ್ರಯತ್ನಿಸುತ್ತಾನೆ. ಅವಳು ಅವನ ಹೊರಗಿನ ತೊಡುಗೆಯನ್ನು ಉಡುತ್ತಾಳೆ. ಮತ್ತು ಅವನು ಅವಳ ಒಳಗಿನ ಉಡುಗೆಯನ್ನು ಉಡುತ್ತಾನೆ. ಈಗ ಇದು ಧರ್ಮಭ್ರಷ್ಟತೆಯಂತೆ ಭಾಸವಾಗುತ್ತದೆ. ಆದರೆ ನಾನು ಆ ರೀತಿಯಾಗಿ ಹೇಳುವುದಿಲ್ಲ. ಇದು ಖಡಾಖಂಡಿತವಾಗಿ ಸುವಾರ್ತೆಯ ಸತ್ಯವಾಗಿದೆ. ಇದು ನಿನಗೆ ತಿಳಿಯದಿದ್ದರೆ, ನಿನ್ನಲ್ಲಿ ಏನೋ ಕೊರತೆಯಿದೆ. ಒಂದೇ ನೀನು ಕುರುಡನಾಗಿದ್ದೀ ಅಥವಾ ನೀನೆಂದೂ ಬೀದಿಯಲ್ಲಿ ಹೋಗಲಿಲ್ಲ. ಮತ್ತು ಅವನು ಮತ್ತು ಅವಳೂ ಸಹ ಅದು ಎಲ್ಲವೂ ಸರಿಯಾಗಿದೆ ಎಂದು ತಿಳುಕೊಳುತ್ತಾರೆ.ಅವರು ಎಲ್ಲಿಗೋ (ನಾಶದ ಕಡೆಗೆ) ಹೋಗುತ್ತಾರೆ.\nಸ್ತ್ರೀಯರು ಹೇಳುವರು “ಸರಿ, ಇಲ್ಲಿ ಬಹಳ ಶಕೆ ಇದೆ.”ಆ ಹಳೇ ಅಪಾಚೆ ಇಂಡಿಯನರು, ಆ ದೂರ ದೇಶದಲ್ಲಿ, ನಿನ್ನನ್ನು ನೀನು ನಾಚಿಕೊಳ್ಳುವಂತೆ ಮಾಡುವರು. ಅಲ್ಲಿ ಎಷ್ಟು ಶೆಕೆ ಹೆಚ್ಚಾಗುತ್ತದೋ ಅಷ್ಟಾಗಿ ಅವರು ಹೆಚ್ಚು ವಸ್ತ್ರವನ್ನು ತೊಡುವವರಾಗಿದ್ದಾರೆ. ಸೂರ್ಯನನ್ನು ತಮ್ಮಿಂದ ದೂರವಿರಿಸಲು ನೋಡುತ್ತಾರೆ. ಅವರ ಬೆವರು ಸುರಿಸಿಕೊಂಡು ನಡೆದುಕೊಂಡು ಹೋಗುವಾಗ ನಿಮಗೆ ನಿಜವಾಗಿ ತಂಡಿ ವಾತಾವರಣದ ಅನುಭವವಾಗುವದು. ಅವರು ನೇರವಾಗಿ ಸೂರ್ಯನ ಬಿಸಿಲಿನಲ್ಲಿ ನಿಲುತ್ತಾರೆ.\n75ನೀನು ಅಲ್ಲಿ ನಿಲ್ಲಲು ಸಾಧ್ಯವಿಲ್ಲ: ನೀನು ಕರಿದುಕೊಂಡು ಸುಟ್ಟು ಹೋಗುವಿ. ಆದರೆ, ನೋಡಿರಿ. ಹೆಚ್ಚಿನ ವಿದ್ಯಾಭ್ಯಾಸ, ಆಧುನಿಕ ವಿಜ್ಞಾನ ಇದನೆಲ್ಲಾ ನಿನಗೆ ಮಾಡಿದೆ.\nಓ, ದೇವರೇ ಅಲ್ಲಿ ಲವೋದಿಕೀಯದಲ್ಲಿ ಅವಳು ಬೆತ್ತಲೆಯಾಗಿದ್ದಾಳೆ. ಆದರೆ ಅದನ್ನು ಅರಿಯದವಳಾಗಿದ್ದಾಳೆ. ಅವಳು ಏದೆನ್‌ನಲ್ಲಿ ಬೆತ್ತಲೆಯಾಗಿದ್ದಳು. ಎರಡೂ ರಾಜ್ಯಗಳು ಒಂದೇ ರೀತಿಯಾಗಿರುವದನ್ನು ನೋಡಿದಿರೋ? ಒಂದು ಪಾಪ ಮತ್ತು ಮರಣದ ರಾಜ್ಯವಾಗಿದೆ. ಇನ್ನೊಂದು ಜೀವ ಮತ್ತು ನೀತಿಯ ರಾಜ್ಯವಾಗಿದೆ. ಅಲ್ಲಿ ಅವಳು ಪವಿತ್ರ ಪರದೆಯಿಂದ ಪರದೆ ಮುಚ್ಚಲ್ಪಟ್ಟವಳಾಗಿದ್ದಳು. ಅವರಿಬ್ಬರೂ ಬೆತ್ತಲೆಯಾಗಿದ್ದರು. ಆದರೆ ಅದನ್ನು ತಿಳಿಯದವರಾಗಿದ್ದರು. ಅದರ ವಿಷಯ ಅವರು ಏನನ್ನೂ ತಿಳಿದವರಾಗಿರಲಿಲ್ಲ. ಯಾಕೆಂದರೆ ಅವರು ದೇವರ ಆತ್ಮನಿಂದ ಪರದೆ ಮುಚ್ಚಲ್ಪಟ್ಟವರಾಗಿದ್ದರು.\nಮತ್ತು ಇಲ್ಲಿ ಅವರು ಮೋಹದ ಪರದೆಯಿಂದ ಮುಚ್ಚಲ್ಪಟ್ಟರು, ಮತ್ತು ಅವರು ಒಬ್ಬರನ್ನೊಬ್ಬರು ನೋಡಿ ಮೋಹಪಡುವರು... ನೋಡಿರಿ. ಆದಾಮನು ಹವ್ವಳ ಕಡೆಗೆ ನೋಡಿದಾಗ್ಯೂ, ಆಕೆ ಬತ್ತಲೆಯಾಗಿದ್ದಾಳೆಂದು ಅವನು ತಿಳಿಯಲಿಲ್ಲ. ಆದರೆ ಈಗ ಈ ಮೋಹದ ಪರದೆಯಿಂದಾಗಿ, ಅವಳು ತಾನು ಬತ್ತಲೆಯಾಗಿದ್ದೇನೆಂದು ಕಂಡುಕೊಳ್ಳಲಾರಳು. ಆದರೆ ಈ ಮೋಹದ ಪರದೆಯಿಂದಾಗಿ ಪುರುಷನು ಅವಳ ಕಡೆಗೆ ನೋಡುವಂತೆ ಮಾಡುವಳು. ಅವಳು ಅದೊಂದನ್ನೇ ಮಾಡಶಕ್ತಳು. ನೀನು ಅದನ್ನು ನಂಬಲಾರೆ. ಆದರೆ ಹೇಗಾದರೂ ನೀನು ಅದನ್ನು ಮಾಡುವವನಾಗಿರುತ್ತಿ. ಮತ್ತು ಪುರುಷನು ನೋಡುವನು. ಅವನು(ಸ್ತ್ರೀಯಲ್ಲಿ) ನಿನ್ನಲ್ಲಿ ಅಷ್ಟು ಆಕರ್ಷಣೆ ಉಂಟೆಂದು ಕಂಡುಕೊಂಡಾಗ, ಅವನು ಮತ್ತನಾಗಿ ನಿನ್ನ ಕೆಲವು ವಸ್ತ್ರಗಳನ್ನು ತನ್ನ ಮೇಲೆ ಹಾಕಿಕೊಳ್ಳುವನು.\n76. ಓ, ಎಂಥಹಾ ಒಂದು ವ್ಯಂಗೀಕರಣ. ಎಂಥಹಾ ಒಂದು ಕಾಲ, ಎಂಥಹಾ ಒಂದು ಸಮಯ. ಅದು ಎಷ್ಟು ಮೋಸಕರವಾಗಿದೆ. ಓ, ಈ ಎಲ್ಲಾ ವಿಷಯಗಳು ಮತ್ತು ಅದನ್ನು ತಿಳಿಯದೆ ಇರುವುದು. ಒಂದು ಪರಿಪೂರ್ಣವಾದ ವ್ಯಂಗ್ಯಗೊಳಿಸಲ್ಪಟ್ಟ ಆತ್ಮವು ಜನರಲ್ಲಿ ಇದೆ. ಸೈತಾನನ ಮೋಹದ ಮೂಲಕ ಪರದೆ ಮುಚ್ಚಲ್ಪಟ್ಟವನಾಗಿದ್ದಾನೆ. ಸ್ತ್ರೀಯೂ ಸಹ. ಅದು ಒಂದು ಮಹಾ ಸಮಾಜದ ಪೈಶಾಚಿಕ ಆತ್ಮವಾಗಿದೆ ನೋಡಿರಿ.\nಅವರಿಗೆ ಅದು ತಿಳಿದಿಲ್ಲ. ಆದರೆ ಅವರು ಒಂದು ಸಂಸ್ಥೆಯಾಗಿದ್ದಾರೆ. ಚಡ್ಡಿ ಮುಂತಾದ ಉಡುಪನ್ನು ಹಾಕುವಂಥ ಸ್ತ್ರೀಯರು ಒಂದು ಸಂಸ್ಥೆಗೆ ಸೇರಿದವರಾಗಿದ್ದಾರೆ. ಆ ರೀತಿ ವಸ್ತ್ರ ಧರಿಸುವ ಪುರುಷರು ಒಂದು ಸಂಸ್ಥೆಗೆ ಸೇರಿದವರಾಗಿದ್ದಾರೆ. ನಾನು ಅದರ ಸಂಕ್ಷಿಪ್ತ ಹೆಸರನ್ನು ನಿಮಗೆ ಹೇಳುವೆನು. ದೊ.ಸ.ಸ.- ಎಂದರೆ ದೊಡ್ಡ ಸಹೋದರಿಯರ ಸಮಾಜ (B.S.S. - Big Sisters Society) ಆದುದರಿಂದ ಅದೇ ಅವರು ಸೇರಿರುವ ಸಮಾಜವಾಗಿದೆ. ಅವರು ದೊಡ್ಡ ಸ್ತ್ರೀಲೋಲವಾದ ಸಮಾಜದ ಮೂಲಕ, ಆಹಳೇ (ಪೈಜಾಮ್) ಪ್ಯಾಂಟ್‌ಗಳನ್ನು ಹಾಕುತ್ತಾ, ಅಸಹ್ಯವಾಗಿ ಹೇಸಿಗೆಯಾಗಿ ಕಾಣುವ ಸಂಗತಿಗಳಿಂದ ಅಲ್ಲಿ ಬರುತ್ತಾರೆ.\n77ಪುರುಷನೇ, ಈ ವಿಷಯದಲ್ಲಿ ನಿನಗೆ ನನಿಗಿಂತ ನಿನ್ನ ಅಭಿಪ್ರಾಯವಿರಬಹುದು, ಆದರೆ ಇದು ಸತ್ಯವಾಗಿರುತ್ತದೆ. ನೀನು ವ್ಯಂಗ್ಯಗೊಳಿಸಲ್ಪಟ್ಟಿದ್ದೀ, ಆದರೆ ಅದನ್ನು ತಿಳಿಯದೆ ಇದ್ದೀ. ನೀನು ನಿಜವಾದ ಪುರುಷನಂತೆ ಇನ್ನೆಂದೂ ವರ್ತಿಸುವದಿಲ್ಲ, ಅವರು ಅಷ್ಟು ನಾಜೂಕಾಗಿದ್ದಾರೆ; ಅವರಲ್ಲಿ ಇನ್ಯಾವ ಪೌರುಷತ್ವವೂ, ಸ್ತ್ರೀತ್ವವೂ ಉಳಿದಿಲ್ಲ. ಅವರು ಒಂದು ಸಮಾಜವಾಗಿದ್ದಾರೆ. ಅವರು ಒಂದು ಸಂಸ್ಥೆಯಾಗಿದ್ದಾರೆ. ಯಾಕೆ? “ಬದಿಯ ಮನೆಯ ಜಾನ್, ಚಡ್ಡಿ ಹಾಕಿಕೊಂಡು ತಿರುಗಾಡುತ್ತಾನೆ. ಆದುದರಿಂದ ನಾನೇಕೆ ಹಾಗೆ ಮಾಡಬಾರದು? ಲುವೆಲ್ಲಾಳು ನಾನು ಅದನ್ನು ಉಡಬೇಕೆಂದು ಅಪೇಕ್ಷಿಸಿದಳು. ಯಾಕೆಂದರೆ ನೆರಮನೆಯ ಜಾನ್ ಅದನ್ನು ಉಡುತ್ತಾನೆ. ಮತ್ತು ಸರಿ, ಸೂಸಿಜೇನ್ ಅದನ್ನು ಉಟ್ಟುಕೊಂಡರೆ, ಮಾರ್ಥಾ ಜೇನಳು ಸಹ ಅದನ್ನು ಉಡಬಹುದು. ಅಥವಾ ಸೂಸಿಲವ್'ಸಹ,” ಅಥವಾ ಬೇರೆ ಯಾವ ಹೆಸರಿನವಳು ಇದ್ದರೂ ಸಹ, ನೋಡಿರಿ, ನೋಡಿರಿ ಅದು ಒಂದು ಸಮಾಜವಾಗಿದೆ (ಅವಿಶ್ವಾಸಿಗಳ ಸಮಾಜ) ಅದು ಒಂದು ಸಂಸ್ಥೆಯಾಗಿದೆ. ನೀನು ಆತ್ಮೀಕ ರೀತಿಯಲ್ಲಿ ಅದಕ್ಕೆ ಸಂಬಂದಪಟ್ಟವನಾಗಿರುತ್ತೀ ಆದರೆ ಅದನ್ನು ತಿಳಿಯದೆ ಇದ್ದೀ.\n78ಮತ್ತು ಅದು ಹಾಗಿದ್ದರೆ,ಮತ್ತು ನಾವು ಅದನ್ನು ಆ ರೀತಿ ನೋಡುವವರಾಗಿದ್ದರೆ, ಆ ರೀತಿಯಲ್ಲಿ ನೀನು ಕುರುಡನಾಗಿ ಮಾಡಲ್ಪಟ್ಟಿದ್ದೀ! ಸೈತಾನನು ನಿನ್ನನ್ನು ಅದಕ್ಕೆ ತಿರುಗಿಸಿ ಬಿಟ್ಟದ್ದರಿಂದ ನೀನು ಆ ಸಂಪ್ರದಾಯ ಸಭೆಗಳಿಗೆ ಕುರುಡನಾಗಿ ಮಾಡಲ್ಪಟ್ಟಿದ್ದೀ, ಅದು ಒಂದು ದೇವರ ಮೂಲ ವಾಕ್ಯದ, ಆತನ ರಾಜ್ಯದ ಮತ್ತು ಆತನ ಮಕ್ಕಳಿಗೋಸ್ಕರವಿರುವ ಆತನ ಯೋಜನೆಯ ವ್ಯಂಗೀಕರಣವಾಗಿದೆ! ಸೈತಾನನು ಪುರುಷ ಮತ್ತು ಸ್ತ್ರೀಯನ್ನು ಈ ವಿಷಯಗಳಿಗೆ ತಿರುಗಿಸಿ ಬಿಟ್ಟಿದ್ದಾನೆ, ಮತ್ತು ಅವರು ಅದನ್ನು ತಿಳಿಯದವರಾಗಿದ್ದಾರೆ - ಒಂದು ವ್ಯಂಗೀಕರಣ. ಇನ್ನೆಂದೂ ದೇವರ ಮಗನಲ್ಲ, ಗುಂಗುರು ಕೂದಲು ಅವನ ಮುಖದ ಮೇಲೆ ಬಿದ್ದುಕೊಂಡು ಚಡ್ಡಿ ಹಾಕಿಕೊಂಡು, ರಸ್ತೆಯಲ್ಲಿ ತಿರುಗಾಡುತ್ತಿರುವ ಮನುಷ್ಯನು, ಅವನು ದೇವರ ಮಗನೋ? ಒಂದು ಸಭೆಯಲ್ಲಿ ಡೀಕನ್ (ಸಭೆಯ ಸೇವಕ), ಪೀಠದಲ್ಲಿ ನಿಂತಿರುವ ಪಾಸ್ಟ‌ರ್? ಎಂದಿಗೂ ಇಲ್ಲ. ಅದು ದೇವರ ಮಗನ ಲಕ್ಷಣವಲ್ಲ!\nದೇವರ ಆಲೋಚನಾ ಸೋಸಿಕೆಯ ಮೂಲಕ ಅವನೆಂದೂ ಬಂದಂಥವನಲ್ಲ. ಹಾಗಾದ್ದರೆ ಅವನು ಅಂಥಹಾ ಸ್ತ್ರೀಯ ವಸ್ತ್ರವನ್ನು ಉಡಲಾರನು. ಅವನು ಖಂಡಿತವಾಗಿ ಹಾಗೆ ಮಾಡಲಾರನು. ಹಾಗೆಯೇ ಅವಳು ಒಬ್ಬ ಪುರುಷನ ವಸ್ತ್ರವನ್ನು ಧರಿಸಲಾರಳು. ಅದು ಒಂದು ದೇವರ ಮಗನ ಗುಣವಲ್ಲ, ಅದು ಸೈತಾನನ ಮಗನು ಮತ್ತು ಒಬ್ಬಳು ಸೈತಾನನ ಮಗಳು (ಹೇಳುವದಕ್ಕೆ ಕಠಿಣವಾದ ಮಾತು).\n79ಸೈತಾನನು ಈ ಲೋಕವನ್ನು ಜಯಿಸಿ ಅದನ್ನು ವ್ಯಂಗೀಕರಿಸುವದರಲ್ಲಿ ಮತ್ತು ಅದನ್ನು ತನ ರಾಜ್ಯವನ್ನಾಗಿ ಮಾಡುವದರಲ್ಲಿಯ ಶಸ್ವಿಯಾಗಿದ್ದಾನೆ, ಯಾಕೆಂದರೆ ಮನುಷ್ಯರು ತಾವು ಇಚ್ಛಿಸುವ ಜೀವನವನ್ನು ಜೀವಿಸುವಂತೆ, ಅವರು ತಮಗೋಸ್ಕರ ಅದನ್ನು ಆರಿಸಿಕೊಳ್ಳುವಂತೆ, ಸ್ವಚ್ಛೆಗೆ ಒಳಪಟ್ಟವರಾಗಿದ್ದಾರೆ. ಅದು ನಿನ್ನ ಹೃದಯದಲ್ಲಿ ಏನಿದೆ ಎಂಬುದನ್ನು ತೋರಿಸುತ್ತದೆ... ನಿನ್ನ ಮಾತು... ಏನೆಂದು ನಿನಗೆ ತಿಳಿದಿದೆಯೋ?ನಿನ್ನ ವರ್ತನೆಯು ಎಷ್ಟು ಗಟ್ಟಿಯಾಗಿ ಮಾತಾಡುತ್ತದೆ ಎಂದರೆ, ಅದು ನಿನ್ನ ಮಾತನ್ನು ಮುಳುಗಿಸುತ್ತದೆ. ನಾನು ಒಬ್ಬ ಮನುಷ್ಯನ ಬಳಿಗೆ ಹೋಗಿ ಈ ರೀತಿ ಹೇಳಬಹುದು. “ಓ ನಾವೆಲ್ಲಾ ಕ್ರೈಸ್ತರಾಗಿದ್ದೇವೆ. ನಾವು ಸಭೆಗೆ ಸೇರಿದವರಾಗಿದ್ದೇವೆ.” ಆದರೆ ಅವನ ಆಫೀಸಿನ ಸುತ್ತಲೂ ಬೆತ್ತಲೆ ಚಿತ್ರಗಳು ನೇತಾಡುತ್ತಿರುವದಾದರೆ? ಅವನು ಏನು ಹೇಳಿದರೂ ಅದು ಯಾವ ವ್ಯತ್ಯಾಸವನ್ನು ಮಾಡುವದಿಲ್ಲ. ನಾನು ಅದಕ್ಕಿಂತ ಉತ್ತಮವಾಗಿ ತಿಳಿದುಕೊಂಡಿದ್ದೇನೆ. ಹಾಗೆಯೇ ನೀನು ಸಹ.\nಒಬ್ಬಾಕೆ ಸ್ತ್ರೀಯು ತನ್ನ ಕೂದಲು ಕತ್ತರಿಸಿಕೊಂಡವಳಾಗಿ ತಾನು ಕ್ರೈಸ್ತಳು ಎಂದು ಹೇಳಲಿ? ನಿಮಗೆ ಅದಕ್ಕಿಂತ ಉತ್ತಮವಾದುದು ಏನೆಂದು ತಿಳಿದಿದೆ, ನೋಡಿರಿ. ಹೌದಯ್ಯಾ, ಬಣ್ಣವನ್ನು ಹಚ್ಚಿಕೊಂಡು,ತನ್ನನು ಅಲಂಕರಿಸಿಕೊಂಡು, ಗಿಡ್ಡವಾದ ಚಡ್ಡಿಯನ್ನು ತೊಟ್ಟುಕೊಂಡುತಾನು ಕೈಸ್ತಳು ಎಂದು ಹೇಳಲಿ? ಅದು ಏನೆಂದು ನಿಮಗೆ ಚೆನ್ನಾಗಿ ತಿಳಿದಿದೆ. ದೇವರ ವಾಕ್ಯವು ನಿಮಗೆ ಅದಕ್ಕಿಂತ ಉತ್ತಮವಾದದನ್ನು ಕಲಿಸುತ್ತದೆ. ವಾಕ್ಯವು ಹೇಳುತ್ತದೇನೆಂದರೆ ಆಕೆಯು ಕ್ರೈಸ್ತಳಾಗಿ ಅದನ್ನು ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ, ಆಕೆಯು ಮಾನಹೀನಳು ಆಗಿರುವಳು. ದೇವರು ತನ್ನ ರಾಜ್ಯದಲ್ಲಿ ಒಂದು ಮಾನಹೀನ ವಸ್ತುವನ್ನು ಇಡಲು ಹೇಗೆ ಸಾಧ್ಯ? ಇಲ್ಲಯ್ಯಾ, ಎಂದೂ ಇಲ್ಲ ಇಲ್ಲವೇ ಇಲ್ಲ. ಅದು ಅವರನ್ನೂ ಅವರ ಇಚ್ಛೆಯನ್ನೂ ತೋರಿಸುತ್ತದೆ.\n80ಒಂದು ಕಾಗೆಯೊಂದಿಗೆ ಒಂದು ಪಾರಿವಾಳವು ತಿನ್ನುವಂತೆ ನೀನು ಮಾಡಲಾರೆ ಇಲ್ಲವೇ ಇಲ್ಲ. ಪಾರಿವಾಳದಲ್ಲಿ ಕಹಿ ಎಂಬುದು ಇಲ್ಲವೇ ಇಲ್ಲ. ಆ ಹಳೇ ಹೆಣವನ್ನು ಅವನು ತಿನ್ನಲಾರನು. ಅದರಲ್ಲಿ ಒಂದು ಸಣ್ಣ ಚೂರನ್ನಾದರೂ ತಿಂದರೆ, ಅದು ಅವನನ್ನು ಕೊಲ್ಲುವದು (ಸಾಯಿಸುವದು) ಮತ್ತು ಅದು ಅವನಿಗೆ ತಿಳಿದಿದೆ. ಆದರೆ ಒಂದು ಕಾಗೆ ತಾನು ಬಯಸುವದನ್ನೆಲ್ಲಾ ತಿನ್ನ ಶಕ್ತನು. ಅವನಲ್ಲಿ ತುಂಬಾ ಕಹಿ ಪದಾರ್ಥವಿದೆ. ಆದುದರಿಂದ ಲೋಕದೊಂದಿಗೂ ಈ ದಿನದಲ್ಲಿ ಅದೇ ರೀತಿಯಾಗಿ ನಡೆಯುತ್ತದೆ ಎಂದು ನೀವು ಕಂಡುಕೊಳ್ಳುತ್ತಿರಿ - ಅದೇ ಸಂಗತಿ. ಅವರು ಬೆತ್ತಲೆಯಾಗಿಯೂ, ಕುರುಡರಾಗಿಯೂ ಇದ್ದಾರೆ, ಆದರೆ ಅದನ್ನು ಅರಿತಿಲ್ಲ. ಸೈತಾನನು ಆ ಸ್ತ್ರೀಯ, ಜ್ಞಾನಕೋಸ್ಕರವಾದ, ಲೈಂಗಿಕ ಅಪೇಕ್ಷೆಗೋಸ್ಕರವಾದ ಮೋಹದ ಮೂಲಕವಾಗಿ ಇದನ್ನೆಲ್ಲಾ ಮಾಡಿದ್ದಾನೆ. ಅದನ್ನು ಅವಳು ತನ್ನ ಸ್ಟೇಚ್ಛೆಯಿಂದಲೇ ಆರಿಸಿಕೊಂಡಿದ್ದಾಳೆ.\n81ಈಗ ಲಕ್ಷಿಸಿರಿ. ಆದಾಮನನ್ನು ತಪ್ಪು ಮಾರ್ಗಕ್ಕೆ ನಡಿಸಿದವಳು ಹವ್ವಳು ಮತ್ತು ಅವಳ ಆದಾಮನು ತನ್ನ ವಸ್ತ್ರವನ್ನು ತೆಗೆಯುವದಕ್ಕೆ ಮೊದಲು, ಆ ಸ್ತ್ರೀಯು ತನ್ನ ವಸ್ತ್ರವನ್ನು ತೆಗೆದುಕೊಂಡವಳಾಗಿದ್ದಾಳೆ. ಅದು ಯಾವಾಗಲೂ - ಒಬ್ಬ ಸ್ತ್ರೀ. ಅದು ಎಂದಿನಿಂದಲೂ ಹಾಗೇ ಇತ್ತು. ಈಗಲೂ ಅದು ಅದೇ ರೀತಿಯಾಗಿದೆ.\nಆ ಸಭೆಯು ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ತಪ್ಪು ಮಾರ್ಗಕ್ಕೆ ನಡೆಸುತ್ತದೆ. ಒಬ್ಬ ದೇವರ ಮಗನಾಗಿರಬೇಕೆಂದು ಬಯಸುವ ಮನುಷ್ಯನನ್ನು ತಪ್ಪುದಾರಿಗೆ ನಡೆಸುವದು ಸಭೆಯಾಗಿದೆ (ಸಂಪ್ರದಾಯ ಸಭೆ) ನೋಡಿರಿ. ಅದು ಸಭೆಯೆಂಬ ಒಂದು ಸ್ತ್ರೀ. ಬೈಬಲ್ ಅಥವಾ ದೇವರು ಅಲ್ಲ, ಯಾಕಂದರೆ ಬೈಬಲ್ ಎಂದರೆ ಮನುಷ್ಯನು ಓ, ಸರಿ ವಾಕ್ಯವು ನರಾವತಾರ ಎತ್ತಿತು. ಮತ್ತು ಆತನು ಒಬ್ಬ ಮನುಷ್ಯ (ಪುರುಷ)ನಾಗಿದ್ದನು. ಸಭೆಯು ಸ್ತ್ರೀಯಾಗಿದೆ. ನೋಡಿರಿ. ಬೈಬಲ್ (ಪವಿತ್ರವಾಕ್ಯವು) ಮನುಷ್ಯನನ್ನು ತಪ್ಪು ಮಾರ್ಗಕ್ಕೆ ನಡೆಸುವುದಿಲ್ಲ. ಸಭೆಯು ಅವನನ್ನು ತಪ್ಪುದಾರಿಗೆ ನಡೆಸುತ್ತದೆ. ಸಂಪ್ರದಾಯ ಸಭೆಯೊಂದಿಗೆ ಅವನು ಬೆತ್ತಲೆಯಾಗಿ ಕಂಡು ಹಿಡಿಯಲ್ಪಟ್ಟನು; ಬೈಬಲ್‌ನೊಂದಿಗಲ್ಲ, ನಿಜವಾಗಿ ಅಲ್ಲ, ಬೈಬಲ್ ಅವನು ಬೆತ್ತಲೆಯಾಗಿದ್ದಾನೆಂದು ಅವನಿಗೆ ಹೇಳುತ್ತದೆ. ಹೌದಯ್ಯಾ,\nಈಗ ಲೈಂಗಿಕ ಇಚ್ಚೆ ಆಶೆಯ ಮೂಲಕವಾಗಿ, ಅವಳು ಜ್ಞಾನಕ್ಕೋಸ್ಕರ ಹ್ಯಾಗೆ ಮೋಹಿಸಿ ಅದು ಏನೆಂದು ತಿಳುಕೊಳ್ಳಲು ಆಸೆಪಟ್ಟಳು, ಮತ್ತು ಯಾವ ರೀತಿ ಈ ಫಲವು ಒಳ್ಳೆಯದೋ ಕೆಟ್ಟದೋ ಎಂದು ನೋಡಲು ಇಷ್ಟಪಟ್ಟಳು? ಮತ್ತು ಅವಳು ಅದನ್ನು ಮಾಡಿದಳು.\n82ಆದರೂ ಒಬ್ಬ ಮನುಷ್ಯನ ಮೂಲಕವಾಗಿ ದೇವರು ಒಂದು ದಿನ ಈ ಎಲ್ಲವನ್ನೂ ಪುನರ್ ಸ್ಥಾಪಿಸುವನು. ಅದು ಒಬ್ಬ ಸ್ತ್ರೀಯ ಮೂಲಕವಾಗಿ ಅಧೀನ ಮಾಡಲ್ಪಟ್ಟಿತ್ತು; ಆದರೆ ಒಬ್ಬ ಪುರುಷನ ಮೂಲಕವಾಗಿ ಬಿಡುಗಡೆಗೊಳಿಸಲ್ಪಟ್ಟಿತು. ಯೇಸು ಕ್ರಿಸ್ತನೆಂಬ ಪುರುಷನು, ಆತನು ವಾಕ್ಯವಾಗಿದ್ದಾನೆ. ಮತ್ತು ಅದು ಏನಾಗಿದೆ? (ಮುಕ್ತಾಯ ಮಾಡುವ ಮೊದಲು ಲಕ್ಷಿಸಿರಿ). ಇಲ್ಲಿ ಕೆಲವೇ ಸಮಯದ ಹಿಂದೆ, ನಾನು ಈ ಒಂದು ಹೇಳಿಕೆಯನ್ನು ಮಾಡಿದನು.ಇಲ್ಲಿ ನನ್ನೊಂದಿಗೆ ಇನ್ನು ನಾಲ್ಕು, ಐದು ಪುಟಗಳಷ್ಟು ಇದೆ. ವಚನದಿಂದ ತೆಗೆಯಬಹುದಂಥ ಭಾಗ ಮತ್ತು ನಾನು ಹೇಳಬೇಕೆಂದಿದ್ದಂಥಾ ವಿಷಯಗಳು. ಆದರೆ ಲಕ್ಷ್ಯವಿಟ್ಟು ಕೇಳಿರಿ. ಮುಗಿಸುವ ಮೊದಲು ಇದನ್ನು ನಾನು ಹೇಳುವೆನು.\n83. ಇಲ್ಲಿ ಕೆಲವು ಸಮಯದ ಹಿಂದೆ ಏಳು ತತೂರಿಗಳು, ತತೂರಿಗಳ ಹಬ್ಬ ಮತ್ತು ಇತರ ಸಂಗತಿಗಳ ವಿಷಯ ಬೋಧಿಸಿದ್ದು ನಿಮಗೆ ನೆನಪಿದೆಯೋ? ಮತ್ತು ನಾನು ಈ ರೀತಿಯಾಗಿ ಹೇಳಿದ್ದೆನು “ಅಲ್ಲಿ ಒಂದು ಎಂಟನೆಯ ದಿನದ ಹಬ್ಬವಿದೆ'' ಆದುದರಿಂದ ಏಳನೆಯ ದಿನವು ಅದು ಕಡೇ ದಿನವಾಗಿದೆ; ಅದು ಸಾವಿರ ವರ್ಷದ ಆಳ್ವಿಕೆಯು ಆಗಿರುವದು. ಆದರೆ ಅಲ್ಲಿ ಒಂದು ಎಂಟನೆಯ ದಿನದ ಹಬ್ಬವಿರುವದು, ಅಂದರೆ ಅಂದು ಎಂಟನೆಯ ದಿನವಾಗಿರುವುದರಿಂದ, ಮತ್ತು ಅಲ್ಲಿ ಏಳೇ ದಿನಗಳು ಇರುವದರಿಂದ (ವಾರದಲ್ಲಿ) ಅದನ್ನು ಪುನಃ ಒಂದನೇ ದಿನವಾಗಿ ಮಾಡುವದು. ಪುನಃ ನೇರವಾಗಿ ಒಂದನೇ ದಿನಕ್ಕೆ ಅದು ಬರುತ್ತದೆ. ಮತ್ತು ಆ ಸಾವಿರ ವರುಷದ ಆಳ್ವಿಕೆಯು ಆದ ನಂತರ, ಆಗ ಅಲ್ಲಿ ಒಂದು ಪುನಃ ಸ್ಥಾಪಿಸಲ್ಪಡುವ ಏದೆನ್ (ಏದೆನ್ ತೋಟ) ಇರುವದು. ದೇವರ ಮಹಾ ರಾಜ್ಯವು ಪುನಃ ಹಿಂದೆ ಸ್ಥಾಪಿಸಲ್ಪಡುವದು, ಯಾಕೆಂದರೆ ಗೆತ್ಸೇಮನೆ ತೋಟದಲ್ಲಿ ಯೇಸುವು ಸೈತಾನನೊಂದಿಗೆ ಹೋರಾಡಿ ಜಯಿಸಿಗೆದ್ದನು, ಮತ್ತು ಅ ಏದೆನ್ ಅನ್ನು ಪುನಃ ಜಯಿಸಿದನು, ಅದನ್ನೇ ಆತನು ಪರಲೋಕದಲ್ಲಿ ತಯಾರು ಮಾಡಿ, ಪುನಃಹಿಂದೆ ಬರಲು ಹೋದಾತನಾಗಿದ್ದಾನೆ.\nಪರಲೋಕದಲ್ಲಿ ಮೇಲೆ, ಆತನು ಹೇಳಿದ್ದು “ನಿಮ್ಮ ಹೃದಯವು ಕಳವಳಗೊಳ್ಳದೆ ಇರಲಿ”.\n84ಆತನು ಈ ಲೋಕದಲ್ಲಿ ಇದ್ದಾಗ, ಆತನು ಹೇಳಿದ್ದು “ಯೆಹೂದ್ಯರಾದ ನೀವು, ನೀವು ದೇವರಲ್ಲಿ ನಂಬಿಕೆಯುಳ್ಳವರಾಗಿದ್ದೀರಿ (ಈಗ ನನ್ನ ವಿಷಯ ನೀವು ಒಳ್ಳೆ ಅಭಿಪ್ರಾಯವಿಲ್ಲದವರಾಗಿದ್ದೀರೆಂದು ನನಗೆ ತಿಳಿದಿದೆ, ಆತನು ಹೇಳಿದ್ದು ”ಮತ್ತು ಅವರು ಆ ರೀತಿ, ಈ ರೀತಿ ಹೇಳುವವರಾಗಿದ್ದಾರೆ“ ), ಆದರೆ ನೀವು ದೇವರಲ್ಲಿ ನಂಬಿಕೆಯುಳ್ಳವರಾಗಿದ್ದೀರಿ. ಮತ್ತು ನೀವು ದೇವರಲ್ಲಿ ನಂಬಿಕೆಯಿಟ್ಟಂತೆ ನನ್ನನ್ನೂ ನಂಬಿರಿ.”\nಆತನು ಮಾಂಸ ರೂಪದಲ್ಲಿ ಪ್ರಕಟಿಸಲ್ಪಟ್ಟ ದೇವರಾಗಿದ್ದರು. ನನ್ನನ್ನು ನಂಬಿರಿ...\n85“ನನ್ನ ತಂದೆಯ ಮನೆಯಲ್ಲಿ ಬಹಳ ಬಿಡಾರಗಳು ಇವೆ. ಅಥವಾ ನನ್ನ ತಂದೆಯ ಯೋಜನೆಯಲ್ಲಿ ಬಹಳ ಅರಮನೆಗಳು ಇವೆ. ನಾನು ನಿಮಗೆ ಸ್ಥಳವನ್ನು ತಯಾರು ಮಾಡಲು ಹೋಗುತ್ತೇನೆ”. ಅದು ಎಷ್ಟು ಉದ್ದ ಇದೆಯೆಂದು ನೋಡಿರಿ. - 1500ಚದರ ಮೈಲಿಗಳು. “ಅದು ಎಲ್ಲಿ ಇದೆಯೆಂದು ಹೇಳಿರಿ?” ಆತನು ಅದನ್ನು ತಯಾರು ಮಾಡಲು ಹೋಗಿದ್ದಾನೆ. ಆತನು ಸೃಷ್ಟಿಕರ್ತನು. ಆ ಎಲ್ಲಾ ಚಿನ್ನವನ್ನು ಆತನು ಸೃಷ್ಟಿಸಿದನು. ಅದರ ಬೀದಿಗಳು ಪಾರದರ್ಶಕವಾಗಿವೆ. ಆತನು ಸೃಷ್ಟಿಕರ್ತನು. ಆತನು ಒಂದು ಸ್ಥಳವನ್ನು ತಯಾರುಮಾಡುತ್ತಾನೆ.\nಪ್ರಕಟಣೆ 21ರಲ್ಲಿ ಆತನು ಹೇಳಿದ್ದು ಮತ್ತು “ಯೋಹಾನನಾದ ನಾನು, ಆ ಪವಿತ್ರ ಪಟ್ಟಣವಾದ ಹೊಸ ಯೆರೂಸಲೇಮ್, ದೇವರ ಸನ್ನಿಧಿಯಿಂದ ಪರಲೋಕದಿಂದ ಇಳಿದು ಬರುವದನ್ನು ನೋಡಿದೆನು” ಅಲ್ಲಿ ಸಮುದ್ರವು ಇನ್ನೆಂದೂ ಇರಲಿಲ್ಲ. ಮೊದಲನೆಯ ಆಕಾಶವೂ ಮೊದಲನೆಯ ಭೂಮಿಯೂ ದಾಟಿಹೋದವು.\nಆ ಮೊದಲನೇ ಆಕಾಶ ಯಾವದಾಗಿತ್ತು? ಅದು ಸಾವಿರ ವರ್ಷದ ಆಳ್ವಿಕೆಯಾಗಿತ್ತು. ಮೊದಲನೆಯ ಭೂಮಿಯು ಯಾವದಾಗಿತ್ತು? ಇದುವೇ (ನಾವು ನಿಂತಿರುವ ಭೂಮಿ). ಅದು ಪೂರಾ ಹೊಸದಾಗಿ ಮಾಡಲ್ಪಡುವದು. ನೋಹನ ಕಾಲದಲ್ಲಿ ಅವನು ಬೋಧಿಸಿದ ಸಮಯದಲ್ಲಿ ಈ ಭೂಮಿ ನೀರಿನಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಹೊಂದಿದಂತೆ, ಕ್ರಿಸ್ತನು ತನ್ನ ರಕ್ತವನ್ನು ಈ ಭೂಮಿಯ ಮೇಲೆ ಪೋಕ್ಷಿಸಿದಾಗ ಇದು ಕ್ರಿಸ್ತನಿಂದ ಪವಿತ್ರೀ ಕರಿಸಲ್ಪಟ್ಟಂತೆ, ಕಡೆಯಲ್ಲಿ ಬೆಂಕಿಯ ದೀಕ್ಷಾಸ್ನಾನದಿಂದ ಇದು ಪೂರಾ ಹೊಸದಾಗಿ ಮಾಡಲ್ಪಡುವದು. (ಇದರಿಂದ ಎಲ್ಲಾ ಹುಳುಗಳನ್ನುಇನ್ನಿತರ ಎಲ್ಲಾ ಸಂಗತಿಗಳನ್ನು ಹೊರ ತೆಗೆಯುವದು), ಅದು ಪ್ರತಿಯೊಂದು ಹುಳವನ್ನು ಪ್ರತಿಯೊಂದು ರೋಗವನ್ನು ರುಜಿನವನ್ನು ಈ ಲೋಕದಲ್ಲಿದ್ದ ಯಾವುದೇ ಕೊಳಕನ್ನು ಅಶುದ್ಧತೆಯನ್ನು ತೆಗೆದು ಹಾಕುವದು.\n86ಆಕೆಯು ಒಡೆದು ಹೋಗಿ, ಹೊಸ ಭೂಮಿಯಾಗಿ ಹೊರ ಬರುವಳು. “ಮತ್ತು ನಾನು ಒಂದು ಹೊಸ ಆಕಾಶವನ್ನೂ ಹೊಸ ಭೂಮಿಯನ್ನೂ ಕಂಡೆನು. ಮೊದಲನೇ ಆಕಾಶವೂ, ಮೊದಲನೇ ಭೂಮಿಯೂ ತೊಲಗಿ ಹೋದವು. ಮತ್ತು ಅಲ್ಲಿ ಇನ್ನೆಂದೂ ಸಮುದ್ರವು ಇರಲಿಲ್ಲ. ಮತ್ತು ಯೇಹಾನನೆಂಬ ನಾನು, ಆ ಪವಿತ್ರಪಟ್ಟಣವಾದ ಯೆರೂಸಲೇಮ್ ಪರಲೋಕದಿಂದ ದೇವರ ಸನ್ನಿಧಿ ಯಿಂದ ಇಳಿದು ಬರುವದನ್ನು ನೋಡಿದೆನು”.\nಅಲ್ಲಿ ದೇವರು ತನ್ನ ನಿಜ ಗುಣಗಳಾದ ತನ್ನ ಪುತ್ರ ಮತ್ತು ಪುತ್ರಿಯರೊಂದಿಗೆ ಇರುವನು; ಅಲ್ಲಿ ಆತನು, ಅವರ ಕಣ್ಣುಗಳು ಯಾವುದೇ ಪಾಪಕ್ಕೆ ಕುರುಡಾಗಿರುವದರಿಂದ ಪವಿತ್ರತೆಯಲ್ಲಿ ಅವರೊಂದಿಗೆ ವಾಸಿಸುವನು. ಮತ್ತು ಅಲ್ಲಿ ಇನ್ನೆಂದೂ ಪಾಪವು ಇರುವುದೇ ಇಲ್ಲ. ನಾವು ಇನ್ನೂ ಹೆಚ್ಚಾಗಿ ಶ್ರಮಿಸೋಣ. ಈ ದಿನದಲ್ಲಿ ಮೋಸಗೊಳಿಸಲ್ಪಡಬೇಡಿರಿ. ಆದರೆ ಆ ಬಾಗಿಲಿನಿಂದ ಒಳಗೆ ಹೋಗಲು ಪ್ರಯಾಸಪಡಿರಿ, ಯಾಕಂದರೆ, ಎಲ್ಲಾ ಸೂಳೆಗಾರರು, ಮೋಹ ಪಡುವವರು, ಇವೆಲ್ಲರೂ ಬಿಡಲ್ಪಡುವರು. “ಒಬ್ಬ ಸ್ತ್ರೀಯನ್ನು ನೋಡಿ ಮೋಹಿಸುವವನು, ಆಗಲೇ ತನ್ನ ಹೃದಯದಲ್ಲಿ ಆಕೆಯ ಕೂಡ ವ್ಯಭಿಚಾರ ಮಾಡಿದವನಾಗಿರುವನು.” ಎಲ್ಲಾ ಮಾನಗೆಟ್ಟ ಸ್ತ್ರೀಯರು, ಮಾನಗೆಟ್ಟ ಪುರುಷರು, ಮತ್ತೆಲ್ಲಾ ಇತರರು ಹೊರಗಿರುವರು. ಕೇವಲ ರಕ್ಷಣೆ ಹೊಂದಿದವರು, ಮತ್ತು ತಮ್ಮ ಹೆಸರುಗಳು ಯಜ್ಞದ ಕುರಿಯಾದಾತನ ಪುಸ್ತಕದಲ್ಲಿ ಇರುವವರು ಈ ದ್ವಾರದ ಮೂಲಕ ಪ್ರವೇಶಿಸುವರು.ಆದುದರಿಂದ ಸ್ನೇಹಿತರೆ, ಇದಕ್ಕೋಸ್ಕರ ಪ್ರಯಾಸಪಡಿರಿ. ಈ ಕಡೇ ದಿನದಲ್ಲಿ ಮೋಸಗೊಳಿಸಲ್ಪಡಬೇಡಿರಿ.\n87ಇದು ಒಂದು ಮಹಾ ಸಮಯವಾಗಿದೆ. ಪ್ರತಿಯೊಬ್ಬರೊಂದಿಗೂ ಧನ ಸಂಪತ್ತಿದೆ. ಪ್ರತಿಯೊಬ್ಬರೂ, ಇದನ್ನೇ ಅದನ್ನೋ ಮಾಡಶಕ್ತರು. ಹಣವು ಪ್ರತೀ ಕಡೆ ಹರಿಯುತ್ತದೆ. ಮತ್ತು ದೊಡ್ಡ ದೊಡ್ಡ ಕಾರುಗಳು ಇನ್ನಿತರ ಸಂಗತಿಗಳು ಅವರಲ್ಲಿ ಇವೆ. ಇವರಲ್ಲಿ ಒಬ್ಬರೂ ಆ ಪರಿಶುದ್ಧ ನಗರದಲ್ಲಿ ಇರುವದಿಲ್ಲ! ಅಲ್ಲಿ ಒಂದೇ ಒಂದು ಕಾರು ಅಥವಾ ವಿಮಾನ ಅಲ್ಲಿರದು. ಇಲ್ಲ ಅದು ಸಂಪೂರ್ಣವಾಗಿ ಭಿನ್ನವಾಗಿರುವ ಒಂದು ಸಂಸ್ಕೃತಿ ಅಥವಾ ಪಟ್ಟಣವಾಗಿರುವದು. ಅದು ಒಂದು ಜ್ಞಾನದ, ವಿಜ್ಞಾನದ ಒಂದು ಸಂಸ್ಕೃತಿ ಅಲ್ಲ ಆದರೆ ನಿಷ್ಕಪಟದಿಂದ ತುಂಬಿದ, ಜೀವಿಸುವ ದೇವರಲ್ಲಿ ವಿಶ್ವಾಸವುಳ್ಳ ಒಂದು ನಾಗರಿಕತೆ(ಸಂಸ್ಕೃತಿ)ಆಗಿರುವದು.\nನಾವು ಅದರೊಳಗೆ ಪ್ರವೇಶ ಮಾಡಲು ಪ್ರಯಾಸ ಪಡೋಣ. ಯಾಕೆಂದರೆ ಒಂದು ದಿನ ಆ ಪಟ್ಟಣದೊಳಕ್ಕೆ ಪ್ರವೇಶಮಾಡಬೇಕು, ಎಂಬುದೇ ನನ್ನ ಸಂಪೂರ್ಣವಾದ ಉದ್ದೇಶವಾಗಿದೆ. ಮತ್ತು ಹಿಂದೆ ನೋಡಿ, ನಿಮ್ಮಲ್ಲಿ ಎಲ್ಲರೂ ಸಿಪಾಯಿಗಳಿಂತೆ ನನ್ನೊಂದಿಗೆ ಬಂದು “ಆ ಭಕ್ತರು ಮಾರ್ಚ್ ಮಾಡುತ್ತಾ ಹೋಗುವಾಗ, ನಾನು ಅವರೊಂದಿಗೆ ಒಬ್ಬನಾಗಿ ಇರಲು ಇಷ್ಟಪಡುತ್ತೇನೆ. ಆ ಭಕ್ತರು ನಡೆಯುತ್ತಾ ಹೋಗುವಾಗ ” ಎಂಬ ರಾಗವನ್ನು ಹಾಡುತ್ತಾ ಇರುವದನ್ನು ನೋಡಲು ಇಷ್ಟಪಡುತ್ತೇನೆ. ನಾವು ಪ್ರಾರ್ಥನೇ ಮಾಡೋಣ.\n88ಪರಲೋಕದ ಪ್ರಿಯ ತಂದೆಯೇ,ಈ ದಿನಗಳು ಹತ್ತಿರ ಬರುತ್ತಿರುವಾಗ ಮತ್ತು ನಾವು ಅದು ಹತ್ತಿರ ಬರುವದನ್ನು ನೋಡುವಾಗ, ಆ ವಾಗ್ದಾನವು ಹತ್ತಿರ ಬರುತ್ತಿದೆ. ಪ್ರೀಯ ದೇವರೇ ನೀನು, ನಾವು ಯಾವ ತಪ್ಪು ಮಾರ್ಗವನ್ನು ಹಿಡಿಯದಂತೆ, ನಮ್ಮ ಹೃದಯದಲ್ಲಿ ಆ ಆಶವನ್ನು ಹುಟ್ಟಿಸು ಎಂಬುದಾಗಿ, ನಿನ್ನನ್ನು ಪ್ರಾರ್ಥಿಸುವವರಾಗಿದ್ದೇವೆ.\nಪ್ರಿಯ ದೇವರೇ ನಮ್ಮ ಮನಸ್ಸಾಕ್ಷಿಯನ್ನು ಶುದ್ಧವಾಗಿಡಿಸು. ನಮ್ಮ ಹೃದಯವು ಪರದೆ ಮುಚ್ಚಲ್ಪಟ್ಟದ್ದಾಗಿರಲಿ. ಸ್ವಾಮೀ, ನಮ್ಮ ಕಣ್ಣುಗಳನ್ನು ಈ ಲೋಕದ ನೀಚ ಸಂಗತಿಗಳಿಂದ, ವ್ಯರ್ಥ ಸಂಗತಿಗಳಿಂದ, ಏನೋ ಒಬ್ಬ ಶ್ರೇಷ್ಠ ವ್ಯಕ್ತಿಯಾಗಬೇಕು ಎಂಬ ವ್ಯರ್ಥ ಮಹಿಮೆಯಿಂದ ಮುಚ್ಚಿಟ್ಟರು. ಎಲ್ಲಾ ರಾಜರು, ಅರಸುಗಳು, ಮಹಾಜನರು, ಮತ್ತಿನ್ನೆಲ್ಲಾ ಇತರರು, ಅವರು ಎಷ್ಟೇ ಶ್ರೇಷ್ಠರಾಗಿರಲಿ, ಅವರೆಲ್ಲರೂ ನಾಶವಾಗಲೇ ಬೇಕು. ಮತ್ತು ಅವರು ಪ್ರಥಮ ಪುನರುತ್ಥಾನದಲ್ಲಿ ಏಳುವದೇ ಇಲ್ಲ: ಯಾಕೆಂದರೆ ಈ ರೀತಿಯಾಗಿ ಬರೆಯಲ್ಪಟ್ಟಿದೆ ಪ್ರಥಮ ಪುನರುತ್ಥಾನದಲ್ಲಿ ಪಾಲುಳ್ಳವನು, ಅವನು ಧನ್ಯನೂ, ಪವಿತ್ರನೂ ಆಗಿದ್ದಾನೆ. ಆತನ ಮೇಲೆ ಎರಡನೇ ಮರಣವು ಯಾವ ಶಕ್ತಿಯನ್ನೂ ಹೊಂದಿಲ್ಲ. “ ಓ ದೇವರೇ, ಆ ಎರಡನೇ ಮರಣವು, ಆತ್ಮೀಕ ಮರಣವು, ಯಾವ...ಶಕ್ತಿಯನ್ನೂ ಹೊಂದಿಲ್ಲ. ಅವನು ರಕ್ಷಿಸಲ್ಪಟ್ಟಿದ್ದಾನೆ.\n89ಓ, ದೇವರೇ, ಈ ಸಮಯದ ಒಂದಾನೊಂದು ದಿನದಲ್ಲಿ ಒಬ್ಬನು ಇನ್ನೊಬ್ಬನನ್ನು ಭೇಟಿಯಾಗಲು ಹೋಗುವನು ಮತ್ತು ಎತ್ತಲ್ಪಡುವನು, “ಇಬ್ಬರು ಹಾಸಿಗೆಯಲ್ಲಿರುವರು. ನಾನು ಒಬ್ಬನನ್ನು ತೆಗೆದುಕೊಳ್ಳುವೆನು, ಇನ್ನೊಬ್ಬನನ್ನು ಬಿಡುವೆನು. ಇಬ್ಬರು ಹೊಲದಲ್ಲಿರುವರು, ನಾನು ಒಬ್ಬನನ್ನು ತೆಗೆದುಕೊಳ್ಳುವೆನು, ಇನ್ನೊಬ್ಬನನ್ನು ಬಿಡುವೆನು” ಈ ಎಲ್ಲಾ ಸಂಗತಿಗಳನ್ನು ಯೋಚಿಸುವದು ಕಠಿಣವಾಗಿದೆ.\nಓ ದೇವರೇ, ಸ್ವಾಮೀ ನಿಮ್ಮ ದೃಷ್ಟಿಯಲ್ಲಿ ನಾವು ಶುದ್ಧರಾಗಿ ಇರುವಂತೆ ನಮಗೆ ಸಹಾಯ ಮಾಡು. ಮನುಷ್ಯನು ನಮ್ಮ ವಿಷಯ ಏನನ್ನಾದರೂ ತಿಳುಕೊಳ್ಳಲಿ, ಇನ್ನೊಬ್ಬರು ಏನನ್ನಾದರೂ ಹೇಳಲಿ. ಸ್ವಾಮೀನಮ್ಮ ಮಾತುಗಳು ಪರಿಶುದ್ಧವಾಗಿರಲಿ. ಅದು ದೇವರ ವಾಕ್ಯದಿಂದ ಅಲಂಕರಿಸಲ್ಪಡಲಿ, ಎಷ್ಟು ಅಲಂಕರಿಸಲ್ಪಡಲಿ ಎಂದರೆ, ನಮ್ಮಲ್ಲಿ ಯಾವ ಕಪಟವೂ ಕಾಣದಿರಲಿ ಸ್ವಾಮೀ, ನಮ್ಮ ಎಲ್ಲಾ ತಪ್ಪುಗಳಲ್ಲಿ ಯೇಸು ಕ್ರಿಸ್ತನ ರಕ್ತವು, ನಮ್ಮ ಮತ್ತು ದೇವರ ನಡುವೆ ನಿಲ್ಲಲಿ, ಸ್ವಾಮೀ ಎಂದು ಯಾಚಿಸುತ್ತೇವೆ. ಆತನು ನಮ್ಮ ಮೇಲೆ ಯೇಸುವಿನ ರಕ್ತದ ಮೂಲಕವಾಗಿ ನೋಡಲಿ. ನಮ್ಮ ಸ್ವಂತ ನೀತಿಯ ಮೇಲೆ ಅಲ್ಲ ಅಥವಾ ನಾವು ಯಾರಾಗಿದ್ದೇವೆ, ನಾವು ಏನು ಮಾಡಿದ್ದೇವೆ ಎಂಬುದರ ಮೇಲೆ ಅಲ್ಲ. ಆದರೆ ಕೇವಲ ಆತ್ಮ ಕೃಪೆಯ ಮೇಲೆಯೇ. ದೇವರೇ ಇದನ್ನು ದಯಪಾಲಿಸು.\n90ಈ ರಾತ್ರಿ ಹೊತ್ತು ಇಲ್ಲಿ ಕೂತು, ಈ ಸುಸಮಾಚಾರವನ್ನು ಕೇಳಿದ. ಒಬ್ಬನೇ ಆದರೂ, ಒಂದು ಚಿಕ್ಕ ಮಗುವಿನಿಂದ ಹಿಡಿದು ಬಹಳ ಹರೆಯದ ಮನುಷ್ಯನವರೆಗೆ, ಯಾರೂ ನಾಶವಾಗದಿರಲಿ. ಅವರ ಪರಿಶುದ್ಧ ಇಚ್ಚೆಯು ಕೇವಲ ದೇವರಿಗೋಸ್ಕರವೂ, ಆತನ ವಾಕ್ಯಕ್ಕೋಸ್ಕರವೂ ಇರಲಿ. ನಾವು ಯಾವ ಗಳಿಗೆಯಲ್ಲಿ ಆತನು ಪ್ರತ್ಯಕ್ಷನಾಗುವನು ಅಥವಾ ಯಾವಗಳಿಗೆಯಲ್ಲಿ ಆತನು ನಮ್ಮನ್ನು ಅಲ್ಲಿ ಮೇಲೆ ಆ ನ್ಯಾಯಾಸನದ ಬಳಿ ಉತ್ತರವೀಯಲು ನಮ್ಮನ್ನು ಕರೆಯುವನು ಎಂದು ತಿಳಿಯದವರಾಗಿದ್ದೇವೆ. ಮತ್ತು ಯಾವ ಗಳಿಗೆಯಲ್ಲಿ ನಮ್ಮ ಪಟ್ಟಿಯನ್ನು ಆ ಕಪಾಟಿನಿಂದ ತೆಗೆದು, ಆತನು ನಮಗೆ “ಇದು ಮನೆಗೆ ಬರುವ ನಿನ್ನ ಸಮಯ, ನೀನು ಹೋಗಲೇ ಬೇಕು” ಎಂದು ಹೇಳುವನು ಎಂದು ನಮಗೆ ತಿಳಿದಿಲ್ಲ. ದೇವರೇ ನಮ್ಮನ್ನು ನಾವು ಶುದ್ಧವಾಗಿರಿಸಲು ಸಹಾಯಮಾಡು. ಇದನ್ನು ದಯಪಾಲಿಸು ಸ್ವಾಮೀ.\nಸಾಧ್ಯವಾದರೆ, ಕರ್ತನ ಬರೋಣದವರೆಗೆ ನಾವು ಜೀವಿಸುವಂತಾಗಲಿ, ನಮ್ಮ ಶಕ್ತಿಯಲ್ಲಿರುವ ಎಲ್ಲವನ್ನೂ ನಾವು ಪ್ರೀತಿಯಿಂದ ಮತ್ತು ತಿಳುವಳಿಕೆ ಯಿಂದ, ಪ್ರತಿಯೊಂದನ್ನು ಮಾಡುವಂತಾಗಲಿ ದೇವರು ಈ ದಿನದಲ್ಲಿ ಈ ಲೋಕದಲ್ಲಿ ಕಳೆದು ಹೋದ ಕು
